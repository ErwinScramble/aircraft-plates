<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aircraft MSN Locator</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f0f4f8; margin: 0; padding: 20px; color: #1a202c; }
        .container { max-width: 1100px; margin: 0 auto; text-align: center; }
        
        /* Visual Guide Area */
        .visual-guide { 
            background: white; border-radius: 20px; padding: 40px; margin: 20px auto 40px;
            max-width: 800px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); position: relative;
            border: 1px solid #e2e8f0;
        }
        .plane-svg { width: 100%; height: auto; fill: #cbd5e0; transition: all 0.5s; }
        
        /* Hotspots / Bubbles */
        .hotspot {
            position: absolute; width: 30px; height: 30px; background: #3182ce;
            border-radius: 50%; border: 4px solid white; display: none;
            box-shadow: 0 0 15px rgba(49, 130, 206, 0.5);
            z-index: 10; transform: translate(-50%, -50%);
        }
        .hotspot.active { display: block; animation: pulse 1.5s infinite; background: #e53e3e; }
        
        .label-bubble {
            position: absolute; background: #2d3748; color: white; padding: 8px 15px;
            border-radius: 8px; font-size: 13px; font-weight: 600; white-space: nowrap;
            bottom: 45px; left: 50%; transform: translateX(-50%); display: none;
        }
        .hotspot.active .label-bubble { display: block; }

        @keyframes pulse { 0% { transform: translate(-50%, -50%) scale(1); } 50% { transform: translate(-50%, -50%) scale(1.3); } 100% { transform: translate(-50%, -50%) scale(1); } }

        /* Hotspot Positions */
        .pos-nose { top: 60%; left: 18%; }
        .pos-cockpit { top: 42%; left: 32%; }
        .pos-gear { top: 65%; left: 52%; }
        .pos-tail { top: 35%; left: 82%; }

        .search-box { width: 100%; max-width: 600px; padding: 18px 25px; border-radius: 50px; border: 2px solid #cbd5e0; font-size: 18px; outline: none; margin-bottom: 30px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; text-align: left; }
        .card { background: white; padding: 20px; border-radius: 12px; border: 1px solid #e2e8f0; cursor: pointer; transition: 0.2s; }
        .card:hover { border-color: #3182ce; background: #f7fafc; }
        .location-bubble { background: #edf2f7; padding: 12px; border-radius: 8px; border-left: 4px solid #3182ce; font-size: 14px; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>✈️ Aircraft MSN Locator</h1>
        <p>Click a result to see the location on the map</p>
        
        <div class="visual-guide">
            <svg class="plane-svg" viewBox="0 0 500 200">
                <path d="M480,80 L450,40 L440,40 L450,80 L250,80 L200,20 L150,20 L220,80 L100,80 C80,80 20,90 20,110 C20,130 80,140 100,140 L450,140 C480,140 480,80 480,80 Z" />
            </svg>
            
            <div id="marker-nose" class="hotspot pos-nose"><div class="label-bubble">Nose Area</div></div>
            <div id="marker-cockpit" class="hotspot pos-cockpit"><div class="label-bubble">Cockpit / Entry</div></div>
            <div id="marker-gear" class="hotspot pos-gear"><div class="label-bubble">Main Gear / Wing</div></div>
            <div id="marker-tail" class="hotspot pos-tail"><div class="label-bubble">Tail Section</div></div>
        </div>

        <input type="text" id="searchInput" class="search-box" placeholder="Search (e.g. F-16, Boeing, Mi-8)...">
    </header>

    <div id="resultsGrid" class="grid"></div>
</div>

<script>
    let aircraftData = [];
    const filename = 'aircraft_plates_db.csv';

    function parseCSV(text) {
        const lines = text.split(/\r?\n/);
        const headers = lines[0].split(',');
        return lines.slice(1).filter(l => l.trim() !== "").map(line => {
            const values = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
            let obj = {};
            headers.forEach((h, i) => obj[h.trim()] = values[i] ? values[i].replace(/"/g, "").trim() : "");
            return obj;
        });
    }

    fetch(filename).then(res => res.text()).then(text => {
        aircraftData = parseCSV(text);
        displayResults(aircraftData);
    });

    document.getElementById('searchInput').addEventListener('input', (e) => {
        const term = e.target.value.toLowerCase();
        const filtered = aircraftData.filter(item => Object.values(item).join(' ').toLowerCase().includes(term));
        displayResults(filtered);
    });

    function highlightMarker(locationText) {
        document.querySelectorAll('.hotspot').forEach(h => h.classList.remove('active'));
        const text = locationText.toLowerCase();
        
        if(text.includes('nose') || text.includes('forward')) document.getElementById('marker-nose').classList.add('active');
        if(text.includes('cockpit') || text.includes('cabin') || text.includes('door')) document.getElementById('marker-cockpit').classList.add('active');
        if(text.includes('wheel') || text.includes('gear') || text.includes('wing') || text.includes('bay')) document.getElementById('marker-gear').classList.add('active');
        if(text.includes('tail') || text.includes('stabilizer') || text.includes('rear') || text.includes('fin')) document.getElementById('marker-tail').classList.add('active');
    }

    function displayResults(data) {
        const grid = document.getElementById('resultsGrid');
        grid.innerHTML = '';
        data.forEach(item => {
            const keys = Object.keys(item);
            const card = document.createElement('div');
            card.className = 'card';
            card.onclick = () => highlightMarker(item[keys[2]]);
            card.innerHTML = `
                <div style="color:#3182ce; font-size:11px; font-weight:700;">${item[keys[0]]}</div>
                <div style="font-size:18px; font-weight:700; margin:5px 0;">${item[keys[1]]}</div>
                <div class="location-bubble">📍 ${item[keys[2]]}</div>
            `;
            grid.appendChild(card);
        });
    }
</script>
</body>
</html>
