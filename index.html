<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aircraft Plate Locator</title>
    <style>
        body { font-family: sans-serif; margin: 20px; background: #f4f4f4; }
        .controls { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .image-container { position: relative; display: inline-block; max-width: 100%; }
        #aircraft-img { max-width: 100%; height: auto; display: block; border: 2px solid #ccc; }
        .dot {
            position: absolute; width: 20px; height: 20px; background: red;
            border-radius: 50%; transform: translate(-50%, -50%); cursor: pointer;
            border: 2px solid white;
        }
        .dot:hover::after {
            content: attr(data-info); position: absolute; top: 25px; left: 50%;
            transform: translateX(-50%); background: black; color: white;
            padding: 5px; border-radius: 4px; white-space: nowrap; z-index: 10;
        }
        .editor-panel { background: #eee; padding: 15px; border-radius: 8px; margin-top: 20px; display: none; }
        button { cursor: pointer; padding: 8px 12px; }
    </style>
</head>
<body>

    <h1>Aircraft Construction Number Locator</h1>

    <div class="controls">
        <select id="manufacturerSelect"><option value="">Select Manufacturer</option></select>
        <select id="typeSelect"><option value="">Select Type</option></select>
        <button id="toggleEditor">Toggle Editor Mode</button>
    </div>

    <div class="image-container" id="container">
        <img id="aircraft-img" src="" alt="Select an aircraft to view">
    </div>

    <div id="editorPanel" class="editor-panel">
        <h3>Editor Tools</h3>
        <p>Click on the image to place a new dot.</p>
        <button onclick="saveChanges()">Download Updated Data (JSON)</button>
        <p><small>Note: Upload the downloaded file back to GitHub to save permanently.</small></p>
    </div>

    <script>
        // Dit is je "database". Normaal laad je dit vanuit een data.json bestand.
        let aircraftData = {
            "Boeing": {
                "737-800": { img: "Images/boeing737.jpg", dots: [] }
            },
            "Airbus": {
                "A320": { img: "Images/a320.jpg", dots: [{x: 45, y: 60, info: "Left Main Gear Well"}] }
            }
        };

        const mSelect = document.getElementById('manufacturerSelect');
        const tSelect = document.getElementById('typeSelect');
        const img = document.getElementById('aircraft-img');
        const container = document.getElementById('container');
        const editorPanel = document.getElementById('editorPanel');
        let isEditor = false;

        // Init dropdowns
        function init() {
            mSelect.innerHTML = '<option value="">Select Manufacturer</option>';
            Object.keys(aircraftData).forEach(m => {
                mSelect.innerHTML += `<option value="${m}">${m}</option>`;
            });
        }

        mSelect.addEventListener('change', (e) => {
            const m = e.target.value;
            tSelect.innerHTML = '<option value="">Select Type</option>';
            if(m) {
                Object.keys(aircraftData[m]).forEach(t => {
                    tSelect.innerHTML += `<option value="${t}">${t}</option>`;
                });
            }
        });

        tSelect.addEventListener('change', loadAircraft);

        function loadAircraft() {
            const m = mSelect.value;
            const t = tSelect.value;
            if(!m || !t) return;

            const data = aircraftData[m][t];
            img.src = data.img;
            
            // Clear existing dots
            document.querySelectorAll('.dot').forEach(d => d.remove());

            // Place dots
            data.dots.forEach(dot => {
                createDot(dot.x, dot.y, dot.info);
            });
        }

        function createDot(x, y, info) {
            const dot = document.createElement('div');
            dot.className = 'dot';
            dot.style.left = x + "%";
            dot.style.top = y + "%";
            dot.setAttribute('data-info', info);
            container.appendChild(dot);
        }

        // Editor Logic
        document.getElementById('toggleEditor').onclick = () => {
            isEditor = !isEditor;
            editorPanel.style.display = isEditor ? 'block' : 'none';
        };

        img.onclick = (e) => {
            if(!isEditor) return;
            const rect = img.getBoundingClientRect();
            const x = ((e.clientX - rect.left) / rect.width) * 100;
            const y = ((e.clientY - rect.top) / rect.height) * 100;
            const info = prompt("Enter description for this location:");
            
            if(info) {
                const m = mSelect.value;
                const t = tSelect.value;
                aircraftData[m][t].dots.push({x, y, info});
                createDot(x, y, info);
            }
        };

        function saveChanges() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(aircraftData, null, 4));
            const downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href", dataStr);
            downloadAnchorNode.setAttribute("download", "aircraft_data.json");
            document.body.appendChild(downloadAnchorNode);
            downloadAnchorNode.click();
            downloadAnchorNode.remove();
        }

        init();
    </script>
</body>
</html>
