<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aircraft MSN Locator</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f0f4f8; margin: 0; padding: 20px; color: #1a202c; }
        .container { max-width: 1100px; margin: 0 auto; text-align: center; }
        
        /* De Visual Guide met de nieuwe silhouetten */
        .visual-guide { 
            background: white; border-radius: 24px; padding: 40px; margin: 20px auto 40px;
            max-width: 900px; min-height: 350px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); position: relative;
            border: 1px solid #e2e8f0; display: flex; align-items: center; justify-content: center;
        }
        
        svg { width: 85%; height: auto; fill: #cbd5e0; position: absolute; transition: opacity 0.3s; display: none; }
        svg.active { display: block; filter: drop-shadow(0 5px 15px rgba(0,0,0,0.1)); }
        
        /* De Rode Marker */
        .marker {
            position: absolute; width: 32px; height: 32px; background: #e53e3e;
            border-radius: 50%; border: 4px solid white; display: none;
            box-shadow: 0 0 20px rgba(229, 62, 62, 0.6); z-index: 100; transform: translate(-50%, -50%);
        }
        .marker.visible { display: block; animation: pulse 1.5s infinite; }
        
        /* De Tekstballon (Tooltip) */
        .speech-bubble {
            position: absolute; background: #2d3748; color: white; padding: 12px 18px;
            border-radius: 12px; font-size: 14px; font-weight: 600; min-width: 220px;
            bottom: 45px; left: 50%; transform: translateX(-50%); box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            line-height: 1.4; pointer-events: none;
        }
        .speech-bubble::after {
            content: ''; position: absolute; bottom: -8px; left: 50%; transform: translateX(-50%);
            border-width: 8px 8px 0; border-style: solid; border-color: #2d3748 transparent transparent;
        }

        @keyframes pulse { 0% { transform: translate(-50%, -50%) scale(1); } 50% { transform: translate(-50%, -50%) scale(1.2); } 100% { transform: translate(-50%, -50%) scale(1); } }
        
        /* Interface Styles */
        .search-box { width: 100%; max-width: 600px; padding: 18px 25px; border-radius: 50px; border: 2px solid #3182ce; font-size: 18px; margin-bottom: 25px; outline: none; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; text-align: left; }
        .card { background: white; padding: 20px; border-radius: 16px; border: 1px solid #e2e8f0; cursor: pointer; transition: 0.3s; position: relative; overflow: hidden; }
        .card:hover { border-color: #3182ce; transform: translateY(-3px); box-shadow: 0 8px 15px rgba(0,0,0,0.05); }
        .mfr-badge { color: #3182ce; font-size: 11px; font-weight: 800; text-transform: uppercase; margin-bottom: 5px; letter-spacing: 0.5px; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>✈️ Aircraft MSN Locator</h1>
        <div class="visual-guide">
            <!-- AIRLINER SILHOUETTE -->
            <svg id="img-airliner" class="active" viewBox="0 0 500 200">
                <path d="M430,90 C460,95 480,105 480,115 C480,125 460,135 430,140 L100,140 C60,140 20,125 20,110 C20,95 60,80 100,80 L400,80 L440,30 L460,30 L440,85 Z" fill="#cbd5e0"/>
                <path d="M180,110 L320,170 L360,170 L250,110 Z" fill="#a0aec0"/> <!-- Wing -->
            </svg>

            <!-- FIGHTER SILHOUETTE -->
            <svg id="img-fighter" viewBox="0 0 500 200">
                <path d="M20,100 L120,80 L180,80 L220,20 L280,20 L240,80 L400,80 L460,30 L480,30 L460,100 L480,170 L460,170 L400,120 L240,120 L280,180 L220,180 L180,120 L120,120 Z" fill="#cbd5e0"/>
                <path d="M350,100 L450,100 L450,85 L350,85 Z" fill="#718096"/> <!-- Detail -->
            </svg>

            <!-- HELICOPTER SILHOUETTE -->
            <svg id="img-heli" viewBox="0 0 500 200">
                <path d="M50,130 C50,100 100,60 220,60 L440,60 L460,30 L480,30 L460,80 L440,80 L250,80 C250,130 150,160 50,140 Z" fill="#cbd5e0"/>
                <path d="M180,60 L190,15 L260,15 L270,60 Z" fill="#718096"/> <!-- Rotor Base -->
                <path d="M100,15 L350,15 L350,20 L100,20 Z" fill="#4a5568"/> <!-- Blades -->
                <path d="M60,160 L220,160" stroke="#a0aec0" stroke-width="6" stroke-linecap="round"/> <!-- Skids -->
            </svg>
            
            <div id="marker" class="marker"><div id="bubble" class="speech-bubble">Location Info</div></div>
        </div>
        <input type="text" id="searchInput" class="search-box" placeholder="Search (e.g. F-16, Boeing, Bell, Mi-8)...">
    </header>
    <div id="resultsGrid" class="grid"></div>
</div>

<script>
    let aircraftData = [];
    const csvUrl = 'aircraft_plates_db.csv';
    
    // De categorieën voor de automatische wissel
    const categories = {
        fighter: ['f-16','f-15','f-35','mig','sukhoi','mirage','rafale','fighter','saab','stearman','a-10','tomcat','alpha jet','viggen','draken','l-159','l-29','mb326','mb339'],
        heli: ['bell','agusta','eurocopter','mil','sikorsky','kamov','lynx','heli','rotor','pumas','bo105','gazelle','alouette','cougar','ec135','ec145','nh90','merlin']
    };

    function parseCSV(text) {
        const lines = text.split(/\r?\n/);
        const headers = lines.split(',');
        return lines.slice(1).filter(l => l.trim() !== "").map(line => {
            const values = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
            let obj = {};
            headers.forEach((h, i) => obj[h.trim()] = values[i] ? values[i].replace(/^"|"$/g, "").trim() : "");
            return obj;
        });
    }

    fetch(csvUrl).then(res => res.text()).then(text => {
        aircraftData = parseCSV(text);
        displayResults(aircraftData);
    });

    function updateMarker(item) {
        const full = (item.Manufacturer + " " + item.Model).toLowerCase();
        const loc = item.Plate_Location.toLowerCase();
        
        let type = 'airliner';
        if (categories.fighter.some(k => full.includes(k))) type = 'fighter';
        if (categories.heli.some(k => full.includes(k))) type = 'heli';

        document.querySelectorAll('svg').forEach(s => s.classList.remove('active'));
        document.getElementById('img-' + type).classList.add('active');

        const marker = document.getElementById('marker');
        const bubble = document.getElementById('bubble');
        marker.classList.add('visible');
        bubble.innerText = item.Plate_Location;

        let x = 50, y = 50;
        
        // Coördinaten per type afstellen
        if (type === 'airliner') {
            if (loc.includes('nose') || loc.includes('forward')) { x = 12; y = 115; }
            else if (loc.includes('tail') || loc.includes('rear') || loc.includes('stabilizer')) { x = 86; y = 90; }
            else if (loc.includes('cockpit') || loc.includes('door')) { x = 28; y = 95; }
            else if (loc.includes('wheel') || loc.includes('gear') || loc.includes('bay')) { x = 45; y = 135; }
        } else if (type === 'fighter') {
            if (loc.includes('nose') || loc.includes('radar')) { x = 12; y = 100; }
            else if (loc.includes('tail') || loc.includes('rear') || loc.includes('fin')) { x = 86; y = 85; }
            else if (loc.includes('cockpit') || loc.includes('canopy')) { x = 32; y = 85; }
            else if (loc.includes('wheel') || loc.includes('gear') || loc.includes('bay')) { x = 55; y = 110; }
        } else if (type === 'heli') {
            if (loc.includes('nose') || loc.includes('front')) { x = 18; y = 115; }
            else if (loc.includes('boom') || loc.includes('tail')) { x = 82; y = 75; }
            else if (loc.includes('cockpit') || loc.includes('console') || loc.includes('pedal')) { x = 38; y = 105; }
            else if (loc.includes('ceiling') || loc.includes('radio') || loc.includes('overhead')) { x = 45; y = 75; }
            else { x = 45; y = 105; }
        }
        
        // Zet de coördinaten om naar pixels op basis van de 500x200 viewbox
        marker.style.left = (x/500 * 100) + "%"; 
        marker.style.top = (y/200 * 100) + "%";
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
        const term = e.target.value.toLowerCase();
        const filtered = aircraftData.filter(item => Object.values(item).join(' ').toLowerCase().includes(term));
        displayResults(filtered);
    });

    function displayResults(data) {
        const grid = document.getElementById('resultsGrid');
        grid.innerHTML = '';
        data.forEach(item => {
            const card = document.createElement('div');
            card.className = 'card';
            card.onclick = () => { updateMarker(item); window.scrollTo({top: 0, behavior: 'smooth'}); };
            card.innerHTML = `
                <div class="mfr-badge">${item.Manufacturer}</div>
                <div style="font-size:18px; font-weight:700; margin-bottom:5px;">${item.Model}</div>
                <div style="font-size:13px; color:#4a5568;">📍 ${item.Plate_Location}</div>
            `;
            grid.appendChild(card);
        });
    }
</script>
</body>
</html>
