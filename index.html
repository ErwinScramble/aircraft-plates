<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aircraft MSN Locator</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root { --primary: #2563eb; --dark: #1e293b; --bg: #f8fafc; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); margin: 0; padding: 20px; color: var(--dark); }
        .container { max-width: 1100px; margin: 0 auto; text-align: center; }
        
        /* Realistic Display Area */
        .display-unit { 
            background: white; border-radius: 24px; padding: 30px; margin: 20px auto;
            max-width: 900px; height: 350px; box-shadow: 0 15px 35px rgba(0,0,0,0.05);
            position: relative; border: 1px solid #e2e8f0;
            display: flex; align-items: center; justify-content: center;
        }
        
        .aircraft-profile { width: 85%; height: auto; display: none; filter: drop-shadow(0 10px 20px rgba(0,0,0,0.1)); }
        .active { display: block; }

        /* Marker & Bubble */
        .marker {
            position: absolute; width: 22px; height: 22px; background: #ef4444;
            border-radius: 50%; border: 3px solid white; display: none;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.6); z-index: 100;
            transform: translate(-50%, -50%); pointer-events: none;
        }
        .marker.active { display: block; animation: pulse 1.5s infinite; }
        
        .bubble {
            position: absolute; background: var(--dark); color: white; padding: 10px 15px;
            border-radius: 10px; font-size: 13px; font-weight: 600; width: 200px;
            bottom: 35px; left: 50%; transform: translateX(-50%); box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        @keyframes pulse { 0% { transform: translate(-50%, -50%) scale(1); } 50% { transform: translate(-50%, -50%) scale(1.2); } 100% { transform: translate(-50%, -50%) scale(1); } }

        .search-box { width: 100%; max-width: 600px; padding: 18px 25px; border-radius: 50px; border: 2px solid #e2e8f0; font-size: 17px; outline: none; margin-bottom: 25px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; text-align: left; }
        .card { background: white; padding: 15px; border-radius: 15px; border: 1px solid #e2e8f0; cursor: pointer; transition: 0.2s; }
        .card:hover { border-color: var(--primary); background: #f0f7ff; }
        .card.selected { border-color: var(--primary); background: #eff6ff; border-width: 2px; }

        .editor-ui { background: var(--dark); color: white; padding: 15px; border-radius: 12px; margin-bottom: 20px; text-align: left; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>✈️ Aircraft MSN Locator</h1>

    <div id="editorPanel" class="editor-ui">
        <strong>Editor:</strong> Click profile to get coordinates.<br>
        <div id="logMsg" style="font-family:monospace; margin-top:5px; color:#10b981;">Select an aircraft first...</div>
    </div>

    <button onclick="toggleEditor()" style="margin-bottom:15px; cursor:pointer;">Toggle Editor</button>

    <div class="display-unit" id="canvas" onclick="handleMapClick(event)">
        <!-- 1. Airliner -->
        <svg id="view-airliner" class="aircraft-profile active" viewBox="0 0 500 200">
            <path d="M50,110 L400,110 C430,110 460,100 470,90 L450,30 L430,30 L445,90 L100,90 C70,90 40,100 40,110 Z" fill="#cbd5e0"/>
            <path d="M120,110 L250,160 L300,160 L200,110 Z" fill="#94a3b8"/>
        </svg>
        <!-- 2. Fighter -->
        <svg id="view-fighter" class="aircraft-profile" viewBox="0 0 500 200">
            <path d="M20,110 L120,100 L250,100 L280,40 L340,40 L310,100 L450,100 L470,130 L450,150 L100,150 L20,110 Z" fill="#94a3b8"/>
        </svg>
        <!-- 3. Heli -->
        <svg id="view-heli" class="aircraft-profile" viewBox="0 0 500 200">
            <path d="M60,150 C30,150 30,90 80,70 L450,70 L470,30 L490,30 L470,90 L250,90 C250,150 150,170 60,150 Z" fill="#cbd5e0"/>
        </svg>

        <div id="marker" class="marker"><div id="bubble" class="bubble">Info</div></div>
    </div>

    <input type="text" id="search" class="search-box" placeholder="Search (e.g. F-16, Bell, Boeing)...">
    <div id="results" class="grid"></div>
</div>

<script>
    let db = [];
    let selected = null;
    let editMode = false;

    fetch('aircraft_plates_db.csv').then(r => r.text()).then(t => {
        const rows = t.split(/\r?\n/).slice(1);
        db = rows.filter(r => r.trim()).map(r => {
            // Split op komma maar negeer komma's in quotes
            const c = r.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
            return {
                mfr: c[0] || "",
                model: c[1] || "",
                loc: (c[2] || "").replace(/"/g, ""),
                note: (c[3] || "").replace(/"/g, ""),
                cat: (c[4] || "Airliner").trim(),
                x: c[5] || null,
                y: c[6] || null
            };
        });
        render();
    });

    function render(filter = '') {
        const grid = document.getElementById('results');
        grid.innerHTML = '';
        db.filter(i => (i.mfr+i.model).toLowerCase().includes(filter.toLowerCase())).forEach(item => {
            const card = document.createElement('div');
            card.className = `card ${selected === item ? 'selected' : ''}`;
            card.innerHTML = `<strong>${item.mfr}</strong><br>${item.model}<br><small>📍 ${item.loc}</small>`;
            card.onclick = () => selectAircraft(item);
            grid.appendChild(card);
        });
    }

    function selectAircraft(item) {
        selected = item;
        render(document.getElementById('search').value);
        
        // Wissel afbeelding
        document.querySelectorAll('.aircraft-profile').forEach(p => p.classList.remove('active'));
        let cat = item.cat.toLowerCase();
        let target = 'view-airliner';
        if(cat.includes('fighter') || cat.includes('jet')) target = 'view-fighter';
        if(cat.includes('heli')) target = 'view-heli';
        document.getElementById(target).classList.add('active');

        // Toon Marker
        const m = document.getElementById('marker');
        if(item.x && item.y) {
            m.style.left = item.x + '%'; m.style.top = item.y + '%';
            m.classList.add('active');
            document.getElementById('bubble').innerText = item.loc;
        } else { m.classList.remove('active'); }
        window.scrollTo({top: 0, behavior: 'smooth'});
    }

    function handleMapClick(e) {
        if(!editMode || !selected) return;
        const rect = document.getElementById('canvas').getBoundingClientRect();
        const x = Math.round(((e.clientX - rect.left) / rect.width) * 100);
        const y = Math.round(((e.clientY - rect.top) / rect.height) * 100);
        
        document.getElementById('marker').style.left = x + '%';
        document.getElementById('marker').style.top = y + '%';
        document.getElementById('marker').classList.add('active');
        document.getElementById('bubble').innerText = selected.loc;

        const row = `${selected.mfr},${selected.model},"${selected.loc}","${selected.note}",${selected.cat},${x},${y}`;
        document.getElementById('logMsg').innerText = "Paste this line: " + row;
    }

    function toggleEditor() {
        editMode = !editMode;
        document.getElementById('editorPanel').style.display = editMode ? 'block' : 'none';
    }

    document.getElementById('search').oninput = (e) => render(e.target.value);
</script>
</body>
</html>
