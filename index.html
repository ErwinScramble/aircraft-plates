<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aircraft MSN Locator - Professional</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f0f4f8; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; text-align: center; }
        
        /* De Visual Guide met Blueprint-stijl */
        .visual-guide { 
            background: #ffffff; border-radius: 20px; padding: 20px; margin: 20px auto;
            max-width: 800px; height: 300px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
            position: relative; border: 2px solid #3182ce;
            display: flex; align-items: center; justify-content: center;
        }
        
        .blueprint { width: 100%; height: 100%; object-fit: contain; pointer-events: none; opacity: 0.8; }
        
        /* De Rode Marker (Nu echt zichtbaar) */
        .marker {
            position: absolute; width: 24px; height: 24px; background: #ff0000;
            border-radius: 50%; border: 3px solid white; display: none;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.8); z-index: 999;
            transform: translate(-50%, -50%); pointer-events: none;
        }
        .marker.active { display: block; animation: pulse 1s infinite; }

        @keyframes pulse { 0% { transform: translate(-50%, -50%) scale(1); } 50% { transform: translate(-50%, -50%) scale(1.3); } 100% { transform: translate(-50%, -50%) scale(1); } }

        /* Editor Menu */
        .editor-box { background: #2d3748; color: white; padding: 15px; border-radius: 10px; margin-bottom: 20px; text-align: left; display: none; }
        .search-box { width: 100%; padding: 15px; border-radius: 30px; border: 2px solid #3182ce; margin-bottom: 20px; font-size: 16px; outline: none; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; text-align: left; }
        .card { background: white; padding: 15px; border-radius: 12px; border: 1px solid #e2e8f0; cursor: pointer; }
        .card:hover { border-color: #3182ce; }
        .card.selected { background: #ebf8ff; border-color: #3182ce; }
    </style>
</head>
<body>

<div class="container">
    <h1>✈️ Aircraft MSN Locator</h1>

    <div id="editor" class="editor-box">
        <strong>Editor Mode:</strong> Click on the blueprint to set marker.<br>
        <code id="output" style="color:#63b3ed">Select aircraft first...</code>
    </div>

    <button onclick="toggleEditor()" style="margin-bottom:15px; cursor:pointer;">Toggle Editor</button>

    <div class="visual-guide" id="clickArea" onclick="setPoint(event)">
        <!-- We gebruiken hier SVG paden die ECHT lijken op de types -->
        <svg id="svg-display" viewBox="0 0 100 100" style="width:100%; height:100%;">
            <!-- Airliner Shape -->
            <g id="shape-airliner">
                <path d="M10,50 Q10,40 50,40 L90,40 Q95,40 95,50 Q95,60 90,60 L10,60 Z" fill="#cbd5e0"/>
                <path d="M70,40 L85,20 L95,20 L85,40 Z" fill="#a0aec0"/> 
                <path d="M40,60 L60,85 L75,85 L55,60 Z" fill="#718096"/>
            </g>
            <!-- Heli Shape -->
            <g id="shape-heli" style="display:none">
                <path d="M20,60 C10,60 10,40 30,35 L80,35 L95,20 L95,50 L80,50 L40,55 C40,70 30,75 20,60 Z" fill="#cbd5e0"/>
                <rect x="30" y="15" width="40" height="4" fill="#4a5568"/>
            </g>
        </svg>
        <div id="marker" class="marker"></div>
    </div>

    <input type="text" id="search" class="search-box" placeholder="Type to search (e.g. Boeing, Cessna, Bell)...">
    <div id="results" class="grid"></div>
</div>

<script>
    let data = [];
    let selectedItem = null;
    let isEdit = false;

    // Inladen Data
    fetch('aircraft_plates_db.csv').then(r => r.text()).then(t => {
        const rows = t.split('\n').slice(1);
        data = rows.filter(r => r.trim()).map(r => {
            const c = r.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
            return { mfr: c[0], model: c[1], loc: c[2], note: c[3], cat: c[4], x: c[5], y: c[6] };
        });
        render();
    });

    function render(filter = '') {
        const grid = document.getElementById('results');
        grid.innerHTML = '';
        data.filter(i => (i.mfr+i.model).toLowerCase().includes(filter.toLowerCase())).forEach(item => {
            const div = document.createElement('div');
            div.className = 'card';
            div.innerHTML = `<strong>${item.mfr}</strong><br>${item.model}<br><small>${item.loc}</small>`;
            div.onclick = () => select(item, div);
            grid.appendChild(div);
        });
    }

    function select(item, el) {
        selectedItem = item;
        document.querySelectorAll('.card').forEach(c => c.classList.remove('selected'));
        el.classList.add('selected');

        // Toon juiste vorm
        document.getElementById('shape-airliner').style.display = (item.cat === 'Heli') ? 'none' : 'block';
        document.getElementById('shape-heli').style.display = (item.cat === 'Heli') ? 'block' : 'none';

        // Toon Stip
        const m = document.getElementById('marker');
        if(item.x && item.y) {
            m.style.left = item.x + '%';
            m.style.top = item.y + '%';
            m.classList.add('active');
        } else {
            m.classList.remove('active');
        }
        window.scrollTo({top: 0, behavior: 'smooth'});
    }

    function setPoint(e) {
        if(!isEdit || !selectedItem) return;
        const rect = document.getElementById('clickArea').getBoundingClientRect();
        const x = Math.round(((e.clientX - rect.left) / rect.width) * 100);
        const y = Math.round(((e.clientY - rect.top) / rect.height) * 100);
        
        document.getElementById('marker').style.left = x + '%';
        document.getElementById('marker').style.top = y + '%';
        document.getElementById('marker').classList.add('active');
        
        const newLine = `${selectedItem.mfr},${selectedItem.model},"${selectedItem.loc}","${selectedItem.note}",${selectedItem.cat},${x},${y}`;
        document.getElementById('output').innerText = "Copy to CSV: " + newLine;
    }

    function toggleEditor() {
        isEdit = !isEdit;
        document.getElementById('editor').style.display = isEdit ? 'block' : 'none';
    }

    document.getElementById('search').oninput = (e) => render(e.target.value);
</script>
</body>
</html>
