<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aircraft MSN Locator</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f0f4f8; margin: 0; padding: 20px; color: #1a202c; }
        .container { max-width: 1100px; margin: 0 auto; text-align: center; }
        .visual-guide { 
            background: white; border-radius: 24px; padding: 20px; margin: 20px auto 40px;
            max-width: 900px; min-height: 300px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); position: relative;
            border: 1px solid #e2e8f0; display: flex; align-items: center; justify-content: center;
        }
        svg { width: 90%; height: auto; fill: #cbd5e0; position: absolute; transition: opacity 0.3s; display: none; }
        svg.active { display: block; }
        .marker {
            position: absolute; width: 25px; height: 25px; background: #e53e3e;
            border-radius: 50%; border: 3px solid white; display: none;
            box-shadow: 0 0 20px rgba(229, 62, 62, 0.6); z-index: 100; transform: translate(-50%, -50%);
        }
        .marker.visible { display: block; animation: pulse 1.5s infinite; }
        .speech-bubble {
            position: absolute; background: #2d3748; color: white; padding: 12px 18px;
            border-radius: 12px; font-size: 14px; font-weight: 600; width: 220px;
            bottom: 40px; left: 50%; transform: translateX(-50%); box-shadow: 0 10px 15px rgba(0,0,0,0.2);
        }
        @keyframes pulse { 0% { transform: translate(-50%, -50%) scale(1); } 50% { transform: translate(-50%, -50%) scale(1.3); } 100% { transform: translate(-50%, -50%) scale(1); } }
        .search-box { width: 100%; max-width: 600px; padding: 18px 25px; border-radius: 50px; border: 2px solid #3182ce; font-size: 18px; margin-bottom: 25px; outline: none; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; text-align: left; }
        .card { background: white; padding: 20px; border-radius: 16px; border: 1px solid #e2e8f0; cursor: pointer; transition: 0.3s; }
        .card:hover { border-color: #3182ce; transform: translateY(-3px); }
        .mfr-badge { color: #3182ce; font-size: 11px; font-weight: 800; text-transform: uppercase; margin-bottom: 5px; }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1>✈️ Aircraft MSN Locator</h1>
        <div class="visual-guide">
            <!-- AIRLINER -->
            <svg id="img-airliner" class="active" viewBox="0 0 512 200">
                <path d="M450,100 C480,105 500,115 500,125 C500,135 480,145 450,150 L100,150 C60,150 20,135 20,120 C20,105 60,90 100,90 L420,90 L460,40 L480,40 L460,95 Z" />
                <path d="M180,120 L350,180 L380,180 L280,120 Z" fill="#a0aec0" />
            </svg>
            <!-- FIGHTER -->
            <svg id="img-fighter" viewBox="0 0 512 200">
                <path d="M20,110 L150,90 L250,90 L280,30 L350,30 L320,90 L450,90 L480,40 L500,40 L480,110 L500,180 L480,180 L450,130 L320,130 L350,190 L280,190 L250,130 L150,130 Z" />
            </svg>
            <!-- HELICOPTER -->
            <svg id="img-heli" viewBox="0 0 512 200">
                <path d="M50,140 C50,110 100,70 240,70 L460,70 L480,40 L500,40 L480,90 L460,90 L280,90 C280,140 180,170 50,150 Z" />
                <path d="M200,70 L210,20 L280,20 L290,70 Z" fill="#718096" />
                <path d="M100,20 L400,20 L400,25 L100,25 Z" fill="#4a5568" />
            </svg>
            <div id="marker" class="marker"><div id="bubble" class="speech-bubble">Location</div></div>
        </div>
        <input type="text" id="searchInput" class="search-box" placeholder="Search (e.g. F-16, Boeing, Bell, Mi-8)...">
    </header>
    <div id="resultsGrid" class="grid"></div>
</div>
<script>
    let aircraftData = [];
    const csvUrl = 'aircraft_plates_db.csv';
    const categories = {
        fighter: ['f-16','f-15','mig','sukhoi','mirage','rafale','fighter','saab','stearman','a-10','tomcat','viggen','draken','l-159','l-29'],
        heli: ['bell','agusta','eurocopter','mil','sikorsky','kamov','lynx','heli','rotor','pumas','bo105','gazelle','alouette','nh90','merlin']
    };

    function parseCSV(text) {
        const lines = text.split(/\r?\n/);
        const headers = lines[0].split(',');
        return lines.slice(1).filter(l => l.trim() !== "").map(line => {
            const values = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
            let obj = {};
            headers.forEach((h, i) => obj[h.trim()] = values[i] ? values[i].replace(/^"|"$/g, "").trim() : "");
            return obj;
        });
    }

    fetch(csvUrl).then(res => res.text()).then(text => {
        aircraftData = parseCSV(text);
        displayResults(aircraftData);
    });

    function updateMarker(item) {
        const full = (item.Manufacturer + " " + item.Model).toLowerCase();
        const loc = item.Plate_Location.toLowerCase();
        let type = 'airliner';
        if (categories.fighter.some(k => full.includes(k))) type = 'fighter';
        if (categories.heli.some(k => full.includes(k))) type = 'heli';
        
        document.querySelectorAll('svg').forEach(s => s.classList.remove('active'));
        document.getElementById('img-' + type).classList.add('active');
        
        const marker = document.getElementById('marker');
        const bubble = document.getElementById('bubble');
        marker.classList.add('visible');
        bubble.innerText = item.Plate_Location;

        let x = 50, y = 50;
        if (type === 'airliner') {
            if (loc.includes('nose')) { x = 12; y = 125; }
            else if (loc.includes('tail') || loc.includes('rear')) { x = 88; y = 95; }
            else if (loc.includes('cockpit') || loc.includes('door')) { x = 28; y = 105; }
            else if (loc.includes('wheel') || loc.includes('gear')) { x = 50; y = 145; }
        } else if (type === 'fighter') {
            if (loc.includes('nose')) { x = 10; y = 110; }
            else if (loc.includes('tail') || loc.includes('rear')) { x = 88; y = 90; }
            else if (loc.includes('cockpit')) { x = 32; y = 95; }
            else if (loc.includes('wheel') || loc.includes('gear')) { x = 55; y = 130; }
        } else if (type === 'heli') {
            if (loc.includes('nose')) { x = 18; y = 135; }
            else if (loc.includes('boom') || loc.includes('tail')) { x = 85; y = 85; }
            else if (loc.includes('cockpit') || loc.includes('console')) { x = 38; y = 125; }
            else { x = 45; y = 85; }
        }
        marker.style.left = x + "%"; marker.style.top = y + "%";
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
        const term = e.target.value.toLowerCase();
        const filtered = aircraftData.filter(item => Object.values(item).join(' ').toLowerCase().includes(term));
        displayResults(filtered);
    });

    function displayResults(data) {
        const grid = document.getElementById('resultsGrid');
        grid.innerHTML = '';
        data.forEach(item => {
            const card = document.createElement('div');
            card.className = 'card';
            card.onclick = () => { updateMarker(item); window.scrollTo({top: 0, behavior: 'smooth'}); };
            card.innerHTML = `<div class="mfr-badge">${item.Manufacturer}</div><div style="font-size:18px; font-weight:700; margin-bottom:5px;">${item.Model}</div><div style="font-size:13px; color:#4a5568;">📍 ${item.Plate_Location}</div>`;
            grid.appendChild(card);
        });
    }
</script>
</body>
</html>
