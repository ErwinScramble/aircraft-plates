<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aircraft Plates Database</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; padding: 20px; background: #f0f2f5; color: #333; margin: 0; }
        .container { max-width: 800px; margin: 20px auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #1a73e8; margin-top: 0; }
        label { font-weight: bold; display: block; margin-top: 15px; }
        select, input, button { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        .image-container { position: relative; width: 100%; margin-top: 20px; display: none; line-height: 0; overflow: hidden; border-radius: 8px; background: #eee; border: 1px solid #ddd; }
        #vliegtuig-beeld { width: 100%; height: auto; display: block; cursor: crosshair; }
        .dot { position: absolute; width: 18px; height: 18px; background: #ff0000; border: 2px solid #fff; border-radius: 50%; transform: translate(-50%, -50%); cursor: pointer; box-shadow: 0 0 8px rgba(0,0,0,0.5); z-index: 5; }
        .dot::after { content: attr(data-info); position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.85); color: white; padding: 6px 12px; border-radius: 4px; font-size: 13px; white-space: nowrap; display: none; z-index: 10; pointer-events: none; }
        .dot:hover::after { display: block; }
        .admin-panel { margin-top: 40px; padding-top: 20px; border-top: 2px dashed #ccc; }
        .admin-box { background: #f8f9fa; padding: 15px; border-radius: 8px; border: 1px solid #e9ecef; margin-top: 10px; }
        .dot-item { background: white; margin: 5px 0; padding: 8px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; }
        .btn-save { background: #28a745; color: white; border: none; font-weight: bold; cursor: pointer; }
        .btn-export { background: #17a2b8; color: white; border: none; cursor: pointer; margin-top: 10px; font-weight: bold; }
        .hidden { display: none; }
        .small-btn { padding: 5px 10px; width: auto; font-size: 12px; background: #6c757d; color: white; border: none; cursor: pointer; border-radius: 4px; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Aircraft Plates</h1>
    
    <label>1. Manufacturer:</label>
    <select id="select-fabrikant" onchange="updateTypes()">
        <option value="">-- Select Manufacturer --</option>
    </select>

    <label>2. Aircraft Type:</label>
    <select id="select-type" onchange="showImage()">
        <option value="">-- Select Type --</option>
    </select>

    <div class="image-container" id="wrapper">
        <img id="vliegtuig-beeld" src="" alt="Aircraft Plate" onclick="handleImageClick(event)">
        <div id="dots-layer"></div>
    </div>

    <div class="admin-panel">
        <button id="auth-btn" onclick="authenticateEditor()" style="background:#6c757d; color:white; border:none; cursor:pointer;">Editor Login</button>
        
        <div id="admin-controls" class="hidden">
            <div class="admin-box">
                <h3>Editor Menu</h3>
                <input type="text" id="new-fabrikant" placeholder="Manufacturer (e.g. Boeing)">
                <input type="text" id="new-type" placeholder="Type (e.g. 737)">
                
                <label>Select Image from Folder:</label>
                <button type="button" class="small-btn" onclick="fetchImagesFromGitHub()">Refresh Image List</button>
                <select id="new-image-select">
                    <option value="">-- Click refresh or type name below --</option>
                </select>
                <input type="text" id="new-image-manual" placeholder="Or manually type filename (e.g. b737.jpg)">
                
                <button class="btn-save" onclick="addEntry()">Save Aircraft</button>
                
                <div id="dot-editor" class="hidden">
                    <hr>
                    <h4>Manage Dots</h4>
                    <ul id="current-dots" style="list-style:none; padding:0;"></ul>
                </div>
                <hr>
                <h4>Backup & Publish</h4>
                <button class="btn-export" onclick="exportData()">Generate Backup Code</button>
                <textarea id="export-area" style="width:100%; height:80px; margin-top:10px; font-size:10px; font-family:monospace;" readonly></textarea>
            </div>
        </div>
    </div>
</div>

<script src="data.js"></script>

<script>
    let githubData = (typeof permanentData !== 'undefined') ? permanentData : {};
    let localData = JSON.parse(localStorage.getItem('aircraftDB')) || {};
    let aircraftData = JSON.parse(JSON.stringify(githubData));
    
    for (let fab in localData) {
        if (!aircraftData[fab]) aircraftData[fab] = {};
        for (let type in localData[fab]) {
            aircraftData[fab][type] = localData[fab][type];
        }
    }

    let isEditor = false;

    // --- NIEUW: AFBEELDINGEN OPHALEN VAN GITHUB ---
    async function fetchImagesFromGitHub() {
        const repoUser = "ErwinScramble";
        const repoName = "aircraft-plates";
        const folderPath = "Images";
        const url = `https://github.com{repoUser}/${repoName}/contents/${folderPath}`;

        try {
            const response = await fetch(url);
            const files = await response.json();
            const select = document.getElementById('new-image-select');
            select.innerHTML = '<option value="">-- Choose a file --</option>';

            files.forEach(file => {
                if (file.type === "file") {
                    let opt = document.createElement('option');
                    opt.value = file.name;
                    opt.innerHTML = file.name;
                    select.appendChild(opt);
                }
            });
            alert("Image list updated!");
        } catch (error) {
            console.error(error);
            alert("Could not fetch images. Make sure the repo is public and folder name 'Images' is correct.");
        }
    }

    function authenticateEditor() {
        const pass = prompt("Enter Editor Access Key:");
        if(pass === "Scr@mble-Pl@tes") { 
            isEditor = true;
            document.getElementById('admin-controls').classList.remove('hidden');
            document.getElementById('auth-btn').innerText = "Editor Mode: ACTIVE";
            document.getElementById('auth-btn').style.background = "#28a745";
            checkDotEditorVisibility();
        } else { alert("Wrong key!"); }
    }

    function addEntry() {
        const fab = document.getElementById('new-fabrikant').value.trim();
        const type = document.getElementById('new-type').value.trim();
        
        // Check dropdown eerst, anders handmatig veld
        const imgSelect = document.getElementById('new-image-select').value;
        const imgManual = document.getElementById('new-image-manual').value.trim();
        const img = imgSelect || imgManual;

        if(!fab || !type || !img) return alert('Fill in all fields');

        if(!localData[fab]) localData[fab] = {};
        const dots = (aircraftData[fab] && aircraftData[fab][type]) ? aircraftData[fab][type].dots : [];
        
        localData[fab][type] = { img: img, dots: dots };
        localStorage.setItem('aircraftDB', JSON.stringify(localData));
        
        alert('Saved to browser!');
        location.reload();
    }

    // --- DE REST VAN DE FUNCTIES BLIJVEN HETZELFDE ---
    function exportData() {
        const dataStr = "const permanentData = " + JSON.stringify(aircraftData, null, 2) + ";";
        document.getElementById('export-area').value = dataStr;
        document.getElementById('export-area').select();
        alert("Backup code generated!");
    }

    function loadManufacturers() {
        const fabSelect = document.getElementById('select-fabrikant');
        fabSelect.innerHTML = '<option value="">-- Select Manufacturer --</option>';
        Object.keys(aircraftData).sort().forEach(fab => {
            let opt = document.createElement('option');
            opt.value = fab; opt.innerHTML = fab;
            fabSelect.appendChild(opt);
        });
    }

    function updateTypes() {
        const fab = document.getElementById('select-fabrikant').value;
        const typeSelect = document.getElementById('select-type');
        typeSelect.innerHTML = '<option value="">-- Select Type --</option>';
        if(aircraftData[fab]) {
            Object.keys(aircraftData[fab]).sort().forEach(type => {
                let opt = document.createElement('option');
                opt.value = type; opt.innerHTML = type;
                typeSelect.appendChild(opt);
            });
        }
        showImage();
    }

    function showImage() {
        const fab = document.getElementById('select-fabrikant').value;
        const type = document.getElementById('select-type').value;
        const wrapper = document.getElementById('wrapper');
        const imgTag = document.getElementById('vliegtuig-beeld');
        if(fab && type && aircraftData[fab][type]) {
            imgTag.src = "Images/" + aircraftData[fab][type].img;
            imgTag.onload = () => { wrapper.style.display = "block"; renderDots(); };
            imgTag.onerror = () => { wrapper.style.display = "none"; };
        } else { wrapper.style.display = "none"; }
        checkDotEditorVisibility();
    }

    function handleImageClick(event) {
        if(!isEditor) return;
        const fab = document.getElementById('select-fabrikant').value;
        const type = document.getElementById('select-type').value;
        if(!fab || !type) return;

        const rect = event.target.getBoundingClientRect();
        const x = ((event.clientX - rect.left) / rect.width) * 100;
        const y = ((event.clientY - rect.top) / rect.height) * 100;
        const info = prompt("Location description:");
        if(info) {
            if(!localData[fab]) localData[fab] = {};
            if(!localData[fab][type]) localData[fab][type] = JSON.parse(JSON.stringify(aircraftData[fab][type]));
            
            localData[fab][type].dots.push({ x: x, y: y, info: info });
            localStorage.setItem('aircraftDB', JSON.stringify(localData));
            
            aircraftData[fab][type] = localData[fab][type];
            renderDots(); renderDotList();
        }
    }

    function deleteDot(i) {
        const fab = document.getElementById('select-fabrikant').value;
        const type = document.getElementById('select-type').value;
        if(!localData[fab]) localData[fab] = {};
        if(!localData[fab][type]) localData[fab][type] = JSON.parse(JSON.stringify(aircraftData[fab][type]));
        localData[fab][type].dots.splice(i, 1);
        localStorage.setItem('aircraftDB', JSON.stringify(localData));
        aircraftData[fab][type] = localData[fab][type];
        renderDots(); renderDotList();
    }

    function checkDotEditorVisibility() {
        const type = document.getElementById('select-type').value;
        const dotEditor = document.getElementById('dot-editor');
        if (type && isEditor) { dotEditor.classList.remove('hidden'); renderDotList(); }
        else { dotEditor.classList.add('hidden'); }
    }

    function renderDots() {
        const fab = document.getElementById('select-fabrikant').value;
        const type = document.getElementById('select-type').value;
        const layer = document.getElementById('dots-layer');
        layer.innerHTML = "";
        if(aircraftData[fab] && aircraftData[fab][type]) {
            aircraftData[fab][type].dots.forEach(dot => {
                const d = document.createElement('div');
                d.className = 'dot'; d.style.left = dot.x + "%"; d.style.top = dot.y + "%";
                d.setAttribute('data-info', dot.info);
                layer.appendChild(d);
            });
        }
    }

    function renderDotList() {
        const fab = document.getElementById('select-fabrikant').value;
        const type = document.getElementById('select-type').value;
        const list = document.getElementById('current-dots');
        list.innerHTML = "";
        if(aircraftData[fab] && aircraftData[fab][type]) {
            aircraftData[fab][type].dots.forEach((dot, i) => {
                const li = document.createElement('li');
                li.className = 'dot-item';
                li.innerHTML = `<span><b>${dot.info}</b></span><button onclick="deleteDot(${i})" style="width:auto; background:#dc3545; color:white; border:none; padding:4px 8px; border-radius:4px; cursor:pointer;">Delete</button>`;
                list.appendChild(li);
            });
        }
    }

    loadManufacturers();
</script>
</body>
</html>
