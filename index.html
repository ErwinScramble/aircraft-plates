<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSN Locator - Editor Dashboard</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root { --blue: #2563eb; --dark: #0f172a; --gray: #f1f5f9; --green: #10b981; }
        body { font-family: 'Inter', sans-serif; background: var(--gray); margin: 0; padding: 20px; color: var(--dark); }
        .container { max-width: 1200px; margin: 0 auto; }
        
        .editor-ui { 
            background: var(--dark); color: white; padding: 25px; border-radius: 20px; 
            margin-bottom: 20px; text-align: left; display: none; box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .editor-grid { display: grid; grid-template-columns: 1.5fr 1fr 1fr; gap: 20px; align-items: end; }
        
        .display-box { 
            background: white; border-radius: 24px; padding: 40px; margin: 20px auto;
            height: 450px; box-shadow: 0 15px 40px rgba(0,0,0,0.05);
            position: relative; border: 1px solid #e2e8f0;
            display: flex; align-items: center; justify-content: center; overflow: hidden;
            cursor: crosshair; touch-action: none;
        }
        
        #aircraft-img { max-width: 100%; max-height: 100%; object-fit: contain; pointer-events: none; user-select: none; }
        
        .marker-dot { 
            position: absolute; width: 28px; height: 28px; background: #ef4444; 
            border-radius: 50%; border: 4px solid white; display: none;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.6); z-index: 100;
            transform: translate(-50%, -50%); pointer-events: none;
        }

        label { display: block; font-size: 11px; text-transform: uppercase; color: #94a3b8; margin-bottom: 5px; font-weight: bold; }
        input.edit-input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: white; font-size: 14px; box-sizing: border-box; }
        .btn { padding: 12px 24px; border-radius: 12px; border: none; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-download { background: var(--green); color: white; width: 100%; margin-top: 20px; font-size: 16px; }
        .btn-toggle { background: white; border: 1px solid #cbd5e0; margin-bottom: 20px; }
        
        .search-box { width: 100%; padding: 15px 25px; border-radius: 50px; border: 2px solid #e2e8f0; font-size: 18px; margin-bottom: 30px; outline: none; box-sizing: border-box; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; }
        .card { background: white; padding: 15px; border-radius: 15px; border: 1px solid #e2e8f0; cursor: pointer; transition: 0.2s; }
        .card.selected { border: 2px solid var(--blue); background: #eff6ff; }
        .bubble { background: var(--dark); color: white; padding: 12px 25px; border-radius: 50px; font-size: 14px; margin-top: 15px; display: none; font-weight: 600; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <header style="text-align: center;">
        <h1>✈️ MSN Locator <span id="modeLabel" style="color:var(--blue)">User View</span></h1>
        
        <div id="editorPanel" class="editor-ui">
            <div class="editor-grid">
                <div>
                    <label>Plate Location Description</label>
                    <input type="text" id="editLoc" class="edit-input" oninput="syncInputs()">
                </div>
                <div>
                    <label>PNG Filename (Category)</label>
                    <input type="text" id="editCat" class="edit-input" oninput="syncInputs()">
                </div>
                <div>
                    <label>Internal Notes</label>
                    <input type="text" id="editNotes" class="edit-input" oninput="syncInputs()">
                </div>
            </div>
            <button class="btn btn-download" onclick="downloadCSV()">💾 Download Completed Database (CSV)</button>
        </div>

        <button onclick="toggleEditor()" id="editBtn" class="btn btn-toggle">⚙️ Toggle Editor Mode</button>

        <div class="display-box" id="map">
            <img id="aircraft-img" src="" alt="Select an aircraft below">
            <div id="marker" class="marker-dot"></div>
        </div>

        <div id="infoBubble" class="bubble"></div>
        <input type="text" id="search" class="search-box" placeholder="Start typing to find aircraft...">
    </header>

    <div id="results" class="grid"></div>
</div>

<script>
    let db = []; let selected = null; let isEdit = false;

    fetch('aircraft_plates_db.csv').then(r => r.text()).then(t => {
        const rows = t.split(/\r?\n/).slice(1);
        db = rows.filter(r => r.trim()).map(r => {
            const c = r.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
            return { 
                mfr: c[0] || "", model: c[1] || "", 
                loc: (c[2]||"").replace(/"/g,""), note: (c[3]||"").replace(/"/g,""), 
                cat: (c[4]||"").trim(), x: parseInt(c[5]) || 50, y: parseInt(c[6]) || 50 
            };
        });
        render();
    });

    function render(f = '') {
        const g = document.getElementById('results'); g.innerHTML = '';
        db.filter(i => (i.mfr+i.model).toLowerCase().includes(f.toLowerCase())).forEach(item => {
            const d = document.createElement('div'); d.className = `card ${selected === item ? 'selected' : ''}`;
            d.innerHTML = `<strong>${item.mfr}</strong><br>${item.model}`;
            d.onclick = () => selectAircraft(item); g.appendChild(d);
        });
    }

    function selectAircraft(item) {
        selected = item; render(document.getElementById('search').value);
        document.getElementById('aircraft-img').src = `silhouettes/${item.cat}.png`;
        document.getElementById('aircraft-img').style.display = 'block';
        if(isEdit) {
            document.getElementById('editLoc').value = item.loc;
            document.getElementById('editCat').value = item.cat;
            document.getElementById('editNotes').value = item.note;
        }
        updateMarkerPos();
        document.getElementById('infoBubble').style.display = 'inline-block';
        document.getElementById('infoBubble').innerText = "📍 " + item.loc;
    }

    // Klik-event voor verplaatsen
    document.getElementById('map').addEventListener('mousedown', function(e) {
        if(!isEdit || !selected) return;
        moveMarker(e);
    });

    function moveMarker(e) {
        const rect = document.getElementById('map').getBoundingClientRect();
        selected.x = Math.round(((e.clientX - rect.left) / rect.width) * 100);
        selected.y = Math.round(((e.clientY - rect.top) / rect.height) * 100);
        updateMarkerPos();
    }

    function updateMarkerPos() {
        if(!selected) return;
        const m = document.getElementById('marker');
        m.style.left = selected.x + '%'; m.style.top = selected.y + '%';
        m.style.display = 'block';
    }

    function syncInputs() {
        if(!selected) return;
        selected.loc = document.getElementById('editLoc').value;
        selected.cat = document.getElementById('editCat').value;
        selected.note = document.getElementById('editNotes').value;
        document.getElementById('infoBubble').innerText = "📍 " + selected.loc;
    }

    function toggleEditor() {
        isEdit = !isEdit;
        document.getElementById('editorPanel').style.display = isEdit ? 'block' : 'none';
        document.getElementById('modeLabel').innerText = isEdit ? "Editor Mode" : "User View";
        document.getElementById('editBtn').style.background = isEdit ? "var(--dark)" : "white";
        document.getElementById('editBtn').style.color = isEdit ? "white" : "black";
    }

    function downloadCSV() {
        let csvContent = "Manufacturer,Model,Plate_Location,Notes,Category,X,Y\n";
        db.forEach(i => { csvContent += `${i.mfr},${i.model},"${i.loc}","${i.note}",${i.cat},${i.x},${i.y}\n`; });
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.setAttribute("download", "aircraft_plates_db.csv");
        link.click();
    }

    document.getElementById('search').oninput = (e) => render(e.target.value);
</script>
</body>
</html>
