<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aircraft MSN Locator - High Detail Edition</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root { --blue: #2563eb; --dark: #0f172a; --gray: #f1f5f9; }
        body { font-family: 'Inter', sans-serif; background: var(--gray); margin: 0; padding: 20px; color: var(--dark); }
        .container { max-width: 1200px; margin: 0 auto; text-align: center; }
        .display-box { 
            background: white; border-radius: 24px; padding: 30px; margin: 20px auto;
            max-width: 900px; height: 400px; box-shadow: 0 20px 50px rgba(0,0,0,0.05);
            position: relative; border: 1px solid #e2e8f0;
            display: flex; align-items: center; justify-content: center;
        }
        svg.unit { width: 100%; height: 100%; display: none; filter: drop-shadow(0 10px 15px rgba(0,0,0,0.1)); }
        svg.active { display: block; }
        .base-shape { fill: #cbd5e0; stroke: #94a3b8; stroke-width: 1; }
        .detail-shape { fill: #94a3b8; }
        .window-shape { fill: #1e293b; opacity: 0.7; }
        .marker-dot { fill: #ef4444; stroke: white; stroke-width: 5; display: none; }
        .marker-dot.active { display: block; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { r: 10; opacity: 1; } 50% { r: 16; opacity: 0.6; } 100% { r: 10; opacity: 1; } }
        .editor-ui { background: var(--dark); color: white; padding: 20px; border-radius: 15px; margin-bottom: 20px; text-align: left; display: none; }
        .code-output { background: #000; padding: 10px; color: #10b981; font-family: monospace; font-size: 12px; border-radius: 5px; margin-top: 10px; }
        .search-box { width: 100%; max-width: 600px; padding: 18px 25px; border-radius: 50px; border: 2px solid #e2e8f0; font-size: 18px; outline: none; margin-bottom: 30px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px; text-align: left; }
        .card { background: white; padding: 15px; border-radius: 15px; border: 1px solid #e2e8f0; cursor: pointer; transition: 0.2s; }
        .card.selected { border: 2px solid var(--blue); background: #eff6ff; }
        .bubble { background: var(--dark); color: white; padding: 10px 15px; border-radius: 10px; font-size: 13px; margin-top: 15px; display: none; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>✈️ Aircraft MSN Locator</h1>
    <div id="editorPanel" class="editor-ui">
        <strong>🛠 Editor Mode:</strong> Klik op de tekening voor X/Y coördinaten.<br>
        <div id="log" class="code-output">Selecteer eerst een vliegtuig...</div>
    </div>
    <button onclick="toggleEditor()" style="margin-bottom: 20px; cursor:pointer; padding: 10px 20px; border-radius: 10px;">Toggle Editor</button>

    <div class="display-box" id="map" onclick="getClickCoords(event)">
        
        <!-- 1. AIRLINER -->
        <svg id="view-airliner" class="unit active" viewBox="0 0 500 200">
            <path class="base-shape" d="M30,120 Q30,100 150,100 L400,100 Q480,100 480,120 Q480,140 400,140 L100,140 Q30,140 30,120 Z"/>
            <path class="detail-shape" d="M380,100 L450,40 L485,40 L455,100 Z"/>
            <circle class="marker-dot" cx="0" cy="0" r="12" />
        </svg>

        <!-- 2. C-130 HERCULES (Military Transport) -->
        <svg id="view-hercules" class="unit" viewBox="0 0 500 200">
            <path class="base-shape" d="M20,130 C20,100 60,80 120,80 L400,80 L440,30 L480,30 L460,80 L470,100 L470,140 L400,150 L60,150 C40,150 20,145 20,130 Z"/>
            <path class="window-shape" d="M40,100 L80,100 L80,115 L45,120 Z"/>
            <rect class="detail-shape" x="120" y="140" width="80" height="15" rx="5"/> <!-- Gear sponson -->
            <circle class="marker-dot" cx="0" cy="0" r="12" />
        </svg>

        <!-- 3. PIPER STYLE (Low Wing Prop) -->
        <svg id="view-prop-low" class="unit" viewBox="0 0 500 200">
            <path class="base-shape" d="M40,135 L120,125 L400,125 L440,60 L470,60 L455,130 L120,145 L40,140 Z"/>
            <rect class="detail-shape" x="130" y="135" width="180" height="10" rx="2"/> <!-- Low Wing -->
            <path class="window-shape" d="M130,128 L190,128 L190,138 L130,142 Z"/>
            <line x1="38" y1="115" x2="38" y2="160" stroke="#1e293b" stroke-width="4"/> <!-- Prop -->
            <circle class="marker-dot" cx="0" cy="0" r="12" />
        </svg>

        <!-- 4. CESSNA STYLE (High Wing) -->
        <svg id="view-prop-high" class="unit" viewBox="0 0 500 200">
            <path class="base-shape" d="M40,140 L120,130 L400,130 L455,60 L485,60 L465,135 L40,145 Z"/>
            <rect class="detail-shape" x="110" y="85" width="200" height="10"/> <!-- High Wing -->
            <circle class="marker-dot" cx="0" cy="0" r="12" />
        </svg>

        <!-- 5. FIGHTER -->
        <svg id="view-fighter" class="unit" viewBox="0 0 500 200">
            <path class="base-shape" d="M20,130 L150,110 L350,110 L450,40 L480,40 L460,110 L490,130 L460,150 L150,150 Z"/>
            <circle class="marker-dot" cx="0" cy="0" r="12" />
        </svg>

        <!-- 6. HELI -->
        <svg id="view-heli" class="unit" viewBox="0 0 500 200">
            <path class="base-shape" d="M50,160 Q20,160 20,110 L400,60 L440,30 L440,80 L200,80 Q200,160 50,160 Z"/>
            <circle class="marker-dot" cx="0" cy="0" r="12" />
        </svg>

        <!-- 7. AN-2 -->
        <svg id="view-biplane" class="unit" viewBox="0 0 500 200">
            <path class="base-shape" d="M50,150 Q50,110 150,110 L400,125 L450,60 L465,130 L50,170 Z"/>
            <rect class="detail-shape" x="120" y="80" width="220" height="8"/>
            <rect class="detail-shape" x="140" y="165" width="180" height="8"/>
            <circle class="marker-dot" cx="0" cy="0" r="12" />
        </svg>
    </div>

    <div id="infoBubble" class="bubble"></div>
    <input type="text" id="search" class="search-box" placeholder="Search (Cessna, C-130, Piper, F-16)...">
    <div id="results" class="grid"></div>
</div>

<script>
    let db = [];
    let selected = null;
    let isEdit = false;

    fetch('aircraft_plates_db.csv').then(r => r.text()).then(t => {
        const rows = t.split(/\r?\n/).slice(1);
        db = rows.filter(r => r.trim()).map(r => {
            const c = r.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
            return { mfr: c[0], model: c[1], loc: (c[2]||"").replace(/"/g,""), note: c[3], cat: (c[4]||"Airliner").trim(), x: c[5], y: c[6] };
        });
        render();
    });

    function render(f = '') {
        const g = document.getElementById('results');
        g.innerHTML = '';
        db.filter(i => (i.mfr+i.model).toLowerCase().includes(f.toLowerCase())).forEach(item => {
            const d = document.createElement('div');
            d.className = `card ${selected === item ? 'selected' : ''}`;
            d.innerHTML = `<strong>${item.mfr}</strong><br>${item.model}`;
            d.onclick = () => select(item);
            g.appendChild(d);
        });
    }

    function select(item) {
        selected = item;
        render(document.getElementById('search').value);
        const catMap = {
            'Airliner': 'view-airliner', 'Fighter': 'view-fighter', 'Heli': 'view-heli',
            'PropHigh': 'view-prop-high', 'PropLow': 'view-prop-low', 'Biplane': 'view-biplane',
            'Hercules': 'view-hercules'
        };
        document.querySelectorAll('.unit').forEach(u => u.classList.remove('active'));
        const target = catMap[item.cat] || 'view-airliner';
        const activeSvg = document.getElementById(target);
        activeSvg.classList.add('active');
        const dot = activeSvg.querySelector('.marker-dot');
        if(item.x && item.y) {
            dot.setAttribute('cx', item.x); dot.setAttribute('cy', item.y);
            dot.classList.add('active');
            document.getElementById('infoBubble').style.display = 'inline-block';
            document.getElementById('infoBubble').innerText = item.loc;
        } else { dot.classList.remove('active'); document.getElementById('infoBubble').style.display='none'; }
    }

    function getClickCoords(e) {
        if(!isEdit || !selected) return;
        const rect = document.getElementById('map').getBoundingClientRect();
        const x = Math.round(((e.clientX - rect.left) / rect.width) * 500);
        const y = Math.round(((e.clientY - rect.top) / rect.height) * 200);
        const dot = document.querySelector('svg.active .marker-dot');
        dot.setAttribute('cx', x); dot.setAttribute('cy', y);
        dot.classList.add('active');
        document.getElementById('log').innerText = `${selected.mfr},${selected.model},"${selected.loc}","${selected.note}",${selected.cat},${x},${y}`;
    }

    function toggleEditor() { isEdit = !isEdit; document.getElementById('editorPanel').style.display = isEdit ? 'block' : 'none'; }
    document.getElementById('search').oninput = (e) => render(e.target.value);
</script>
</body>
</html>
