<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aircraft Plates Database</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; padding: 20px; background: #f0f2f5; color: #333; margin: 0; }
        .container { max-width: 800px; margin: 20px auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #1a73e8; margin-top: 0; }
        label { font-weight: bold; display: block; margin-top: 15px; }
        select, input, button { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        .image-container { position: relative; width: 100%; margin-top: 20px; display: none; border-radius: 8px; background: #eee; border: 1px solid #ddd; overflow: hidden; }
        #vliegtuig-beeld { width: 100%; height: auto; display: block; cursor: crosshair; }
        .dot { position: absolute; width: 18px; height: 18px; background: #ff0000; border: 2px solid #fff; border-radius: 50%; transform: translate(-50%, -50%); cursor: pointer; box-shadow: 0 0 8px rgba(0,0,0,0.5); z-index: 5; }
        .dot::after { content: attr(data-info); position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.85); color: white; padding: 6px 12px; border-radius: 4px; font-size: 13px; white-space: nowrap; display: none; z-index: 10; pointer-events: none; }
        .dot:hover::after { display: block; }
        
        #related-section { margin-top: 15px; padding: 12px; background: #f8f9fa; border-radius: 8px; display: none; border: 1px solid #e9ecef; }
        .related-link { color: #1a73e8; text-decoration: underline; cursor: pointer; margin-right: 12px; font-weight: bold; }
        
        .admin-panel { margin-top: 40px; padding-top: 20px; border-top: 2px dashed #ccc; }
        .admin-box { background: #f8f9fa; padding: 20px; border-radius: 8px; border: 1px solid #e9ecef; margin-top: 10px; }
        .dot-item { background: white; margin-bottom: 8px; padding: 12px; display: flex; align-items: center; border: 1px solid #ddd; border-radius: 6px; }
        .dot-info-text { flex-grow: 1; font-size: 14px; }
        .dot-actions { display: flex; gap: 5px; }
        .dot-actions button { width: auto; padding: 6px 12px; font-size: 12px; cursor: pointer; }
        .btn-edit { background: #ffc107; color: #000; border: none; }
        .btn-delete { background: #dc3545; color: white; border: none; }
        .btn-save { background: #28a745; color: white; border: none; font-weight: bold; }
        .hidden { display: none; }
        .manage-controls { display: flex; gap: 10px; margin-top: 5px; }
        .manage-controls button { font-size: 12px; padding: 5px; background: #6c757d; color: white; border: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>Aircraft Plates</h1>
    
    <label>1. Manufacturer:</label>
    <div style="display:flex; gap:10px; align-items:center;">
        <select id="select-fabrikant" onchange="updateTypes()" style="flex-grow:1;">
            <option value="">-- Select Manufacturer --</option>
        </select>
        <div id="m-fab-btns" class="hidden" style="display:flex; gap:5px;">
            <button onclick="renameManufacturer()" style="width:auto; margin:0; padding:5px 10px; font-size:12px; background:#ffc107; color:black;">Rename</button>
            <button onclick="deleteManufacturer()" style="width:auto; margin:0; padding:5px 10px; font-size:12px; background:#dc3545; color:white;">Del</button>
        </div>
    </div>

    <label>2. Aircraft Type:</label>
    <div style="display:flex; gap:10px; align-items:center;">
        <select id="select-type" onchange="showImage()" style="flex-grow:1;">
            <option value="">-- Select Type --</option>
        </select>
        <div id="m-type-btns" class="hidden" style="display:flex; gap:5px;">
            <button onclick="renameType()" style="width:auto; margin:0; padding:5px 10px; font-size:12px; background:#ffc107; color:black;">Rename</button>
            <button onclick="deleteType()" style="width:auto; margin:0; padding:5px 10px; font-size:12px; background:#dc3545; color:white;">Del</button>
        </div>
    </div>

    <div id="related-section">
        <small>Other models using this plate:</small><br>
        <div id="related-links" style="margin-top:5px;"></div>
    </div>

    <div class="image-container" id="wrapper">
        <img id="vliegtuig-beeld" src="" alt="Aircraft Plate" onclick="handleImageClick(event)">
        <div id="dots-layer"></div>
    </div>

    <div class="admin-panel">
        <button id="auth-btn" onclick="authenticateEditor()" style="background:#6c757d; color:white; border:none; cursor:pointer;">Editor Login</button>
        
        <div id="admin-controls" class="hidden">
            <div class="admin-box">
                <h3>Add New Aircraft</h3>
                <input type="text" id="new-fabrikant" placeholder="Manufacturer (e.g. Boeing)">
                <input type="text" id="new-type" placeholder="Type (e.g. 737)">
                <input type="text" id="new-image" placeholder="Filename (e.g. b737.jpg)">
                <button class="btn-save" onclick="addEntry()">Save Aircraft</button>
                
                <div id="dot-editor" class="hidden">
                    <hr>
                    <span style="font-weight:bold; color:#555;">C/N Locations (Click image to add)</span>
                    <div id="current-dots" style="margin-top:10px;"></div>
                </div>
                <hr>
                <button onclick="exportData()" style="background:#17a2b8; color:white; border:none; cursor:pointer; font-weight:bold;">Generate Backup Code</button>
                <textarea id="export-area" style="width:100%; height:80px; margin-top:10px; font-size:10px; font-family:monospace;" readonly></textarea>
            </div>
        </div>
    </div>
</div>

<script src="data.js"></script>

<script>
    let githubData = (typeof permanentData !== 'undefined') ? permanentData : {};
    let localData = JSON.parse(localStorage.getItem('aircraftDB')) || {};
    let aircraftData = {};
    let isEditor = false;

    function refreshDataStructure() {
        aircraftData = JSON.parse(JSON.stringify(githubData));
        for (let f in localData) {
            if (!aircraftData[f]) aircraftData[f] = {};
            for (let t in localData[f]) { aircraftData[f][t] = localData[f][t]; }
        }
        loadManufacturers();
    }

    function authenticateEditor() {
        if(prompt("Access Key:") === "Scr@mble-Pl@tes") { 
            isEditor = true;
            document.getElementById('admin-controls').classList.remove('hidden');
            document.getElementById('auth-btn').innerText = "Editor Mode Active";
            document.getElementById('auth-btn').style.background = "#28a745";
            document.getElementById('m-fab-btns').classList.remove('hidden');
            document.getElementById('m-type-btns').classList.remove('hidden');
            checkDotEditor();
        }
    }

    function addEntry() {
        const fab = document.getElementById('new-fabrikant').value.trim();
        const type = document.getElementById('new-type').value.trim();
        const img = document.getElementById('new-image').value.trim();
        if(!fab || !type || !img) return alert('Fill fields');
        if(!localData[fab]) localData[fab] = {};
        localData[fab][type] = { img: img, dots: [] };
        saveLocal();
        document.getElementById('new-type').value = "";
        document.getElementById('new-image').value = "";
        refreshDataStructure();
    }

    // MANAGEMENT FUNCTIES
    function renameManufacturer() {
        const oldFab = document.getElementById('select-fabrikant').value;
        if(!oldFab) return alert("Select a manufacturer first");
        const newFab = prompt("New name for " + oldFab + "?", oldFab);
        if(newFab && newFab !== oldFab) {
            if(!localData[oldFab]) localData[oldFab] = aircraftData[oldFab];
            localData[newFab] = localData[oldFab];
            delete localData[oldFab];
            saveLocal();
            location.reload();
        }
    }

    function deleteManufacturer() {
        const fab = document.getElementById('select-fabrikant').value;
        if(fab && confirm("Delete ENTIRE manufacturer " + fab + "?")) {
            localData[fab] = null; // Mark for deletion if it was in githubData
            delete localData[fab];
            saveLocal();
            location.reload();
        }
    }

    function renameType() {
        const fab = document.getElementById('select-fabrikant').value;
        const oldType = document.getElementById('select-type').value;
        if(!oldType) return alert("Select a type first");
        const newType = prompt("New name for " + oldType + "?", oldType);
        if(newType && newType !== oldType) {
            if(!localData[fab]) localData[fab] = JSON.parse(JSON.stringify(aircraftData[fab]));
            localData[fab][newType] = localData[fab][oldType];
            delete localData[fab][oldType];
            saveLocal();
            location.reload();
        }
    }

    function deleteType() {
        const fab = document.getElementById('select-fabrikant').value;
        const type = document.getElementById('select-type').value;
        if(type && confirm("Delete type " + type + "?")) {
            if(!localData[fab]) localData[fab] = JSON.parse(JSON.stringify(aircraftData[fab]));
            delete localData[fab][type];
            saveLocal();
            location.reload();
        }
    }

    function loadManufacturers() {
        const sel = document.getElementById('select-fabrikant');
        const cur = sel.value;
        sel.innerHTML = '<option value="">-- Select Manufacturer --</option>';
        Object.keys(aircraftData).sort().forEach(f => {
            let opt = document.createElement('option');
            opt.value = f; opt.text = f; sel.add(opt);
        });
        sel.value = cur;
    }

    function updateTypes() {
        const fab = document.getElementById('select-fabrikant').value;
        const sel = document.getElementById('select-type');
        sel.innerHTML = '<option value="">-- Select Type --</option>';
        if(aircraftData[fab]) {
            Object.keys(aircraftData[fab]).sort().forEach(t => {
                let opt = document.createElement('option');
                opt.value = t; opt.text = t; sel.add(opt);
            });
        }
        showImage();
    }

    function showImage() {
        const f = document.getElementById('select-fabrikant').value;
        const t = document.getElementById('select-type').value;
        const wrap = document.getElementById('wrapper');
        const imgTag = document.getElementById('vliegtuig-beeld');
        const relLinks = document.getElementById('related-links');
        
        if(f && t && aircraftData[f][t]) {
            const currentImg = aircraftData[f][t].img;
            imgTag.src = "Images/" + currentImg;
            imgTag.onload = () => { wrap.style.display = "block"; renderDots(); };
            
            relLinks.innerHTML = "";
            let found = false;
            for (let oF in aircraftData) {
                for (let oT in aircraftData[oF]) {
                    if (aircraftData[oF][oT].img === currentImg && (oF !== f || oT !== t)) {
                        found = true;
                        const a = document.createElement('span');
                        a.className = "related-link";
                        a.innerText = oF + " " + oT;
                        a.onclick = () => { document.getElementById('select-fabrikant').value = oF; updateTypes(); document.getElementById('select-type').value = oT; showImage(); };
                        relLinks.appendChild(a);
                    }
                }
            }
            document.getElementById('related-section').style.display = found ? "block" : "none";
        } else { wrap.style.display = "none"; document.getElementById('related-section').style.display = "none"; }
        if(isEditor) checkDotEditor();
    }

    function handleImageClick(e) {
        if(!isEditor) return;
        const f = document.getElementById('select-fabrikant').value;
        const t = document.getElementById('select-type').value;
        if(!f || !t) return;
        const rect = e.target.getBoundingClientRect();
        const x = ((e.clientX - rect.left) / rect.width) * 100;
        const y = ((e.clientY - rect.top) / rect.height) * 100;
        const info = prompt("Location description:");
        if(info) {
            if(!localData[f]) localData[f] = JSON.parse(JSON.stringify(aircraftData[f]));
            if(!localData[f][t]) localData[f][t] = JSON.parse(JSON.stringify(aircraftData[f][t]));
            localData[f][t].dots.push({x, y, info});
            saveLocal();
            refreshDataStructure();
            renderDots();
            checkDotEditor();
        }
    }

    function renderDots() {
        const f = document.getElementById('select-fabrikant').value;
        const t = document.getElementById('select-type').value;
        const layer = document.getElementById('dots-layer');
        layer.innerHTML = "";
        if(aircraftData[f] && aircraftData[f][t]) {
            aircraftData[f][t].dots.forEach(d => {
                const dot = document.createElement('div');
                dot.className = 'dot'; dot.style.left = d.x + "%"; dot.style.top = d.y + "%";
                dot.setAttribute('data-info', d.info); layer.appendChild(dot);
            });
        }
    }

    function checkDotEditor() {
        const f = document.getElementById('select-fabrikant').value;
        const t = document.getElementById('select-type').value;
        const ctrl = document.getElementById('dot-editor');
        const list = document.getElementById('current-dots');
        if (t && isEditor && aircraftData[f][t]) {
            ctrl.classList.remove('hidden');
            list.innerHTML = "";
            aircraftData[f][t].dots.forEach((d, i) => {
                const item = document.createElement('div');
                item.className = 'dot-item';
                item.innerHTML = `<div class="dot-info-text">${d.info}</div>
                    <div class="dot-actions">
                        <button class="btn-edit" onclick="editDot(${i})">Edit</button>
                        <button class="btn-delete" onclick="delDot(${i})">Del</button>
                    </div>`;
                list.appendChild(item);
            });
        } else { ctrl.classList.add('hidden'); }
    }

    function editDot(i) {
        const f = document.getElementById('select-fabrikant').value;
        const t = document.getElementById('select-type').value;
        const newT = prompt("Update:", aircraftData[f][t].dots[i].info);
        if(newT) {
            if(!localData[f]) localData[f] = JSON.parse(JSON.stringify(aircraftData[f]));
            localData[f][t].dots[i].info = newT;
            saveLocal(); refreshDataStructure(); checkDotEditor(); renderDots();
        }
    }

    function delDot(i) {
        const f = document.getElementById('select-fabrikant').value;
        const t = document.getElementById('select-type').value;
        if(confirm("Delete?")) {
            if(!localData[f]) localData[f] = JSON.parse(JSON.stringify(aircraftData[f]));
            localData[f][t].dots.splice(i, 1);
            saveLocal(); refreshDataStructure(); checkDotEditor(); renderDots();
        }
    }

    function saveLocal() { localStorage.setItem('aircraftDB', JSON.stringify(localData)); }

    function exportData() {
        document.getElementById('export-area').value = "const permanentData = " + JSON.stringify(aircraftData, null, 2) + ";";
        document.getElementById('export-area').select();
    }

    refreshDataStructure();
</script>
</body>
</html>
