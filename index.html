<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSN Locator - Pro Editor Dashboard</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root { --blue: #2563eb; --dark: #0f172a; --gray: #f1f5f9; --green: #10b981; --secondary-blue: #3b82f6; }
        body { font-family: 'Inter', sans-serif; background: var(--gray); margin: 0; padding: 20px; color: var(--dark); }
        .container { max-width: 1200px; margin: 0 auto; }
        
        .editor-ui { background: var(--dark); color: white; padding: 25px; border-radius: 20px; margin-bottom: 20px; display: none; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .editor-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; }
        
        .display-box { 
            background: white; border-radius: 24px; padding: 40px; margin: 20px auto;
            height: 450px; box-shadow: 0 15px 40px rgba(0,0,0,0.05); position: relative; border: 1px solid #e2e8f0;
            display: flex; align-items: center; justify-content: center; overflow: hidden; cursor: crosshair;
        }
        
        #aircraft-img { max-width: 100%; max-height: 100%; object-fit: contain; pointer-events: none; user-select: none; }
        
        /* De Twee Stippen */
        .marker { position: absolute; width: 28px; height: 28px; border-radius: 50%; border: 4px solid white; transform: translate(-50%, -50%); pointer-events: none; display: none; z-index: 100; }
        #marker1 { background: #ef4444; box-shadow: 0 0 15px rgba(239, 68, 68, 0.6); }
        #marker2 { background: #3b82f6; box-shadow: 0 0 15px rgba(59, 130, 246, 0.6); }

        label { display: block; font-size: 10px; text-transform: uppercase; color: #94a3b8; margin-bottom: 5px; font-weight: bold; }
        select, input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: white; font-size: 13px; margin-bottom: 10px; }
        
        .btn { padding: 12px 24px; border-radius: 12px; border: none; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-download { background: var(--green); color: white; width: 100%; margin-top: 10px; }
        .btn-toggle { background: white; border: 1px solid #cbd5e0; margin-bottom: 20px; }
        
        .search-box { width: 100%; padding: 15px 25px; border-radius: 50px; border: 2px solid #e2e8f0; font-size: 18px; margin-bottom: 30px; outline: none; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; }
        .card { background: white; padding: 15px; border-radius: 15px; border: 1px solid #e2e8f0; cursor: pointer; }
        .card.selected { border: 2px solid var(--blue); background: #eff6ff; }
        
        .info-pane { display: flex; justify-content: center; gap: 20px; margin-top: 15px; }
        .bubble { padding: 10px 20px; border-radius: 50px; font-size: 13px; font-weight: 600; color: white; display: none; }
        .b1 { background: #ef4444; } .b2 { background: #3b82f6; }
    </style>
</head>
<body>

<div class="container">
    <header style="text-align: center;">
        <h1>✈️ Aircraft MSN Locator <small id="modeLabel" style="color:var(--blue)">(User)</small></h1>
        
        <div id="editorPanel" class="editor-ui">
            <div class="editor-grid">
                <div>
                    <label>Silhouette Type</label>
                    <select id="editCat" onchange="syncInputs()">
                        <option value="An-2">An-2</option>
                        <option value="C-130">C-130</option>
                        <option value="Cessna">Cessna</option>
                        <option value="MiG-21">MiG-21</option>
                        <option value="UH-1">UH-1</option>
                        <option value="Airliner">Airliner (Standaard)</option>
                    </select>
                    <label>Primary Location (Red)</label>
                    <input type="text" id="editLoc" oninput="syncInputs()" placeholder="Description Primary">
                </div>
                <div>
                    <label>Secondary Location (Blue)</label>
                    <input type="text" id="editLoc2" oninput="syncInputs()" placeholder="Description Secondary">
                    <label>Target Marker</label>
                    <select id="targetMarker">
                        <option value="1">Move Primary (Red)</option>
                        <option value="2">Move Secondary (Blue)</option>
                    </select>
                </div>
                <div>
                    <label>Notes</label>
                    <input type="text" id="editNotes" oninput="syncInputs()">
                    <button class="btn btn-download" onclick="downloadCSV()">💾 Export CSV</button>
                </div>
            </div>
        </div>

        <button onclick="toggleEditor()" id="editBtn" class="btn btn-toggle">⚙️ Toggle Editor</button>

        <div class="display-box" id="map" onmousedown="handlePoint(event)">
            <img id="aircraft-img" src="" alt="Select aircraft">
            <div id="marker1" class="marker"></div>
            <div id="marker2" class="marker"></div>
        </div>

        <div class="info-pane">
            <div id="bubble1" class="bubble b1"></div>
            <div id="bubble2" class="bubble b2"></div>
        </div>
        
        <input type="text" id="search" class="search-box" placeholder="Search for aircraft...">
    </header>

    <div id="results" class="grid"></div>
</div>

<script>
    let db = []; let selected = null; let isEdit = false;

    fetch('aircraft_plates_db.csv').then(r => r.text()).then(t => {
        const rows = t.split(/\r?\n/).slice(1);
        db = rows.filter(r => r.trim()).map(r => {
            const c = r.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
            return { 
                mfr: c || "", model: c || "", 
                loc: (c||"").replace(/"/g,""), loc2: (c||"").replace(/"/g,""),
                note: (c||"").replace(/"/g,""), cat: (c||"Airliner").trim(), 
                x: parseInt(c) || 0, y: parseInt(c) || 0,
                x2: parseInt(c) || 0, y2: parseInt(c) || 0
            };
        });
        render();
    });

    function render(f = '') {
        const g = document.getElementById('results'); g.innerHTML = '';
        db.filter(i => (i.mfr+i.model).toLowerCase().includes(f.toLowerCase())).forEach(item => {
            const d = document.createElement('div'); d.className = `card ${selected === item ? 'selected' : ''}`;
            d.innerHTML = `<strong>${item.mfr}</strong><br>${item.model}`;
            d.onclick = () => selectAircraft(item); g.appendChild(d);
        });
    }

    function selectAircraft(item) {
        selected = item; render(document.getElementById('search').value);
        document.getElementById('aircraft-img').src = `silhouettes/${item.cat}.png`;
        document.getElementById('aircraft-img').style.display = 'block';
        
        if(isEdit) {
            document.getElementById('editLoc').value = item.loc;
            document.getElementById('editLoc2').value = item.loc2 || "";
            document.getElementById('editCat').value = item.cat;
            document.getElementById('editNotes').value = item.note;
        }

        updateMarkers();
    }

    function updateMarkers() {
        if(!selected) return;
        const m1 = document.getElementById('marker1');
        const m2 = document.getElementById('marker2');
        const b1 = document.getElementById('bubble1');
        const b2 = document.getElementById('bubble2');

        if(selected.x > 0) {
            m1.style.left = selected.x + '%'; m1.style.top = selected.y + '%';
            m1.style.display = 'block'; b1.style.display = 'block'; b1.innerText = "Primary: " + selected.loc;
        } else { m1.style.display = 'none'; b1.style.display = 'none'; }

        if(selected.x2 > 0) {
            m2.style.left = selected.x2 + '%'; m2.style.top = selected.y2 + '%';
            m2.style.display = 'block'; b2.style.display = 'block'; b2.innerText = "Secondary: " + selected.loc2;
        } else { m2.style.display = 'none'; b2.style.display = 'none'; }
    }

    function handlePoint(e) {
        if(!isEdit || !selected) return;
        const rect = document.getElementById('map').getBoundingClientRect();
        const x = Math.round(((e.clientX - rect.left) / rect.width) * 100);
        const y = Math.round(((e.clientY - rect.top) / rect.height) * 100);
        
        const target = document.getElementById('targetMarker').value;
        if(target === "1") { selected.x = x; selected.y = y; }
        else { selected.x2 = x; selected.y2 = y; }
        
        updateMarkers();
    }

    function syncInputs() {
        if(!selected) return;
        selected.loc = document.getElementById('editLoc').value;
        selected.loc2 = document.getElementById('editLoc2').value;
        selected.cat = document.getElementById('editCat').value;
        selected.note = document.getElementById('editNotes').value;
        document.getElementById('aircraft-img').src = `silhouettes/${selected.cat}.png`;
        updateMarkers();
    }

    function toggleEditor() {
        isEdit = !isEdit;
        document.getElementById('editorPanel').style.display = isEdit ? 'block' : 'none';
        document.getElementById('modeLabel').innerText = isEdit ? "(Editor)" : "(User)";
    }

    function downloadCSV() {
        let csvContent = "Manufacturer,Model,Plate_Location,Secondary_Location,Notes,Category,X,Y,X2,Y2\n";
        db.forEach(i => {
            csvContent += `${i.mfr},${i.model},"${i.loc}","${i.loc2}","${i.note}",${i.cat},${i.x},${i.y},${i.x2},${i.y2}\n`;
        });
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.setAttribute("download", "aircraft_plates_db.csv");
        link.click();
    }

    document.getElementById('search').oninput = (e) => render(e.target.value);
</script>
</body>
</html>
