<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aircraft MSN Locator - Custom Silhouettes</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root { --blue: #2563eb; --dark: #0f172a; --gray: #f1f5f9; }
        body { font-family: 'Inter', sans-serif; background: var(--gray); margin: 0; padding: 20px; color: var(--dark); }
        .container { max-width: 1200px; margin: 0 auto; text-align: center; }
        
        /* Display Area voor jouw eigen afbeeldingen */
        .display-box { 
            background: white; border-radius: 24px; padding: 40px; margin: 20px auto;
            max-width: 900px; height: 400px; box-shadow: 0 15px 40px rgba(0,0,0,0.05);
            position: relative; border: 1px solid #e2e8f0;
            display: flex; align-items: center; justify-content: center;
        }
        
        #aircraft-img { max-width: 100%; max-height: 100%; display: none; filter: drop-shadow(0 10px 15px rgba(0,0,0,0.1)); }

        /* De Marker (Rode stip) */
        .marker-dot { 
            position: absolute; width: 22px; height: 22px; background: #ef4444; 
            border-radius: 50%; border: 3px solid white; display: none;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.6); z-index: 100;
            transform: translate(-50%, -50%); pointer-events: none;
        }
        .marker-dot.active { display: block; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: translate(-50%, -50%) scale(1); } 50% { transform: translate(-50%, -50%) scale(1.3); } 100% { transform: translate(-50%, -50%) scale(1); } }

        /* UI elementen */
        .editor-ui { background: var(--dark); color: white; padding: 15px; border-radius: 12px; margin-bottom: 20px; text-align: left; display: none; }
        .card { background: white; padding: 15px; border-radius: 15px; border: 1px solid #e2e8f0; cursor: pointer; text-align: left; }
        .card.selected { border: 2px solid var(--blue); background: #eff6ff; }
        .search-box { width: 100%; max-width: 600px; padding: 15px 25px; border-radius: 50px; border: 2px solid #e2e8f0; font-size: 18px; outline: none; margin-bottom: 30px; }
        .bubble { background: var(--dark); color: white; padding: 10px 20px; border-radius: 50px; font-size: 14px; margin-top: 15px; display: none; font-weight: 600; }
    </style>
</head>
<body>

<div class="container">
    <h1>✈️ Aircraft MSN Locator</h1>

    <div id="editorPanel" class="editor-ui">
        <strong>🛠 Editor Mode:</strong> Click on your silhouette to get X/Y coords.<br>
        <div id="log" style="font-family:monospace; color:#10b981; margin-top:10px;">Select aircraft...</div>
    </div>
    <button onclick="toggleEditor()" style="margin-bottom: 20px; cursor:pointer;">Toggle Editor Mode</button>

    <div class="display-box" id="map" onclick="getClickCoords(event)">
        <!-- Jouw eigen afbeelding wordt hier geladen -->
        <img id="aircraft-img" src="" alt="Silhouette">
        <div id="marker" class="marker-dot"></div>
    </div>

    <div id="infoBubble" class="bubble"></div>
    <input type="text" id="search" class="search-box" placeholder="Search (e.g. Cessna, C-130, An-2)...">
    <div id="results" style="display:grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap:15px;"></div>
</div>

<script>
    let db = []; let selected = null; let isEdit = false;

    fetch('aircraft_plates_db.csv').then(r => r.text()).then(t => {
        const rows = t.split(/\r?\n/).slice(1);
        db = rows.filter(r => r.trim()).map(r => {
            const c = r.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
            return { mfr: c[0], model: c[1], loc: (c[2]||"").replace(/"/g,""), cat: (c[4]||"airliner").trim().toLowerCase(), x: c[5], y: c[6] };
        });
        render();
    });

    function render(f = '') {
        const g = document.getElementById('results'); g.innerHTML = '';
        db.filter(i => (i.mfr+i.model).toLowerCase().includes(f.toLowerCase())).forEach(item => {
            const d = document.createElement('div'); d.className = `card ${selected === item ? 'selected' : ''}`;
            d.innerHTML = `<strong>${item.mfr}</strong><br>${item.model}`;
            d.onclick = () => selectAircraft(item); g.appendChild(d);
        });
    }

    function selectAircraft(item) {
        selected = item; render(document.getElementById('search').value);
        
        // Laad jouw eigen silhouette uit het mapje 'silhouettes'
        // Zorg dat de naam in de Category kolom van je CSV matcht met de bestandsnaam (bijv. 'cessna')
        const img = document.getElementById('aircraft-img');
        img.src = `silhouettes/${item.cat}.svg`; 
        img.style.display = 'block';

        const dot = document.getElementById('marker');
        if(item.x && item.y) {
            dot.style.left = item.x + '%'; dot.style.top = item.y + '%';
            dot.classList.add('active');
            document.getElementById('infoBubble').style.display = 'inline-block';
            document.getElementById('infoBubble').innerText = "Location: " + item.loc;
        } else { dot.classList.remove('active'); document.getElementById('infoBubble').style.display='none'; }
        window.scrollTo({top: 0, behavior: 'smooth'});
    }

    function getClickCoords(e) {
        if(!isEdit || !selected) return;
        const rect = document.getElementById('map').getBoundingClientRect();
        const x = Math.round(((e.clientX - rect.left) / rect.width) * 100);
        const y = Math.round(((e.clientY - rect.top) / rect.height) * 100);
        
        document.getElementById('marker').style.left = x + '%';
        document.getElementById('marker').style.top = y + '%';
        document.getElementById('marker').classList.add('active');

        document.getElementById('log').innerText = `${selected.mfr},${selected.model},"${selected.loc}","",${selected.cat},${x},${y}`;
    }

    function toggleEditor() { isEdit = !isEdit; document.getElementById('editorPanel').style.display = isEdit ? 'block' : 'none'; }
    document.getElementById('search').oninput = (e) => render(e.target.value);
</script>
</body>
</html>
