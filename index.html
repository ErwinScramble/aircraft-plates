<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aircraft Plates Database</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; padding: 20px; background: #f0f2f5; color: #333; margin: 0; }
        .container { max-width: 800px; margin: 20px auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #1a73e8; margin-top: 0; }
        label { font-weight: bold; display: block; margin-top: 15px; }
        select, input, button { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        .image-container { position: relative; width: 100%; margin-top: 20px; display: none; border-radius: 8px; background: #eee; border: 1px solid #ddd; overflow: hidden; }
        #vliegtuig-beeld { width: 100%; height: auto; display: block; cursor: crosshair; }
        .dot { position: absolute; width: 18px; height: 18px; background: #ff0000; border: 2px solid #fff; border-radius: 50%; transform: translate(-50%, -50%); cursor: pointer; box-shadow: 0 0 8px rgba(0,0,0,0.5); z-index: 5; }
        .dot::after { content: attr(data-info); position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.85); color: white; padding: 6px 12px; border-radius: 4px; font-size: 13px; white-space: nowrap; display: none; z-index: 10; pointer-events: none; }
        .dot:hover::after { display: block; }
        
        /* Waarschuwingstekst stijl */
        #warning-box { position: absolute; bottom: 0; left: 0; width: 100%; background: rgba(255, 193, 7, 0.9); color: #000; text-align: center; padding: 10px; font-weight: bold; font-size: 14px; display: none; z-index: 10; border-top: 1px solid #d39e00; }
        
        #related-section { margin-top: 15px; padding: 12px; background: #f8f9fa; border-radius: 8px; display: none; border: 1px solid #e9ecef; }
        .related-link { color: #1a73e8; text-decoration: underline; cursor: pointer; margin-right: 12px; font-weight: bold; }
        .admin-panel { margin-top: 40px; padding-top: 20px; border-top: 2px dashed #ccc; }
        .admin-box { background: #f8f9fa; padding: 20px; border-radius: 8px; border: 1px solid #e9ecef; margin-top: 10px; }
        .dot-item { background: white; margin-bottom: 8px; padding: 12px; display: flex; align-items: center; border: 1px solid #ddd; border-radius: 6px; }
        .dot-info-text { flex-grow: 1; font-size: 14px; }
        .dot-actions { display: flex; gap: 5px; }
        .dot-actions button { width: auto; padding: 6px 12px; font-size: 12px; cursor: pointer; }
        .btn-edit { background: #ffc107; color: #000; border: none; }
        .btn-delete { background: #dc3545; color: white; border: none; }
        .btn-save { background: #28a745; color: white; border: none; font-weight: bold; cursor: pointer; }
        .hidden { display: none !important; }
        .select-row { display: flex; gap: 10px; align-items: center; }
        .select-row select { flex-grow: 1; }
        .manage-btns { display: flex; gap: 5px; }
        .btn-sm { width: auto !important; margin: 0 !important; padding: 8px 12px !important; font-size: 12px !important; cursor: pointer; border: none; border-radius: 4px; }
    </style>
</head>
<body>
<div class="container">
    <h1>Aircraft Plates</h1>
    <label>1. Manufacturer:</label>
    <div class="select-row">
        <select id="select-fabrikant" onchange="updateTypes()">
            <option value="">-- Select Manufacturer --</option>
        </select>
        <div id="m-fab-btns" class="manage-btns hidden">
            <button onclick="renameManufacturer()" class="btn-sm" style="background:#ffc107;">Rename</button>
            <button onclick="deleteManufacturer()" class="btn-sm" style="background:#dc3545; color:white;">Del</button>
        </div>
    </div>
    <label>2. Aircraft Type:</label>
    <div class="select-row">
        <select id="select-type" onchange="showImage()">
            <option value="">-- Select Type --</option>
        </select>
        <div id="m-type-btns" class="manage-btns hidden">
            <button onclick="renameType()" class="btn-sm" style="background:#ffc107;">Rename</button>
            <button onclick="deleteType()" class="btn-sm" style="background:#dc3545; color:white;">Del</button>
        </div>
    </div>
    <div id="related-section"><small>Other models using this plate:</small><br><div id="related-links" style="margin-top:5px;"></div></div>
    
    <div class="image-container" id="wrapper">
        <img id="vliegtuig-beeld" src="" alt="Aircraft Plate" onclick="handleImageClick(event)">
        <div id="dots-layer"></div>
        <div id="warning-box"></div>
    </div>

    <div class="admin-panel">
        <button id="auth-btn" onclick="handleAuthClick()" style="background:#6c757d; color:white; border:none; cursor:pointer;">Editor Login</button>
        <div id="admin-controls" class="hidden">
            <div class="admin-box">
                <h3>Add/Update Aircraft</h3>
                <input type="text" id="new-fabrikant" placeholder="Manufacturer">
                <input type="text" id="new-type" placeholder="Type">
                <input type="text" id="new-image" placeholder="Filename">
                <input type="text" id="new-warning" placeholder="Optional Warning/Note (appears at bottom of image)">
                <button class="btn-save" onclick="addEntry()">Save Aircraft</button>
                <div id="dot-editor" class="hidden"><hr><span style="font-weight:bold; color:#555;">C/N Locations</span><div id="current-dots" style="margin-top:10px;"></div></div>
                <hr>
                <button onclick="exportData()" style="background:#17a2b8; color:white; border:none; cursor:pointer; font-weight:bold;">Generate Backup Code</button>
                <textarea id="export-area" style="width:100%; height:80px; margin-top:10px; font-size:10px; font-family:monospace;" readonly></textarea>
            </div>
        </div>
    </div>
</div>
<script src="data.js"></script>
<script>
    let isEditor = sessionStorage.getItem('isEditorActive') === 'true';
    let aircraftData = {};
    
    function refreshDataStructure() {
        let githubData = (typeof permanentData !== 'undefined') ? permanentData : {};
        let localChanges = JSON.parse(localStorage.getItem('aircraftDB_Local')) || {};
        aircraftData = JSON.parse(JSON.stringify(githubData));
        for (let f in localChanges) {
            if (localChanges[f] === null) { delete aircraftData[f]; } 
            else {
                if (!aircraftData[f]) aircraftData[f] = {};
                for (let t in localChanges[f]) {
                    if (localChanges[f][t] === null) { delete aircraftData[f][t]; } 
                    else { aircraftData[f][t] = localChanges[f][t]; }
                }
                if (Object.keys(aircraftData[f]).length === 0) delete aircraftData[f];
            }
        }
        loadManufacturers();
        if(isEditor) applyEditorView();
    }

    function handleAuthClick() {
        if(isEditor) { sessionStorage.removeItem('isEditorActive'); location.reload(); } 
        else {
            if(prompt("Access Key:") === "Scr@mble-Pl@tes") { 
                sessionStorage.setItem('isEditorActive', 'true');
                isEditor = true;
                applyEditorView();
            }
        }
    }

    function applyEditorView() {
        document.getElementById('admin-controls').classList.remove('hidden');
        document.getElementById('m-fab-btns').classList.remove('hidden');
        document.getElementById('m-type-btns').classList.remove('hidden');
        document.getElementById('auth-btn').innerText = "Editor Mode: ACTIVE (Logout)";
        document.getElementById('auth-btn').style.background = "#28a745";
        checkDotEditor();
    }

    function saveLocal(data) { localStorage.setItem('aircraftDB_Local', JSON.stringify(data)); }
    function getLocal() { return JSON.parse(localStorage.getItem('aircraftDB_Local')) || {}; }

    function addEntry() {
        const f = document.getElementById('new-fabrikant').value.trim();
        const t = document.getElementById('new-type').value.trim();
        const i = document.getElementById('new-image').value.trim();
        const w = document.getElementById('new-warning').value.trim();
        if(!f || !t || !i) return alert('Fill fields');
        let local = getLocal();
        if(!local[f]) local[f] = aircraftData[f] ? JSON.parse(JSON.stringify(aircraftData[f])) : {};
        
        // Behoud stippen als we alleen de waarschuwing of afbeelding updaten
        const dots = (aircraftData[f] && aircraftData[f][t]) ? aircraftData[f][t].dots : [];
        local[f][t] = { img: i, dots: dots, warning: w };
        
        saveLocal(local);
        location.reload();
    }

    function showImage() {
        const f = document.getElementById('select-fabrikant').value;
        const t = document.getElementById('select-type').value;
        const wrap = document.getElementById('wrapper');
        const imgT = document.getElementById('vliegtuig-beeld');
        const warnB = document.getElementById('warning-box');
        const relL = document.getElementById('related-links');
        
        if(f && t && aircraftData[f][t]) {
            const entry = aircraftData[f][t];
            imgT.src = "Images/" + entry.img;
            
            // Waarschuwing tonen indien aanwezig
            if(entry.warning && entry.warning !== "") {
                warnB.innerText = "⚠️ " + entry.warning;
                warnB.style.display = "block";
            } else {
                warnB.style.display = "none";
            }

            imgT.onload = () => { wrap.style.display = "block"; renderDots(); };
            
            relL.innerHTML = "";
            let found = false;
            for (let oF in aircraftData) {
                for (let oT in aircraftData[oF]) {
                    if (aircraftData[oF][oT].img === entry.img && (oF !== f || oT !== t)) {
                        found = true;
                        const a = document.createElement('span');
                        a.className = "related-link"; a.innerText = oF + " " + oT;
                        a.onclick = () => { document.getElementById('select-fabrikant').value = oF; updateTypes(); document.getElementById('select-type').value = oT; showImage(); };
                        relL.appendChild(a);
                    }
                }
            }
            document.getElementById('related-section').style.display = found ? "block" : "none";
        } else { wrap.style.display = "none"; document.getElementById('related-section').style.display = "none"; }
        if(isEditor) checkDotEditor();
    }

    // --- De rest van de functies blijven hetzelfde ---
    function handleImageClick(e) {
        if(!isEditor) return;
        const f = document.getElementById('select-fabrikant').value;
        const t = document.getElementById('select-type').value;
        if(!f || !t) return;
        const rect = e.target.getBoundingClientRect();
        const x = ((e.clientX - rect.left) / rect.width) * 100;
        const y = ((e.clientY - rect.top) / rect.height) * 100;
        const info = prompt("Location description:");
        if(info) {
            let local = getLocal();
            if(!local[f]) local[f] = JSON.parse(JSON.stringify(aircraftData[f]));
            if(!local[f][t]) local[f][t] = JSON.parse(JSON.stringify(aircraftData[f][t]));
            local[f][t].dots.push({x, y, info});
            saveLocal(local);
            if(!aircraftData[f][t]) aircraftData[f][t] = { dots: [] };
            aircraftData[f][t].dots.push({x, y, info});
            renderDots(); checkDotEditor();
        }
    }

    function renderDots() {
        const f = document.getElementById('select-fabrikant').value;
        const t = document.getElementById('select-type').value;
        const layer = document.getElementById('dots-layer');
        layer.innerHTML = "";
        if(aircraftData[f] && aircraftData[f][t]) {
            aircraftData[f][t].dots.forEach(d => {
                const dot = document.createElement('div');
                dot.className = 'dot'; dot.style.left = d.x + "%"; dot.style.top = d.y + "%";
                dot.setAttribute('data-info', d.info); layer.appendChild(dot);
            });
        }
    }

    function checkDotEditor() {
        const f = document.getElementById('select-fabrikant').value;
        const t = document.getElementById('select-type').value;
        const list = document.getElementById('current-dots');
        if (t && isEditor && aircraftData[f] && aircraftData[f][t]) {
            document.getElementById('dot-editor').classList.remove('hidden');
            list.innerHTML = "";
            aircraftData[f][t].dots.forEach((d, i) => {
                const item = document.createElement('div');
                item.className = 'dot-item';
                item.innerHTML = `<div class="dot-info-text">${d.info}</div>
                    <div class="dot-actions">
                        <button class="btn-edit" onclick="editDot(${i})">Edit</button>
                        <button class="btn-delete" onclick="delDot(${i})">Del</button>
                    </div>`;
                list.appendChild(item);
            });
        } else { document.getElementById('dot-editor').classList.add('hidden'); }
    }

    function renameManufacturer() {
        const oldF = document.getElementById('select-fabrikant').value;
        const newF = prompt("New name?", oldF);
        if(newF && newF !== oldF) {
            let local = getLocal(); local[newF] = JSON.parse(JSON.stringify(aircraftData[oldF]));
            local[oldF] = null; saveLocal(local); location.reload();
        }
    }

    function deleteManufacturer() {
        const f = document.getElementById('select-fabrikant').value;
        if(f && confirm("Delete " + f + "?")) {
            let local = getLocal(); local[f] = null;
            saveLocal(local); location.reload();
        }
    }

    function renameType() {
        const f = document.getElementById('select-fabrikant').value;
        const oldT = document.getElementById('select-type').value;
        const newT = prompt("New name?", oldT);
        if(newT && newT !== oldT) {
            let local = getLocal();
            if(!local[f]) local[f] = JSON.parse(JSON.stringify(aircraftData[f]));
            local[f][newT] = JSON.parse(JSON.stringify(aircraftData[f][oldT]));
            local[f][oldT] = null;
            saveLocal(local); location.reload();
        }
    }

    function deleteType() {
        const f = document.getElementById('select-fabrikant').value;
        const t = document.getElementById('select-type').value;
        if(t && confirm("Delete " + t + "?")) {
            let local = getLocal();
            if(!local[f]) local[f] = JSON.parse(JSON.stringify(aircraftData[f]));
            local[f][t] = null;
            saveLocal(local); location.reload();
        }
    }

    function loadManufacturers() {
        const sel = document.getElementById('select-fabrikant');
        const cur = sel.value;
        sel.innerHTML = '<option value="">-- Select Manufacturer --</option>';
        Object.keys(aircraftData).sort().forEach(f => {
            let opt = document.createElement('option');
            opt.value = f; opt.text = f; sel.add(opt);
        });
        sel.value = cur;
    }

    function updateTypes() {
        const f = document.getElementById('select-fabrikant').value;
        const sel = document.getElementById('select-type');
        sel.innerHTML = '<option value="">-- Select Type --</option>';
        if(aircraftData[f]) {
            Object.keys(aircraftData[f]).sort().forEach(t => {
                let opt = document.createElement('option');
                opt.value = t; opt.text = t; sel.add(opt);
            });
        }
        showImage();
    }

    function editDot(i) {
        const f = document.getElementById('select-fabrikant').value;
        const t = document.getElementById('select-type').value;
        const newI = prompt("Update:", aircraftData[f][t].dots[i].info);
        if(newI) {
            let local = getLocal();
            if(!local[f]) local[f] = JSON.parse(JSON.stringify(aircraftData[f]));
            if(!local[f][t]) local[f][t] = JSON.parse(JSON.stringify(aircraftData[f][t]));
            local[f][t].dots[i].info = newI;
            saveLocal(local); aircraftData[f][t].dots[i].info = newI;
            renderDots(); checkDotEditor();
        }
    }

    function delDot(i) {
        const f = document.getElementById('select-fabrikant').value;
        const t = document.getElementById('select-type').value;
        if(confirm("Delete?")) {
            let local = getLocal();
            if(!local[f]) local[f] = JSON.parse(JSON.stringify(aircraftData[f]));
            if(!local[f][t]) local[f][t] = JSON.parse(JSON.stringify(aircraftData[f][t]));
            local[f][t].dots.splice(i, 1);
            saveLocal(local); aircraftData[f][t].dots.splice(i, 1);
            renderDots(); checkDotEditor();
        }
    }

    function exportData() {
        document.getElementById('export-area').value = "const permanentData = " + JSON.stringify(aircraftData, null, 2) + ";";
        document.getElementById('export-area').select();
    }

    refreshDataStructure();
</script>
</body>
</html>
