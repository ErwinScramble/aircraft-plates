<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aircraft Plates Database</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; padding: 20px; background: #f0f2f5; color: #333; margin: 0; }
        .container { max-width: 800px; margin: 20px auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #1a73e8; margin-top: 0; }
        label { font-weight: bold; display: block; margin-top: 15px; }
        select, input, button, textarea { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        
        .image-container { position: relative; width: 100%; margin-top: 20px; display: none; line-height: 0; overflow: visible; border-radius: 8px; background: #eee; border: 1px solid #ddd; }
        #vliegtuig-beeld { width: 100%; height: auto; display: block; cursor: crosshair; border-radius: 8px; }

        .dot { 
            position: absolute; width: 18px; height: 18px; 
            background: #ff0000; border: 2px solid #fff; border-radius: 50%; 
            transform: translate(-50%, -50%); cursor: pointer; 
            box-shadow: 0 0 8px rgba(0,0,0,0.5); z-index: 5; 
            touch-action: manipulation; outline: none;
        }
        .dot:hover { z-index: 100; }
        .dot::after { 
            content: attr(data-info); position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%); 
            background: rgba(0,0,0,0.9); color: white; padding: 8px 12px; border-radius: 6px; font-size: 13px; 
            white-space: normal; width: 180px; text-align: center; line-height: 1.4; display: none; 
            z-index: 101; pointer-events: none; box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        .dot:hover::after, .dot:focus::after { display: block; }

        #display-warning {
            position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%);
            background: rgba(211, 47, 47, 0.85); color: white;
            padding: 8px 15px; border-radius: 5px; font-size: 14px; font-weight: bold;
            text-align: center; z-index: 10; display: none; max-width: 80%; line-height: 1.2; pointer-events: none;
        }

        .auto-links { margin: 10px 0; font-size: 14px; color: #666; display: none; }
        .reference-link { color: #1a73e8; text-decoration: underline; cursor: pointer; font-weight: bold; margin-right: 10px; }
        .reference-link:hover { color: #0d47a1; }

        .admin-panel { margin-top: 40px; padding-top: 20px; border-top: 2px dashed #ccc; }
        .admin-box { background: #f8f9fa; padding: 15px; border-radius: 8px; border: 1px solid #e9ecef; margin-top: 10px; }
        .dot-item { background: white; margin: 5px 0; padding: 8px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; }
        
        .btn-save { background: #28a745; color: white; border: none; font-weight: bold; cursor: pointer; }
        .btn-download { background: #17a2b8; color: white; border: none; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-copy { background: #007bff; color: white; border: none; cursor: pointer; margin-top: 5px; }
        .btn-logout { background: #dc3545; color: white; border: none; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>Aircraft Plates</h1>
    
    <label>1. Manufacturer:</label>
    <select id="select-fabrikant" onchange="updateTypes()">
        <option value="">-- Select Manufacturer --</option>
    </select>

    <label>2. Aircraft Type:</label>
    <select id="select-type" onchange="showImage()">
        <option value="">-- Select Type --</option>
    </select>

    <div id="auto-links-display" class="auto-links">
        See also (using the same image): <span id="auto-links-list"></span>
    </div>

    <div class="image-container" id="wrapper">
        <img id="vliegtuig-beeld" src="" alt="Aircraft Plate" onclick="handleImageClick(event)">
        <div id="dots-layer"></div>
        <div id="display-warning"></div>
    </div>

    <div class="admin-panel">
        <button id="auth-btn" onclick="authenticateEditor()" style="background:#6c757d; color:white; border:none; cursor:pointer;">Editor Login</button>
        
        <div id="admin-controls" class="hidden">
            <div class="admin-box">
                <h3>Editor Menu</h3>
                <input type="text" id="new-fabrikant" placeholder="Manufacturer (e.g. Mil)">
                <input type="text" id="new-type" placeholder="Type (e.g. Mi-2)">
                <input type="text" id="new-image" placeholder="Filename (e.g. mi2.jpg)">
                <textarea id="new-warning" placeholder="Optional Warning Text"></textarea>
                <button class="btn-save" onclick="addEntry()">Save / Update Aircraft</button>
                
                <div id="dot-editor" class="hidden">
                    <hr>
                    <h4>Manage Dots</h4>
                    <ul id="current-dots" style="list-style:none; padding:0;"></ul>
                </div>
                <hr>
                <h4>Publish to GitHub</h4>
                <p><small>1. Click "Download data.js" below.<br>
                2. Upload the file to GitHub using the link below.</small></p>
                
                <button class="btn-download" onclick="downloadDataFile()">Download data.js</button>
                <button class="btn-copy" onclick="copyToClipboard()">Or Copy Code to Clipboard</button>
                <textarea id="export-area" style="position:absolute; left:-9999px;" readonly></textarea>
                
                <p><small><a href="https://github.com" target="_blank" style="color:#1a73e8; font-weight:bold;">→ Open GitHub Upload Page</a></small></p>
                
                <button class="btn-logout" onclick="logoutEditor()">Logout Editor</button>
            </div>
        </div>
    </div>
</div>

<script src="data.js"></script>

<script>
    let githubData = (typeof permanentData !== 'undefined') ? permanentData : {};
    let localData = JSON.parse(localStorage.getItem('aircraftDB')) || {};
    let aircraftData = {};
    
    // Functie voor natuurlijke sortering (Mi-2 voor Mi-14)
    const naturalSort = (a, b) => a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' });

    function mergeData() {
        aircraftData = JSON.parse(JSON.stringify(githubData));
        for (let f in localData) {
            if (!aircraftData[f]) aircraftData[f] = {};
            for (let t in localData[f]) { aircraftData[f][t] = localData[f][t]; }
        }
    }
    mergeData();

    let isEditor = false;

    function authenticateEditor() {
        if(prompt("Enter Access Key:") === "Scr@mble-Pl@tes") {
            isEditor = true;
            document.getElementById('admin-controls').classList.remove('hidden');
            document.getElementById('auth-btn').classList.add('hidden');
            checkDotEditorVisibility();
        }
    }

    function logoutEditor() {
        isEditor = false;
        location.reload(); 
    }

    function addEntry() {
        const fab = document.getElementById('new-fabrikant').value.trim();
        const type = document.getElementById('new-type').value.trim();
        const img = document.getElementById('new-image').value.trim();
        const warn = document.getElementById('new-warning').value.trim();
        
        if(!fab || !type || !img) return alert("Fill required fields");
        
        if(!localData[fab]) localData[fab] = {};
        const dots = (aircraftData[fab] && aircraftData[fab][type]) ? aircraftData[fab][type].dots : [];
        
        localData[fab][type] = { img, dots, warning: warn };
        localStorage.setItem('aircraftDB', JSON.stringify(localData));
        
        mergeData();
        loadManufacturers();
        
        document.getElementById('new-fabrikant').value = "";
        document.getElementById('new-type').value = "";
        document.getElementById('new-image').value = "";
        document.getElementById('new-warning').value = "";

        alert("Saved successfully! Numerical order updated.");
    }

    function generateFinalCode() {
        return "const permanentData = " + JSON.stringify(aircraftData, null, 2) + ";";
    }

    function downloadDataFile() {
        const code = generateFinalCode();
        const blob = new Blob([code], { type: "text/javascript" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "data.js";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        alert("File 'data.js' downloaded.");
    }

    function copyToClipboard() {
        const area = document.getElementById('export-area');
        area.value = generateFinalCode();
        area.select();
        document.execCommand('copy');
        alert("Code copied!");
    }

    function loadManufacturers() {
        const sel = document.getElementById('select-fabrikant');
        const currentVal = sel.value;
        sel.innerHTML = '<option value="">-- Select Manufacturer --</option>';
        Object.keys(aircraftData).sort(naturalSort).forEach(f => {
            let opt = document.createElement('option');
            opt.value = f; opt.text = f; sel.add(opt);
        });
        sel.value = currentVal;
    }

    function updateTypes() {
        const fab = document.getElementById('select-fabrikant').value;
        const sel = document.getElementById('select-type');
        sel.innerHTML = '<option value="">-- Select Type --</option>';
        if(aircraftData[fab]) {
            Object.keys(aircraftData[fab]).sort(naturalSort).forEach(t => {
                let opt = document.createElement('option');
                opt.value = t; opt.text = t; sel.add(opt);
            });
        }
        showImage();
    }

    function showImage() {
        const f = document.getElementById('select-fabrikant').value;
        const t = document.getElementById('select-type').value;
        const wrap = document.getElementById('wrapper');
        const img = document.getElementById('vliegtuig-beeld');
        const warnDiv = document.getElementById('display-warning');
        const linksDiv = document.getElementById('auto-links-display');
        
        if(f && t && aircraftData[f][t]) {
            const currentImg = aircraftData[f][t].img;
            img.src = "Images/" + currentImg;
            img.onload = () => { 
                wrap.style.display = "block"; 
                renderDots(); 
                
                if(aircraftData[f][t].warning) {
                    warnDiv.innerText = aircraftData[f][t].warning;
                    warnDiv.style.display = "block";
                } else {
                    warnDiv.style.display = "none";
                }
                findAutoLinks(currentImg, f, t);
            };
        } else {
            wrap.style.display = "none";
            linksDiv.style.display = "none";
        }
        checkDotEditorVisibility();
    }

    function findAutoLinks(imageName, currentFab, currentType) {
        const listSpan = document.getElementById('auto-links-list');
        const linksDiv = document.getElementById('auto-links-display');
        listSpan.innerHTML = "";
        let found = false;

        for (let fab in aircraftData) {
            for (let type in aircraftData[fab]) {
                if (aircraftData[fab][type].img === imageName && (fab !== currentFab || type !== currentType)) {
                    found = true;
                    let link = document.createElement('span');
                    link.className = "reference-link";
                    link.innerText = `${fab} ${type}`;
                    link.onclick = () => {
                        document.getElementById('select-fabrikant').value = fab;
                        updateTypes();
                        document.getElementById('select-type').value = type;
                        showImage();
                    };
                    listSpan.appendChild(link);
                }
            }
        }
        linksDiv.style.display = found ? "block" : "none";
    }

    function handleImageClick(e) {
        if(!isEditor) return;
        const f = document.getElementById('select-fabrikant').value;
        const t = document.getElementById('select-type').value;
        if(!f || !t) return;
        const rect = e.target.getBoundingClientRect();
        const x = ((e.clientX - rect.left) / rect.width) * 100;
        const y = ((e.clientY - rect.top) / rect.height) * 100;
        const info = prompt("Dot description:");
        if(info) {
            if(!localData[f]) localData[f] = {};
            if(!localData[f][t]) localData[f][t] = JSON.parse(JSON.stringify(aircraftData[f][t]));
            localData[f][t].dots.push({x, y, info});
            localStorage.setItem('aircraftDB', JSON.stringify(localData));
            mergeData(); renderDots(); renderDotList();
        }
    }

    function renderDots() {
        const f = document.getElementById('select-fabrikant').value;
        const t = document.getElementById('select-type').value;
        const layer = document.getElementById('dots-layer');
        layer.innerHTML = "";
        if(aircraftData[f] && aircraftData[f][t]) {
            aircraftData[f][t].dots.forEach(d => {
                const dot = document.createElement('div');
                dot.className = 'dot'; dot.style.left = d.x + "%"; dot.style.top = d.y + "%";
                dot.setAttribute('data-info', d.info); layer.appendChild(dot);
            });
        }
    }

    function renderDotList() {
        const f = document.getElementById('select-fabrikant').value;
        const t = document.getElementById('select-type').value;
        const list = document.getElementById('current-dots');
        list.innerHTML = "";
        if(aircraftData[f] && aircraftData[f][t]) {
            aircraftData[f][t].dots.forEach((d, i) => {
                const li = document.createElement('li');
                li.className = "dot-item";
                li.innerHTML = `<span>${d.info}</span> <button onclick="delDot(${i})" style="width:auto; background:red; color:white; border:none; padding:5px; border-radius:4px; cursor:pointer;">Delete</button>`;
                list.appendChild(li);
            });
        }
    }

    function delDot(i) {
        const f = document.getElementById('select-fabrikant').value;
        const t = document.getElementById('select-type').value;
        localData[f][t].dots.splice(i, 1);
        localStorage.setItem('aircraftDB', JSON.stringify(localData));
        mergeData(); renderDots(); renderDotList();
    }

    function checkDotEditorVisibility() {
        const hasType = document.getElementById('select-type').value !== "";
        document.getElementById('dot-editor').classList.toggle('hidden', !isEditor || !hasType);
        if(isEditor && hasType) renderDotList();
    }

    loadManufacturers();
</script>
</body>
</html>
