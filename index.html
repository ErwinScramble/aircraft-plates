<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aircraft Plates Database</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; padding: 20px; background: #f0f2f5; color: #333; }
        .container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #1a73e8; }
        label { font-weight: bold; display: block; margin-top: 15px; }
        select, input, button { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        
        /* De Image Wrapper */
        .image-container { position: relative; width: 100%; margin-top: 20px; display: none; line-height: 0; }
        #vliegtuig-beeld { width: 100%; height: auto; border-radius: 8px; }

        /* De Rode Stip */
        .dot {
            position: absolute;
            width: 20px; height: 20px;
            background: red;
            border: 2px solid white;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            cursor: pointer;
            box-shadow: 0 0 5px rgba(0,0,0,0.5);
        }

        /* Tooltip (Beschrijving) */
        .dot::after {
            content: attr(data-info);
            position: absolute;
            bottom: 25px; left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            white-space: nowrap;
            display: none;
            z-index: 10;
        }
        .dot:hover::after { display: block; }

        .admin-panel { margin-top: 40px; padding-top: 20px; border-top: 2px dashed #ccc; }
        .hidden { display: none; }
        .admin-box { background: #f8f9fa; padding: 15px; border-radius: 8px; border: 1px solid #e9ecef; }
        .dot-list { list-style: none; padding: 0; }
        .dot-item { background: #eee; margin: 5px 0; padding: 5px; display: flex; justify-content: space-between; border-radius: 4px; font-size: 0.9em; }
    </style>
</head>
<body>

<div class="container">
    <h1>Aircraft Plates</h1>
    
    <label>Manufacturer:</label>
    <select id="select-fabrikant" onchange="updateTypes()">
        <option value="">-- Select Manufacturer --</option>
    </select>

    <label>Aircraft Type:</label>
    <select id="select-type" onchange="showImage()">
        <option value="">-- Select Type --</option>
    </select>

    <div class="image-container" id="wrapper">
        <img id="vliegtuig-beeld" src="" alt="Aircraft Plate" onclick="handleImageClick(event)">
        <div id="dots-layer"></div>
    </div>

    <!-- Admin Editor Section -->
    <div class="admin-panel">
        <button onclick="toggleAdmin()">Toggle Editor Menu</button>
        <div id="admin-controls" class="hidden">
            <div class="admin-box">
                <h3>Add/Edit Aircraft</h3>
                <input type="text" id="new-fabrikant" placeholder="Manufacturer (e.g. Boeing)">
                <input type="text" id="new-type" placeholder="Type (e.g. 737)">
                <input type="text" id="new-image" placeholder="Image filename (e.g. b737.jpg)">
                <button onclick="addEntry()" style="background: #28a745; color: white;">Save Aircraft</button>
                
                <div id="dot-editor" class="hidden">
                    <hr>
                    <h4>Dots for selected type:</h4>
                    <p><small>Click on the image above to place a red dot.</small></p>
                    <ul id="current-dots" class="dot-list"></ul>
                </div>
            </div>
            <button onclick="clearAll()" style="background: #dc3545; color: white;">Reset All Data</button>
        </div>
    </div>
</div>

<script>
    let aircraftData = JSON.parse(localStorage.getItem('aircraftDB')) || {};

    function toggleAdmin() {
        document.getElementById('admin-controls').classList.toggle('hidden');
        checkDotEditorVisibility();
    }

    function checkDotEditorVisibility() {
        const type = document.getElementById('select-type').value;
        const dotEditor = document.getElementById('dot-editor');
        if (type && !document.getElementById('admin-controls').classList.contains('hidden')) {
            dotEditor.classList.remove('hidden');
            renderDotList();
        } else {
            dotEditor.classList.add('hidden');
        }
    }

    function addEntry() {
        const fab = document.getElementById('new-fabrikant').value.trim();
        const type = document.getElementById('new-type').value.trim();
        const img = document.getElementById('new-image').value.trim();
        if(!fab || !type || !img) return alert('Fill in all fields');
        
        if(!aircraftData[fab]) aircraftData[fab] = {};
        if(!aircraftData[fab][type]) aircraftData[fab][type] = { img: img, dots: [] };
        
        localStorage.setItem('aircraftDB', JSON.stringify(aircraftData));
        location.reload();
    }

    function loadManufacturers() {
        const fabSelect = document.getElementById('select-fabrikant');
        Object.keys(aircraftData).sort().forEach(fab => {
            let opt = document.createElement('option');
            opt.value = fab; opt.innerHTML = fab;
            fabSelect.appendChild(opt);
        });
    }

    function updateTypes() {
        const fab = document.getElementById('select-fabrikant').value;
        const typeSelect = document.getElementById('select-type');
        typeSelect.innerHTML = '<option value="">-- Select Type --</option>';
        if(aircraftData[fab]) {
            Object.keys(aircraftData[fab]).sort().forEach(type => {
                let opt = document.createElement('option');
                opt.value = type; opt.innerHTML = type;
                typeSelect.appendChild(opt);
            });
        }
        showImage();
    }

    function showImage() {
        const fab = document.getElementById('select-fabrikant').value;
        const type = document.getElementById('select-type').value;
        const wrapper = document.getElementById('wrapper');
        const imgTag = document.getElementById('vliegtuig-beeld');
        
        if(fab && type) {
            imgTag.src = "Images/" + aircraftData[fab][type].img;
            wrapper.style.display = "block";
            renderDots();
        } else {
            wrapper.style.display = "none";
        }
        checkDotEditorVisibility();
    }

    // Klikken op afbeelding om stip te plaatsen
    function handleImageClick(event) {
        if(document.getElementById('admin-controls').classList.contains('hidden')) return;

        const fab = document.getElementById('select-fabrikant').value;
        const type = document.getElementById('select-type').value;
        if(!fab || !type) return;

        const rect = event.target.getBoundingClientRect();
        const x = ((event.clientX - rect.left) / rect.width) * 100;
        const y = ((event.clientY - rect.top) / rect.height) * 100;

        const info = prompt("Enter description for Serial Number location:");
        if(info) {
            aircraftData[fab][type].dots.push({ x: x, y: y, info: info });
            localStorage.setItem('aircraftDB', JSON.stringify(aircraftData));
            renderDots();
            renderDotList();
        }
    }

    function renderDots() {
        const fab = document.getElementById('select-fabrikant').value;
        const type = document.getElementById('select-type').value;
        const layer = document.getElementById('dots-layer');
        layer.innerHTML = "";

        if(aircraftData[fab] && aircraftData[fab][type]) {
            aircraftData[fab][type].dots.forEach((dot, index) => {
                const dotDiv = document.createElement('div');
                dotDiv.className = 'dot';
                dotDiv.style.left = dot.x + "%";
                dotDiv.style.top = dot.y + "%";
                dotDiv.setAttribute('data-info', dot.info);
                layer.appendChild(dotDiv);
            });
        }
    }

    function renderDotList() {
        const fab = document.getElementById('select-fabrikant').value;
        const type = document.getElementById('select-type').value;
        const list = document.getElementById('current-dots');
        list.innerHTML = "";

        if(aircraftData[fab] && aircraftData[fab][type]) {
            aircraftData[fab][type].dots.forEach((dot, index) => {
                const li = document.createElement('li');
                li.className = 'dot-item';
                li.innerHTML = `<span>${dot.info} (${Math.round(dot.x)}%, ${Math.round(dot.y)}%)</span> 
                                <button onclick="deleteDot(${index})" style="width:auto; margin:0; padding:2px 10px; background:red; color:white;">X</button>`;
                list.appendChild(li);
            });
        }
    }

    function deleteDot(index) {
        const fab = document.getElementById('select-fabrikant').value;
        const type = document.getElementById('select-type').value;
        aircraftData[fab][type].dots.splice(index, 1);
        localStorage.setItem('aircraftDB', JSON.stringify(aircraftData));
        renderDots();
        renderDotList();
    }

    function clearAll() {
        if(confirm('Delete EVERYTHING?')) {
            localStorage.removeItem('aircraftDB');
            location.reload();
        }
    }

    loadManufacturers();
</script>

</body>
</html>
