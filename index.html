<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aircraft MSN Locator</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f0f4f8; margin: 0; padding: 20px; color: #1a202c; }
        .container { max-width: 1100px; margin: 0 auto; text-align: center; }
        header { margin-bottom: 40px; }
        .search-box { width: 100%; max-width: 600px; padding: 18px 25px; border-radius: 50px; border: 2px solid #cbd5e0; font-size: 18px; outline: none; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 25px; text-align: left; margin-top: 30px; }
        .card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border: 1px solid #e2e8f0; }
        .manufacturer { color: #3182ce; font-size: 12px; text-transform: uppercase; font-weight: 700; letter-spacing: 1px; }
        .model { font-size: 20px; font-weight: 700; margin: 10px 0; color: #1a202c; }
        .location-bubble { background: #edf2f7; padding: 15px; border-radius: 10px; border-left: 5px solid #3182ce; font-size: 14px; line-height: 1.5; color: #2d3748; }
        .notes { font-size: 12px; color: #718096; margin-top: 15px; font-style: italic; }
        .status-msg { margin: 20px; font-weight: bold; color: #3182ce; }
        .error-msg { color: #c53030; background: #fff5f5; padding: 15px; border-radius: 8px; border: 1px solid #feb2b2; display: none; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>✈️ Aircraft MSN Locator</h1>
        <p>Search for the location of Construction Number plates</p>
        <input type="text" id="searchInput" class="search-box" placeholder="Type to search (e.g. F-16, Boeing, Mi-8)...">
    </header>

    <div id="status" class="status-msg">Connecting to database...</div>
    <div id="errorBox" class="error-msg"></div>
    <div id="resultsGrid" class="grid"></div>
</div>

<script>
    let aircraftData = [];
    const filename = 'aircraft_plates_db.csv';

    // Functie om CSV handmatig te parsen zonder externe bibliotheek
    function parseCSV(text) {
        const lines = text.split('\n');
        const headers = lines[0].split(',');
        return lines.slice(1).filter(line => line.trim() !== "").map(line => {
            const values = line.split(',');
            return headers.reduce((obj, header, i) => {
                obj[header.trim()] = values[i] ? values[i].trim() : "";
                return obj;
            }, {});
        });
    }

    // Data ophalen
    fetch(filename)
        .then(response => {
            if (!response.ok) throw new Error('File not found');
            return response.text();
        })
        .then(text => {
            aircraftData = parseCSV(text);
            document.getElementById('status').style.display = 'none';
            displayResults(aircraftData);
        })
        .catch(err => {
            document.getElementById('status').style.display = 'none';
            const errBox = document.getElementById('errorBox');
            errBox.style.display = 'block';
            errBox.innerHTML = `<strong>Error:</strong> Could not load <code>${filename}</code>. <br>Please ensure the file is named correctly on GitHub.`;
        });

    // Zoekfunctie
    document.getElementById('searchInput').addEventListener('input', (e) => {
        const term = e.target.value.toLowerCase();
        const filtered = aircraftData.filter(item => 
            Object.values(item).join(' ').toLowerCase().includes(term)
        );
        displayResults(filtered);
    });

    function displayResults(data) {
        const grid = document.getElementById('resultsGrid');
        grid.innerHTML = '';
        if (data.length === 0) return;

        data.forEach(item => {
            const val = Object.values(item);
            if (val.length < 2) return;
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="manufacturer">${val[0] || 'Unknown'}</div>
                <div class="model">${val[1] || 'Unknown Type'}</div>
                <div class="location-bubble"><strong>📍 Plate Location:</strong><br>${val[2] || 'Not specified'}</div>
                ${val[3] ? `<div class="notes">${val[3]}</div>` : ''}
            `;
            grid.appendChild(card);
        });
    }
</script>

</body>
</html>
