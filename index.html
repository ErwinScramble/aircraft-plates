<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSN Locator - Debug Edition</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root { --blue: #2563eb; --dark: #0f172a; --gray: #f1f5f9; --green: #10b981; }
        body { font-family: 'Inter', sans-serif; background: var(--gray); margin: 0; padding: 20px; color: var(--dark); }
        .container { max-width: 1200px; margin: 0 auto; text-align: center; }
        .editor-ui { background: var(--dark); color: white; padding: 20px; border-radius: 15px; margin-bottom: 20px; text-align: left; display: none; }
        .display-box { 
            background: white; border-radius: 24px; padding: 20px; margin: 20px auto;
            height: 450px; box-shadow: 0 15px 40px rgba(0,0,0,0.05);
            position: relative; border: 1px solid #e2e8f0;
            display: flex; align-items: center; justify-content: center;
        }
        #aircraft-img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .marker-dot { position: absolute; width: 24px; height: 24px; background: #ef4444; border-radius: 50%; border: 3px solid white; display: none; transform: translate(-50%, -50%); z-index: 100; }
        .debug-log { font-family: monospace; font-size: 11px; color: #718096; margin-top: 5px; }
        .search-box { width: 100%; max-width: 600px; padding: 15px 25px; border-radius: 50px; border: 2px solid #e2e8f0; font-size: 18px; margin-bottom: 30px; outline: none; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; }
        .card { background: white; padding: 15px; border-radius: 15px; border: 1px solid #e2e8f0; cursor: pointer; text-align: left; }
        .card.selected { border: 2px solid var(--blue); background: #eff6ff; }
        .btn { padding: 10px 20px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>✈️ Aircraft MSN Locator</h1>

    <div id="editorPanel" class="editor-ui">
        <strong>Editor Mode</strong> | PNG Name: <input type="text" id="editCat" oninput="liveUpdate()" style="padding:5px; border-radius:4px; border:none;">
        <button onclick="downloadCSV()" style="background:var(--green); color:white; padding:5px 10px; border-radius:4px; border:none; margin-left:10px; cursor:pointer;">Save CSV</button>
    </div>

    <button onclick="toggleEditor()" class="btn" style="background:white; border:1px solid #ccc; margin-bottom:20px;">⚙️ Toggle Editor</button>

    <div class="display-box" id="map" onclick="handlePoint(event)">
        <img id="aircraft-img" src="" alt="Silhouette">
        <div id="marker" class="marker-dot"></div>
    </div>
    <div id="debugInfo" class="debug-log">Status: Waiting for selection...</div>

    <input type="text" id="search" class="search-box" placeholder="Search aircraft...">
    <div id="results" class="grid"></div>
</div>

<script>
    let db = []; let selected = null; let isEdit = false;

    fetch('aircraft_plates_db.csv?nocache=' + Date.now()).then(r => r.text()).then(t => {
        const rows = t.split(/\r?\n/).slice(1);
        db = rows.filter(r => r.trim()).map(r => {
            const c = r.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
            return { mfr: c[0]||"", model: c[1]||"", loc: (c[2]||"").replace(/"/g,""), cat: (c[4]||"").trim(), x: c[5]||50, y: c[6]||50 };
        });
        render();
    });

    function render(f = '') {
        const g = document.getElementById('results'); g.innerHTML = '';
        db.filter(i => (i.mfr+i.model).toLowerCase().includes(f.toLowerCase())).forEach(item => {
            const d = document.createElement('div'); d.className = `card ${selected === item ? 'selected' : ''}`;
            d.innerHTML = `<strong>${item.mfr}</strong><br>${item.model}`;
            d.onclick = () => selectAircraft(item); g.appendChild(d);
        });
    }

    function selectAircraft(item) {
        selected = item; render(document.getElementById('search').value);
        const img = document.getElementById('aircraft-img');
        const debug = document.getElementById('debugInfo');
        
        // DE FIX: We gebruiken de volledige URL om fouten te voorkomen
        const fullPath = window.location.href.split('index.html')[0] + 'silhouettes/' + item.cat + '.png';
        debug.innerText = "Attempting to load: " + fullPath;
        
        img.src = fullPath;
        img.style.display = 'block';
        
        img.onerror = () => { debug.innerText = "❌ FAILED to load: silhouettes/" + item.cat + ".png (Check case-sensitivity!)"; };
        img.onload = () => { debug.innerText = "✅ Successfully loaded silhouettes/" + item.cat + ".png"; };

        if(isEdit) document.getElementById('editCat').value = item.cat;

        const dot = document.getElementById('marker');
        dot.style.left = item.x + '%'; dot.style.top = item.y + '%';
        dot.style.display = 'block';
    }

    function handlePoint(e) {
        if(!isEdit || !selected) return;
        const rect = document.getElementById('map').getBoundingClientRect();
        selected.x = Math.round(((e.clientX - rect.left) / rect.width) * 100);
        selected.y = Math.round(((e.clientY - rect.top) / rect.height) * 100);
        document.getElementById('marker').style.left = selected.x + '%';
        document.getElementById('marker').style.top = selected.y + '%';
    }

    function liveUpdate() { if(selected) selected.cat = document.getElementById('editCat').value; }
    function toggleEditor() { isEdit = !isEdit; document.getElementById('editorPanel').style.display = isEdit ? 'block' : 'none'; }
    
    function downloadCSV() {
        let csv = "Manufacturer,Model,Plate_Location,Notes,Category,X,Y\n";
        db.forEach(i => { csv += `${i.mfr},${i.model},"${i.loc}","",${i.cat},${i.x},${i.y}\n`; });
        const blob = new Blob([csv], { type: 'text/csv' });
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'aircraft_plates_db.csv'; a.click();
    }
    document.getElementById('search').oninput = (e) => render(e.target.value);
</script>
</body>
</html>
