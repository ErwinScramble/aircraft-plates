<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aircraft Plates Database</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; padding: 20px; background: #f0f2f5; color: #333; margin: 0; }
        .container { max-width: 800px; margin: 20px auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #1a73e8; margin-top: 0; }
        label { font-weight: bold; display: block; margin-top: 15px; }
        select, input, button { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        .image-container { position: relative; width: 100%; margin-top: 20px; display: none; line-height: 0; overflow: hidden; border-radius: 8px; background: #eee; border: 1px solid #ddd; }
        #vliegtuig-beeld { width: 100%; height: auto; display: block; cursor: crosshair; }
        .dot { position: absolute; width: 18px; height: 18px; background: #ff0000; border: 2px solid #fff; border-radius: 50%; transform: translate(-50%, -50%); cursor: pointer; box-shadow: 0 0 8px rgba(0,0,0,0.5); z-index: 5; }
        .dot::after { content: attr(data-info); position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.85); color: white; padding: 6px 12px; border-radius: 4px; font-size: 13px; white-space: nowrap; display: none; z-index: 10; pointer-events: none; }
        .dot:hover::after { display: block; }
        .admin-panel { margin-top: 40px; padding-top: 20px; border-top: 2px dashed #ccc; }
        .admin-box { background: #f8f9fa; padding: 15px; border-radius: 8px; border: 1px solid #e9ecef; margin-top: 10px; }
        .item-list { background: white; margin: 5px 0; padding: 8px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; }
        .btn-save { background: #28a745; color: white; border: none; font-weight: bold; cursor: pointer; }
        .btn-export { background: #17a2b8; color: white; border: none; cursor: pointer; margin-top: 10px; font-weight: bold; }
        .btn-del { background: #dc3545; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; width: auto; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>Aircraft Plates</h1>
    
    <label>1. Manufacturer:</label>
    <select id="select-fabrikant" onchange="updateTypes()">
        <option value="">-- Select Manufacturer --</option>
    </select>

    <label>2. Aircraft Type:</label>
    <select id="select-type" onchange="showImage()">
        <option value="">-- Select Type --</option>
    </select>

    <div class="image-container" id="wrapper">
        <img id="vliegtuig-beeld" src="" alt="Aircraft Plate" onclick="handleImageClick(event)">
        <div id="dots-layer"></div>
    </div>

    <div class="admin-panel">
        <button id="auth-btn" onclick="authenticateEditor()" style="background:#6c757d; color:white; border:none; cursor:pointer;">Editor Login</button>
        
        <div id="admin-controls" class="hidden">
            <div class="admin-box">
                <h3>Add New Aircraft</h3>
                <input type="text" id="new-fabrikant" placeholder="Manufacturer (e.g. Boeing)">
                <input type="text" id="new-type" placeholder="Type (e.g. 737)">
                <input type="text" id="new-image-manual" placeholder="Filename (e.g. b737.jpg)">
                <button class="btn-save" onclick="addEntry()">Save to local list</button>
                
                <div id="dot-editor" class="hidden">
                    <hr>
                    <h4>Manage Dots for selected type</h4>
                    <ul id="current-dots" style="list-style:none; padding:0;"></ul>
                </div>

                <hr>
                <h4>Database Management</h4>
                <div id="db-manager" style="max-height: 200px; overflow-y: auto; background: #fff; padding: 10px; border: 1px solid #ddd;"></div>

                <hr>
                <h4>Backup & Publish</h4>
                <button class="btn-export" onclick="exportData()">Generate Full Backup Code</button>
                <textarea id="export-area" style="width:100%; height:120px; margin-top:10px; font-size:10px; font-family:monospace;" readonly></textarea>
            </div>
        </div>
    </div>
</div>

<script src="data.js"></script>

<script>
    let githubData = (typeof permanentData !== 'undefined') ? permanentData : {};
    let localData = JSON.parse(localStorage.getItem('aircraftDB')) || {};
    let aircraftData = JSON.parse(JSON.stringify(githubData));
    
    for (let f in localData) {
        if (!aircraftData[f]) aircraftData[f] = {};
        for (let t in localData[f]) { aircraftData[f][t] = localData[f][t]; }
    }

    let isEditor = false;

    function authenticateEditor() {
        if(prompt("Enter Access Key:") === "Scr@mble-Pl@tes") { 
            isEditor = true;
            document.getElementById('admin-controls').classList.remove('hidden');
            document.getElementById('auth-btn').innerText = "Editor Mode: ACTIVE";
            document.getElementById('auth-btn').style.background = "#28a745";
            renderDBManager();
            checkDotEditorVisibility();
        } else { alert("Wrong key!"); }
    }

    function addEntry() {
        const fab = document.getElementById('new-fabrikant').value.trim();
        const type = document.getElementById('new-type').value.trim();
        const img = document.getElementById('new-image-manual').value.trim();

        if(!fab || !type || !img) return alert('Fill in all fields');

        if(!aircraftData[fab]) aircraftData[fab] = {};
        const existingDots = aircraftData[fab][type] ? aircraftData[fab][type].dots : [];
        aircraftData[fab][type] = { img: img, dots: existingDots };

        localStorage.setItem('aircraftDB', JSON.stringify(aircraftData));
        
        loadManufacturers();
        document.getElementById('select-fabrikant').value = fab;
        updateTypes();
        document.getElementById('select-type').value = type;
        
        showImage();
        renderDBManager();

        alert('Saved! Image is now active above for dot placement.');
        document.getElementById('new-type').value = "";
        document.getElementById('new-image-manual').value = "";
    }

    function renderDBManager() {
        const div = document.getElementById('db-manager');
        div.innerHTML = "";
        Object.keys(aircraftData).sort().forEach(f => {
            let fabHeader = document.createElement('div');
            fabHeader.innerHTML = `<strong>${f}</strong> <button class="btn-del" onclick="deleteFab('${f}')" style="font-size:10px; margin-left:10px;">Del Fab</button>`;
            fabHeader.style.marginTop = "10px";
            div.appendChild(fabHeader);
            
            Object.keys(aircraftData[f]).sort().forEach(t => {
                let typeRow = document.createElement('div');
                typeRow.className = 'item-list';
                typeRow.innerHTML = `<span> - ${t}</span> <button class="btn-del" onclick="deleteType('${f}', '${t}')">X</button>`;
                div.appendChild(typeRow);
            });
        });
    }

    function deleteType(f, t) {
        if(confirm(`Delete ${f} ${t}?`)) {
            delete aircraftData[f][t];
            if(Object.keys(aircraftData[f]).length === 0) delete aircraftData[f];
            saveAndRefresh();
        }
    }

    function deleteFab(f) {
        if(confirm(`Delete ENTIRE manufacturer: ${f}?`)) {
            delete aircraftData[f];
            saveAndRefresh();
        }
    }

    function saveAndRefresh() {
        localStorage.setItem('aircraftDB', JSON.stringify(aircraftData));
        loadManufacturers();
        updateTypes();
        renderDBManager();
    }

    function exportData() {
        const finalCode = "const permanentData = " + JSON.stringify(aircraftData, null, 2) + ";";
        document.getElementById('export-area').value = finalCode;
        document.getElementById('export-area').select();
        alert("Backup code generated!");
    }

    function loadManufacturers() {
        const sel = document.getElementById('select-fabrikant');
        const currentVal = sel.value;
        sel.innerHTML = '<option value="">-- Select Manufacturer --</option>';
        Object.keys(aircraftData).sort().forEach(f => {
            let opt = document.createElement('option');
            opt.value = f; opt.innerHTML = f; sel.add(opt);
        });
        sel.value = currentVal;
    }

    function updateTypes() {
        const fab = document.getElementById('select-fabrikant').value;
        const sel = document.getElementById('select-type');
        sel.innerHTML = '<option value="">-- Select Type --</option>';
        if(aircraftData[fab]) {
            Object.keys(aircraftData[fab]).sort().forEach(t => {
                let opt = document.createElement('option');
                opt.value = t; opt.innerHTML = t; sel.add(opt);
            });
        }
        showImage();
    }

    function showImage() {
        const f = document.getElementById('select-fabrikant').value;
        const t = document.getElementById('select-type').value;
        const wrap = document.getElementById('wrapper');
        const img = document.getElementById('vliegtuig-beeld');
        if(f && t && aircraftData[f][t]) {
            img.src = "Images/" + aircraftData[f][t].img;
            img.onload = () => { wrap.style.display = "block"; renderDots(); };
        } else { wrap.style.display = "none"; }
        checkDotEditorVisibility();
    }

    function handleImageClick(e) {
        if(!isEditor) return;
        const f = document.getElementById('select-fabrikant').value;
        const t = document.getElementById('select-type').value;
        if(!f || !t) return;
        const rect = e.target.getBoundingClientRect();
        const x = ((e.clientX - rect.left) / rect.width) * 100;
        const y = ((e.clientY - rect.top) / rect.height) * 100;
        const info = prompt("Description (e.g. Serial Number location):");
        if(info) {
            aircraftData[f][t].dots.push({x, y, info});
            localStorage.setItem('aircraftDB', JSON.stringify(aircraftData));
            renderDots(); renderDotList();
        }
    }

    function renderDots() {
        const f = document.getElementById('select-fabrikant').value;
        const t = document.getElementById('select-type').value;
        const layer = document.getElementById('dots-layer');
        layer.innerHTML = "";
        if(aircraftData[f] && aircraftData[f][t]) {
            aircraftData[f][t].dots.forEach(d => {
                const dot = document.createElement('div');
                dot.className = 'dot'; dot.style.left = d.x + "%"; dot.style.top = d.y + "%";
                dot.setAttribute('data-info', d.info); layer.appendChild(dot);
            });
        }
    }

    function renderDotList() {
        const f = document.getElementById('select-fabrikant').value;
        const t = document.getElementById('select-type').value;
        const list = document.getElementById('current-dots');
        list.innerHTML = "";
        if(aircraftData[f] && aircraftData[f][t]) {
            aircraftData[f][t].dots.forEach((d, i) => {
                const li = document.createElement('li');
                li.className = 'item-list';
                li.innerHTML = `<span>${d.info}</span> <button onclick="delDot(${i})" class="btn-del">X</button>`;
                list.appendChild(li);
            });
        }
    }

    function delDot(i) {
        const f = document.getElementById('select-fabrikant').value;
        const t = document.getElementById('select-type').value;
        aircraftData[f][t].dots.splice(i, 1);
        localStorage.setItem('aircraftDB', JSON.stringify(aircraftData));
        renderDots(); renderDotList();
    }

    function checkDotEditorVisibility() {
        const type = document.getElementById('select-type').value;
        const dotEditor = document.getElementById('dot-editor');
        if (type && isEditor) { dotEditor.classList.remove('hidden'); renderDotList(); }
        else { dotEditor.classList.add('hidden'); }
    }

    loadManufacturers();
</script>
</body>
</html>
