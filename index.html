<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aircraft MSN Locator</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root { --blue: #2563eb; --dark: #0f172a; --gray: #f1f5f9; --red: #ef4444; }
        body { font-family: 'Inter', sans-serif; background: var(--gray); margin: 0; padding: 20px; color: var(--dark); }
        .container { max-width: 1000px; margin: 0 auto; text-align: center; }
        .selection-area { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; background: white; padding: 20px; border-radius: 15px; text-align: left; border: 1px solid #e2e8f0; }
        select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #cbd5e0; font-size: 16px; background: white; outline: none; }
        .display-box { background: white; border-radius: 24px; padding: 40px; margin: 20px auto; height: 400px; position: relative; border: 1px solid #e2e8f0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        #aircraft-img { max-width: 100%; max-height: 100%; object-fit: contain; pointer-events: none; }
        .marker-dot { position: absolute; width: 22px; height: 22px; background: var(--red); border-radius: 50%; border: 3px solid white; z-index: 100; transform: translate(-50%, -50%); cursor: default; }
        .marker-dot:hover::after { content: attr(data-label); position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); background: black; color: white; padding: 5px 12px; border-radius: 6px; font-size: 12px; white-space: nowrap; }
        .label-small { font-size: 11px; color: #94a3b8; text-transform: uppercase; font-weight: bold; display: block; margin-bottom: 4px; }
        .notes-area { background: #e2e8f0; padding: 15px; border-radius: 10px; margin-top: 10px; font-size: 14px; display: none; text-align: left; }
    </style>
</head>
<body>

<div class="container">
    <h1>✈️ Aircraft MSN Locator</h1>

    <div class="selection-area">
        <div><label class="label-small">1. Select Manufacturer</label>
            <select id="mfrSelect" onchange="updateModelList()"><option value="">Loading database...</option></select>
        </div>
        <div><label class="label-small">2. Select Model</label>
            <select id="modelSelect" onchange="loadAircraft()" disabled><option value="">-- Choose Manufacturer First --</option></select>
        </div>
    </div>

    <div class="display-box" id="map">
        <img id="aircraft-img" src="" alt="" style="display:none;">
        <div id="markerContainer"></div>
    </div>

    <div id="notesBox" class="notes-area"></div>
</div>

<script>
    let db = []; let selected = null;

    fetch('aircraft_plates_db.csv?v=' + Date.now())
        .then(res => res.text())
        .then(data => {
            const rows = data.split(/\r?\n/);
            db = rows.slice(1).filter(r => r.trim()).map(r => {
                const c = r.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                return {
                    mfr: (c[0] || "").trim(),
                    model: (c[1] || "").trim(),
                    notes: (c[3] || "").replace(/"/g, "").trim(),
                    cat: (c[4] || "airliner").trim(),
                    points: (c[5] || "").replace(/"/g, "").trim()
                };
            });
            refreshMfrDropdown();
        });

    function refreshMfrDropdown() {
        const select = document.getElementById('mfrSelect');
        select.innerHTML = '<option value="">-- Select Manufacturer --</option>';
        const mfrs = [...new Set(db.map(i => i.mfr))].sort();
        mfrs.forEach(m => {
            const opt = document.createElement('option');
            opt.value = opt.innerText = m;
            select.appendChild(opt);
        });
    }

    function updateModelList() {
        const mfr = document.getElementById('mfrSelect').value;
        const select = document.getElementById('modelSelect');
        select.innerHTML = '<option value="">-- Select Model --</option>';
        select.disabled = !mfr;
        if (mfr) {
            db.filter(i => i.mfr === mfr).forEach(item => {
                const opt = document.createElement('option');
                opt.value = item.model; opt.innerText = item.model;
                select.appendChild(opt);
            });
        }
    }

    function loadAircraft() {
        const mfr = document.getElementById('mfrSelect').value;
        const model = document.getElementById('modelSelect').value;
        selected = db.find(i => i.mfr === mfr && i.model === model);
        if(!selected) return;

        const img = document.getElementById('aircraft-img');
        img.src = 'silhouettes/' + selected.cat + '.png';
        img.style.display = 'block';

        const nBox = document.getElementById('notesBox');
        if(selected.notes) {
            nBox.style.display = 'block';
            nBox.innerHTML = "<strong>Notes:</strong> " + selected.notes;
        } else { nBox.style.display = 'none'; }

        drawMarkers();
    }

    function drawMarkers() {
        const container = document.getElementById('markerContainer');
        container.innerHTML = '';
        if(!selected || !selected.points) return;
        selected.points.split(';').forEach(p => {
            if(!p || !p.includes('|')) return;
            const pts = p.split('|');
            const dot = document.createElement('div');
            dot.className = 'marker-dot';
            dot.style.left = pts[0] + '%'; 
            dot.style.top = pts[1] + '%';
            dot.setAttribute('data-label', pts[2] || 'Plate');
            container.appendChild(dot);
        });
    }
</script>
</body>
</html>
