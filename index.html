<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aircraft Plates Database</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; padding: 20px; background: #f0f2f5; color: #333; margin: 0; }
        .container { max-width: 800px; margin: 20px auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #1a73e8; margin-top: 0; }
        label { font-weight: bold; display: block; margin-top: 15px; }
        select, input, button { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        
        .image-container { position: relative; width: 100%; margin-top: 20px; display: none; line-height: 0; border-radius: 8px; background: #eee; border: 1px solid #ddd; }
        #vliegtuig-beeld { width: 100%; height: auto; display: block; cursor: crosshair; }

        .dot {
            position: absolute;
            width: 18px; height: 18px;
            background: #ff0000;
            border: 2px solid #fff;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            cursor: pointer;
            box-shadow: 0 0 8px rgba(0,0,0,0.5);
            z-index: 10;
        }

        /* Nieuwe Tooltip Stijl */
        .dot .tooltip-text {
            visibility: hidden;
            width: 160px;
            background-color: #222;
            color: #fff;
            text-align: center;
            border-radius: 6px;
            padding: 8px;
            position: absolute;
            z-index: 100;
            bottom: 125%; /* Boven de stip */
            left: 50%;
            transform: translateX(-50%);
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            font-size: 13px;
            line-height: 1.4;
            white-space: normal; /* Belangrijk voor meerdere regels! */
            word-wrap: break-word;
            border: 1px solid #444;
        }

        /* Tooltip pijltje */
        .dot .tooltip-text::after {
            content: "";
            position: absolute;
            top: 100%;
            left: 50%;
            margin-left: -5px;
            border-width: 5px;
            border-style: solid;
            border-color: #222 transparent transparent transparent;
        }

        /* Toon tooltip bij hover */
        .dot:hover { z-index: 1000; }
        .dot:hover .tooltip-text { visibility: visible; }

        #detail-view { display: none; margin-top: 20px; padding: 20px; border: 2px solid #1a73e8; border-radius: 8px; background: #fff; text-align: center; }
        #detail-img { width: 100%; border-radius: 6px; margin-top: 15px; border: 1px solid #ddd; display: none; }
        .action-btn { background: #1a73e8; color: white; border: none; padding: 10px; cursor: pointer; border-radius: 4px; font-weight: bold; }
        .close-btn { background: #6c757d; color: white; border: none; padding: 10px; margin-top: 10px; cursor: pointer; border-radius: 4px; }

        .admin-panel { margin-top: 40px; padding-top: 20px; border-top: 2px dashed #ccc; }
        .admin-box { background: #f8f9fa; padding: 15px; border-radius: 8px; border: 1px solid #e9ecef; margin-top: 10px; }
        .hidden { display: none; }
        .dot-item { background: white; margin-bottom: 5px; padding: 8px; border: 1px solid #ddd; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>

<div class="container">
    <h1>Aircraft Plates</h1>
    
    <label>1. Manufacturer:</label>
    <select id="select-fabrikant" onchange="updateTypes()">
        <option value="">-- Select Manufacturer --</option>
    </select>

    <label>2. Aircraft Type:</label>
    <select id="select-type" onchange="showImage()">
        <option value="">-- Select Type --</option>
    </select>

    <div class="image-container" id="wrapper">
        <img id="vliegtuig-beeld" src="" alt="Aircraft Plate" onclick="handleImageClick(event)">
        <div id="dots-layer"></div>
    </div>

    <div id="detail-view">
        <h3 id="detail-title">Plate Location Details</h3>
        <p id="detail-text" style="font-size: 1.1em; margin-bottom: 15px;"></p>
        <button id="load-photo-btn" class="action-btn" onclick="loadPlatePhoto()">Show me how this location looks like</button>
        <img id="detail-img" src="" alt="Detail View">
        <br>
        <button class="close-btn" onclick="closeDetail()">Close Detail View</button>
    </div>

    <div class="admin-panel">
        <button id="auth-btn" onclick="authenticateEditor()" style="background:#6c757d; color:white; border:none; cursor:pointer;">Editor Login</button>
        <div id="admin-controls" class="hidden">
            <div class="admin-box">
                <h3>Editor Menu</h3>
                <input type="text" id="new-fabrikant" placeholder="Manufacturer">
                <input type="text" id="new-type" placeholder="Type">
                <input type="text" id="new-image" placeholder="Silhouette Filename">
                <button onclick="addEntry()" style="background: #28a745; color: white; border: none; font-weight: bold; cursor: pointer;">Save Aircraft</button>
                <div id="dot-editor" class="hidden">
                    <hr>
                    <h4>Manage Dots</h4>
                    <ul id="current-dots" style="list-style:none; padding:0;"></ul>
                </div>
                <hr>
                <button onclick="exportData()" style="background: #17a2b8; color: white; border: none; cursor: pointer;">Generate Backup Code</button>
                <textarea id="export-area" style="width:100%; height:80px; margin-top:10px; font-size:10px; font-family:monospace;" readonly></textarea>
            </div>
        </div>
    </div>
</div>

<script src="data.js"></script>
<script>
    let githubData = (typeof permanentData !== 'undefined') ? permanentData : {};
    let localData = JSON.parse(localStorage.getItem('aircraftDB')) || {};
    let aircraftData = JSON.parse(JSON.stringify(githubData));
    for (let f in localData) {
        if (!aircraftData[f]) aircraftData[f] = {};
        for (let t in localData[f]) { aircraftData[f][t] = localData[f][t]; }
    }

    let isEditor = false;
    let currentActiveDot = null;
    const naturalSort = (a, b) => a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' });

    function authenticateEditor() {
        if(prompt("Enter Access Key:") === "Scr@mble-Pl@tes") { 
            isEditor = true;
            document.getElementById('admin-controls').classList.remove('hidden');
            document.getElementById('auth-btn').innerText = "Editor Mode: ACTIVE";
            checkDotEditorVisibility();
        }
    }

    function addEntry() {
        const fab = document.getElementById('new-fabrikant').value.trim();
        const type = document.getElementById('new-type').value.trim();
        const img = document.getElementById('new-image').value.trim();
        if(!fab || !type || !img) return alert('Fill all fields');
        if(!aircraftData[fab]) aircraftData[fab] = {};
        const dots = aircraftData[fab][type] ? aircraftData[fab][type].dots : [];
        aircraftData[fab][type] = { img: img, dots: dots };
        localStorage.setItem('aircraftDB', JSON.stringify(aircraftData));
        location.reload();
    }

    function handleImageClick(event) {
        if(!isEditor) return;
        const f = document.getElementById('select-fabrikant').value;
        const t = document.getElementById('select-type').value;
        const rect = event.target.getBoundingClientRect();
        const x = ((event.clientX - rect.left) / rect.width) * 100;
        const y = ((event.clientY - rect.top) / rect.height) * 100;
        const info = prompt("Description:");
        const cnImg = prompt("Detail photo filename (optional):");
        if(info) {
            aircraftData[f][t].dots.push({ x, y, info, cnImg });
            localStorage.setItem('aircraftDB', JSON.stringify(aircraftData));
            renderDots(); renderDotList();
        }
    }

    function openDetailFrame(dot) {
        currentActiveDot = dot;
        document.getElementById('detail-text').innerText = dot.info;
        document.getElementById('detail-img').style.display = "none";
        document.getElementById('load-photo-btn').style.display = dot.cnImg ? "inline-block" : "none";
        document.getElementById('detail-view').style.display = "block";
        document.getElementById('detail-view').scrollIntoView({ behavior: 'smooth' });
    }

    function loadPlatePhoto() {
        if(currentActiveDot && currentActiveDot.cnImg) {
            const img = document.getElementById('detail-img');
            img.src = "cnlocimages/" + currentActiveDot.cnImg;
            img.style.display = "block";
            document.getElementById('load-photo-btn').style.display = "none";
        }
    }

    function closeDetail() { document.getElementById('detail-view').style.display = "none"; }

    function renderDots() {
        const f = document.getElementById('select-fabrikant').value;
        const t = document.getElementById('select-type').value;
        const layer = document.getElementById('dots-layer');
        layer.innerHTML = "";
        if(aircraftData[f] && aircraftData[f][t]) {
            aircraftData[f][t].dots.forEach(dot => {
                const d = document.createElement('div');
                d.className = 'dot'; d.style.left = dot.x + "%"; d.style.top = dot.y + "%";
                
                // NIEUW: Echte Tooltip HTML
                const tooltip = document.createElement('span');
                tooltip.className = 'tooltip-text';
                tooltip.innerText = dot.info;
                d.appendChild(tooltip);

                d.onclick = (e) => { e.stopPropagation(); openDetailFrame(dot); };
                layer.appendChild(d);
            });
        }
    }

    function showImage() {
        const f = document.getElementById('select-fabrikant').value;
        const t = document.getElementById('select-type').value;
        const wrap = document.getElementById('wrapper');
        const img = document.getElementById('vliegtuig-beeld');
        if(f && t && aircraftData[f][t]) {
            img.src = "Images/" + aircraftData[f][t].img;
            img.onload = () => { wrap.style.display = "block"; renderDots(); };
        } else { wrap.style.display = "none"; }
        closeDetail();
        if(isEditor) checkDotEditorVisibility();
    }

    function renderDotList() {
        const f = document.getElementById('select-fabrikant').value;
        const t = document.getElementById('select-type').value;
        const list = document.getElementById('current-dots');
        list.innerHTML = "";
        if(aircraftData[f] && aircraftData[f][t]) {
            aircraftData[f][t].dots.forEach((dot, i) => {
                const li = document.createElement('li');
                li.className = 'dot-item';
                li.innerHTML = `<span>${dot.info}</span> 
                <div>
                    <button onclick="editDot(${i})" style="width:auto; background:orange; color:white; border:none; padding:4px 8px; margin-right:4px;">Edit</button>
                    <button onclick="deleteDot(${i})" style="width:auto; background:red; color:white; border:none; padding:4px 8px;">Del</button>
                </div>`;
                list.appendChild(li);
            });
        }
    }

    function editDot(i) {
        const f = document.getElementById('select-fabrikant').value;
        const t = document.getElementById('select-type').value;
        const dot = aircraftData[f][t].dots[i];
        const newInfo = prompt("Update description:", dot.info);
        const newImg = prompt("Update photo filename:", dot.cnImg || "");
        if(newInfo !== null) {
            dot.info = newInfo; dot.cnImg = newImg;
            localStorage.setItem('aircraftDB', JSON.stringify(aircraftData));
            renderDots(); renderDotList();
        }
    }

    function deleteDot(i) {
        const f = document.getElementById('select-fabrikant').value;
        const t = document.getElementById('select-type').value;
        aircraftData[f][t].dots.splice(i, 1);
        localStorage.setItem('aircraftDB', JSON.stringify(aircraftData));
        renderDots(); renderDotList();
    }

    function checkDotEditorVisibility() {
        const type = document.getElementById('select-type').value;
        document.getElementById('dot-editor').classList.toggle('hidden', !type);
        if(type) renderDotList();
    }

    function exportData() {
        const dataStr = "const permanentData = " + JSON.stringify(aircraftData, null, 2) + ";";
        document.getElementById('export-area').value = dataStr;
        document.getElementById('export-area').select();
        alert("Backup code generated!");
    }

    function updateTypes() {
        const f = document.getElementById('select-fabrikant').value;
        const sel = document.getElementById('select-type');
        sel.innerHTML = '<option value="">-- Select Type --</option>';
        if(aircraftData[f]) {
            Object.keys(aircraftData[f]).sort(naturalSort).forEach(type => {
                let opt = document.createElement('option');
                opt.value = type; opt.innerHTML = type; sel.appendChild(opt);
            });
        }
        showImage();
    }

    function loadManufacturers() {
        const sel = document.getElementById('select-fabrikant');
        Object.keys(aircraftData).sort().forEach(fab => {
            let opt = document.createElement('option');
            opt.value = fab; opt.innerHTML = fab; sel.appendChild(opt);
        });
    }

    loadManufacturers();
</script>
</body>
</html>
