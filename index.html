<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aircraft MSN Locator</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root { --blue: #2563eb; --dark: #0f172a; --gray: #f1f5f9; --green: #10b981; }
        body { font-family: 'Inter', sans-serif; background: var(--gray); margin: 0; padding: 20px; color: var(--dark); }
        .container { max-width: 1000px; margin: 0 auto; text-align: center; }
        
        /* Selectie Sectie */
        .selection-box { background: white; padding: 20px; border-radius: 15px; display: flex; gap: 15px; justify-content: center; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        select { padding: 12px; border-radius: 8px; border: 1px solid #cbd5e0; font-size: 15px; min-width: 200px; outline: none; }

        /* Display Area */
        .display-box { 
            background: white; border-radius: 24px; padding: 40px; margin: 20px auto;
            height: 450px; box-shadow: 0 15px 40px rgba(0,0,0,0.05); position: relative; border: 1px solid #e2e8f0;
            display: flex; align-items: center; justify-content: center; overflow: hidden;
        }
        #aircraft-img { max-width: 100%; max-height: 100%; object-fit: contain; pointer-events: none; }
        
        /* Markers */
        .marker { position: absolute; width: 26px; height: 26px; border-radius: 50%; border: 3px solid white; transform: translate(-50%, -50%); cursor: pointer; z-index: 100; display: none; }
        #marker1 { background: #ef4444; }
        #marker2 { background: #3b82f6; }

        /* Editor UI */
        .editor-ui { background: var(--dark); color: white; padding: 25px; border-radius: 20px; margin-bottom: 20px; display: none; text-align: left; }
        .editor-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        label { display: block; font-size: 10px; font-weight: bold; color: #94a3b8; margin-bottom: 5px; text-transform: uppercase; }
        .editor-ui input, .editor-ui select { width: 100%; background: #1e293b; border: 1px solid #334155; color: white; margin-bottom: 10px; padding: 8px; }
        
        .btn { padding: 10px 20px; border-radius: 10px; border: none; cursor: pointer; font-weight: bold; }
        .btn-toggle { background: white; border: 1px solid #ccc; margin-bottom: 20px; }
        .btn-save { background: var(--green); color: white; width: 100%; margin-top: 10px; }

        .info-text { margin-top: 15px; padding: 15px; background: var(--dark); color: white; border-radius: 10px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>✈️ Aircraft MSN Locator</h1>

    <!-- GEBRUIKER SELECTIE -->
    <div class="selection-box">
        <select id="userMfr" onchange="updateModelDropdown()">
            <option value="">-- Kies Fabriek --</option>
        </select>
        <select id="userModel" onchange="loadAircraft()">
            <option value="">-- Kies Vliegtuigtype --</option>
        </select>
    </div>

    <!-- EDITOR PANEL -->
    <div id="editorPanel" class="editor-ui">
        <div class="editor-grid">
            <div>
                <label>Primary Location Text</label>
                <input type="text" id="editLoc" oninput="syncData()">
                <label>Silhouette (Bestandsnaam)</label>
                <input type="text" id="editCat" oninput="syncData()">
            </div>
            <div>
                <label>Secondary Location Text</label>
                <input type="text" id="editLoc2" oninput="syncData()">
                <label>Marker om te verplaatsen</label>
                <select id="targetMarker"><option value="1">Rood</option><option value="2">Blauw</option></select>
            </div>
            <div>
                <label>Notes</label>
                <input type="text" id="editNotes" oninput="syncData()">
                <button class="btn btn-save" onclick="downloadCSV()">💾 Update & Download CSV</button>
            </div>
        </div>
    </div>

    <button onclick="toggleEditor()" class="btn btn-toggle">⚙️ Toggle Editor Mode</button>

    <!-- HET BEELD -->
    <div class="display-box" id="map" onclick="editorClick(event)">
        <img id="aircraft-img" src="" alt="">
        <div id="marker1" class="marker" onclick="showText(1)"></div>
        <div id="marker2" class="marker" onclick="showText(2)"></div>
    </div>

    <div id="infoBox" class="info-text"></div>
</div>

<script>
    let db = []; let selected = null; let isEdit = false;

    // 1. Data laden
    fetch('aircraft_plates_db.csv').then(r => r.text()).then(t => {
        const rows = t.split(/\r?\n/).slice(1);
        db = rows.filter(r => r.trim()).map(r => {
            const c = r.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
            return { 
                mfr: c[0].replace(/"/g,""), model: c[1].replace(/"/g,""), 
                loc: c[2].replace(/"/g,""), loc2: (c[3]||"").replace(/"/g,""),
                note: (c[4]||"").replace(/"/g,""), cat: (c[5]||"Airliner").trim(),
                x: parseInt(c[6])||0, y: parseInt(c[7])||0, x2: parseInt(c[8])||0, y2: parseInt(c[9])||0 
            };
        });
        fillMfrDropdown();
    });

    function fillMfrDropdown() {
        const mfrs = [...new Set(db.map(i => i.mfr))].sort();
        const sel = document.getElementById('userMfr');
        mfrs.forEach(m => sel.add(new Option(m, m)));
    }

    function updateModelDropdown() {
        const mfr = document.getElementById('userMfr').value;
        const sel = document.getElementById('userModel');
        sel.innerHTML = '<option value="">-- Kies Vliegtuigtype --</option>';
        db.filter(i => i.mfr === mfr).forEach(i => sel.add(new Option(i.model, i.model)));
    }

    function loadAircraft() {
        const mfr = document.getElementById('userMfr').value;
        const model = document.getElementById('userModel').value;
        selected = db.find(i => i.mfr === mfr && i.model === model);
        if(!selected) return;

        document.getElementById('aircraft-img').src = `silhouettes/${selected.cat}.png`;
        document.getElementById('aircraft-img').style.display = 'block';
        
        if(isEdit) {
            document.getElementById('editLoc').value = selected.loc;
            document.getElementById('editLoc2').value = selected.loc2;
            document.getElementById('editCat').value = selected.cat;
            document.getElementById('editNotes').value = selected.note;
        }
        updateMarkers();
    }

    function updateMarkers() {
        const m1 = document.getElementById('marker1'), m2 = document.getElementById('marker2');
        m1.style.display = selected.x > 0 ? 'block' : 'none';
        m1.style.left = selected.x + '%'; m1.style.top = selected.y + '%';
        m2.style.display = selected.x2 > 0 ? 'block' : 'none';
        m2.style.left = selected.x2 + '%'; m2.style.top = selected.y2 + '%';
        document.getElementById('infoBox').style.display = 'none';
    }

    function showText(num) {
        if(isEdit) return;
        const box = document.getElementById('infoBox');
        box.style.display = 'block';
        box.innerText = num === 1 ? selected.loc : selected.loc2;
    }

    function editorClick(e) {
        if(!isEdit || !selected) return;
        const rect = document.getElementById('map').getBoundingClientRect();
        const x = Math.round(((e.clientX - rect.left) / rect.width) * 100);
        const y = Math.round(((e.clientY - rect.top) / rect.height) * 100);
        
        if(document.getElementById('targetMarker').value === "1") { selected.x = x; selected.y = y; }
        else { selected.x2 = x; selected.y2 = y; }
        updateMarkers();
    }

    function syncData() {
        selected.loc = document.getElementById('editLoc').value;
        selected.loc2 = document.getElementById('editLoc2').value;
        selected.cat = document.getElementById('editCat').value;
        selected.note = document.getElementById('editNotes').value;
    }

    function toggleEditor() {
        isEdit = !isEdit;
        document.getElementById('editorPanel').style.display = isEdit ? 'block' : 'none';
    }

    function downloadCSV() {
        let csv = "Manufacturer,Model,Plate_Location,Secondary_Location,Notes,Category,X,Y,X2,Y2\n";
        db.forEach(i => {
            csv += `"${i.mfr}","${i.model}","${i.loc}","${i.loc2}","${i.note}",${i.cat},${i.x},${i.y},${i.x2},${i.y2}\n`;
        });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
        link.download = "aircraft_plates_db.csv"; link.click();
    }
</script>
</body>
</html>
