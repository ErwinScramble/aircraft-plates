<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aircraft MSN Locator - Editor v2</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root { --blue: #2563eb; --dark: #0f172a; --gray: #f1f5f9; }
        body { font-family: 'Inter', sans-serif; background: var(--gray); margin: 0; padding: 20px; color: var(--dark); }
        .container { max-width: 1200px; margin: 0 auto; text-align: center; }
        .display-box { 
            background: white; border-radius: 24px; padding: 40px; margin: 20px auto;
            max-width: 900px; height: 450px; box-shadow: 0 15px 40px rgba(0,0,0,0.05);
            position: relative; border: 1px solid #e2e8f0;
            display: flex; align-items: center; justify-content: center; overflow: hidden;
        }
        #aircraft-img { max-width: 100%; max-height: 100%; object-fit: contain; pointer-events: none; }
        .marker-dot { 
            position: absolute; width: 24px; height: 24px; background: #ef4444; 
            border-radius: 50%; border: 3px solid white; display: none;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.6); z-index: 100;
            transform: translate(-50%, -50%); cursor: move;
        }
        .marker-dot.active { display: block; }
        .editor-ui { background: var(--dark); color: white; padding: 20px; border-radius: 15px; margin-bottom: 20px; text-align: left; display: none; }
        .editor-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 10px; }
        input.edit-input { width: 100%; padding: 8px; border-radius: 5px; border: none; font-size: 14px; }
        .btn { padding: 10px 20px; border-radius: 10px; border: none; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-save { background: #10b981; color: white; margin-top: 10px; width: 100%; }
        .card { background: white; padding: 15px; border-radius: 15px; border: 1px solid #e2e8f0; cursor: pointer; text-align: left; }
        .card.selected { border: 2px solid var(--blue); background: #eff6ff; }
        .search-box { width: 100%; max-width: 600px; padding: 15px; border-radius: 50px; border: 2px solid #e2e8f0; margin-bottom: 20px; outline: none; }
        .bubble { background: var(--dark); color: white; padding: 12px 25px; border-radius: 50px; font-size: 14px; margin-top: 15px; display: none; font-weight: 600; }
    </style>
</head>
<body>

<div class="container">
    <h1>✈️ Aircraft MSN Locator Editor</h1>

    <div id="editorPanel" class="editor-ui">
        <strong>🛠 Editor: Drag the red dot & edit text</strong>
        <div class="editor-controls">
            <div>
                <label>Plate Location Description:</label>
                <input type="text" id="editLoc" class="edit-input" oninput="updateData()">
            </div>
            <div>
                <label>Notes:</label>
                <input type="text" id="editNotes" class="edit-input" oninput="updateData()">
            </div>
        </div>
        <button class="btn btn-save" onclick="downloadCSV()">⬇️ Download Updated aircraft_plates_db.csv</button>
    </div>

    <button onclick="toggleEditor()" id="editBtn" class="btn" style="background: white; border: 1px solid #ccc; margin-bottom: 20px;">Toggle Editor Mode</button>

    <div class="display-box" id="map" onmousedown="startDrag(event)" onmousemove="drag(event)" onmouseup="stopDrag()">
        <img id="aircraft-img" src="" alt="Silhouette">
        <div id="marker" class="marker-dot"></div>
    </div>

    <div id="infoBubble" class="bubble"></div>
    <input type="text" id="search" class="search-box" placeholder="Search aircraft...">
    <div id="results" style="display:grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap:15px; text-align:left;"></div>
</div>

<script>
    let db = []; let selected = null; let isEdit = false; let dragging = false;

    fetch('aircraft_plates_db.csv').then(r => r.text()).then(t => {
        const rows = t.split(/\r?\n/).slice(1);
        db = rows.filter(r => r.trim()).map(r => {
            const c = r.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
            return { mfr: c[0], model: c[1], loc: (c[2]||"").replace(/"/g,""), note: (c[3]||"").replace(/"/g,""), cat: (c[4]||"").trim(), x: c[5] || 50, y: c[6] || 50 };
        });
        render();
    });

    function render(f = '') {
        const g = document.getElementById('results'); g.innerHTML = '';
        db.filter(i => (i.mfr+i.model).toLowerCase().includes(f.toLowerCase())).forEach((item, idx) => {
            const d = document.createElement('div'); d.className = `card ${selected === item ? 'selected' : ''}`;
            d.innerHTML = `<strong>${item.mfr}</strong><br>${item.model}`;
            d.onclick = () => selectAircraft(item); g.appendChild(d);
        });
    }

    function selectAircraft(item) {
        selected = item; render(document.getElementById('search').value);
        document.getElementById('aircraft-img').src = `silhouettes/${item.cat}.png`;
        document.getElementById('aircraft-img').style.display = 'block';
        
        if(isEdit) {
            document.getElementById('editLoc').value = item.loc;
            document.getElementById('editNotes').value = item.note;
        }

        const dot = document.getElementById('marker');
        dot.style.left = item.x + '%'; dot.style.top = item.y + '%';
        dot.classList.add('active');
        const b = document.getElementById('infoBubble');
        b.style.display = 'inline-block'; b.innerText = "📍 " + item.loc;
    }

    // --- DRAG LOGICA ---
    function startDrag(e) { if(!isEdit || !selected) return; dragging = true; moveMarker(e); }
    function stopDrag() { dragging = false; }
    function drag(e) { if(dragging) moveMarker(e); }

    function moveMarker(e) {
        const rect = document.getElementById('map').getBoundingClientRect();
        let x = ((e.clientX - rect.left) / rect.width) * 100;
        let y = ((e.clientY - rect.top) / rect.height) * 100;
        selected.x = Math.round(x); selected.y = Math.round(y);
        document.getElementById('marker').style.left = selected.x + '%';
        document.getElementById('marker').style.top = selected.y + '%';
    }

    function updateData() {
        if(!selected) return;
        selected.loc = document.getElementById('editLoc').value;
        selected.note = document.getElementById('editNotes').value;
        document.getElementById('infoBubble').innerText = "📍 " + selected.loc;
    }

    function toggleEditor() {
        isEdit = !isEdit;
        document.getElementById('editorPanel').style.display = isEdit ? 'block' : 'none';
        document.getElementById('editBtn').style.background = isEdit ? '#1e293b' : 'white';
        document.getElementById('editBtn').style.color = isEdit ? 'white' : 'black';
    }

    function downloadCSV() {
        let csvContent = "Manufacturer,Model,Plate_Location,Notes,Category,X,Y\n";
        db.forEach(i => {
            csvContent += `${i.mfr},${i.model},"${i.loc}","${i.note}",${i.cat},${i.x},${i.y}\n`;
        });
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.setAttribute("download", "aircraft_plates_db.csv");
        link.click();
    }

    document.getElementById('search').oninput = (e) => render(e.target.value);
</script>
</body>
</html>
