<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aircraft MSN Locator - Professional Edition</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f0f4f8; margin: 0; padding: 20px; color: #1a202c; }
        .container { max-width: 1200px; margin: 0 auto; text-align: center; }
        
        .visual-guide { 
            background: white; border-radius: 24px; padding: 30px; margin: 20px auto;
            max-width: 900px; height: 350px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); position: relative;
            border: 1px solid #e2e8f0; display: flex; align-items: center; justify-content: center;
        }
        
        /* Silhouette Styling */
        svg.stencil { width: 80%; height: 80%; fill: #cbd5e0; position: absolute; transition: opacity 0.3s; display: none; pointer-events: none; }
        svg.active { display: block; filter: drop-shadow(0 5px 15px rgba(0,0,0,0.1)); }
        
        .marker-point { fill: #e53e3e; stroke: white; stroke-width: 4; display: none; }
        .marker-point.visible { display: block; animation: pulse 1.5s infinite; }
        
        @keyframes pulse { 0% { r: 8; } 50% { r: 13; } 100% { r: 8; } }

        /* Interface & Editor */
        .editor-panel { background: #2d3748; color: white; padding: 20px; border-radius: 12px; margin-bottom: 20px; text-align: left; display: none; }
        .log-area { width: 100%; height: 80px; background: #1a202c; color: #48bb78; font-family: monospace; font-size: 11px; padding: 10px; margin-top: 10px; border-radius: 5px; overflow-y: auto; white-space: pre; }
        .btn { padding: 10px 20px; border-radius: 8px; cursor: pointer; border: none; font-weight: bold; margin: 5px; }
        .btn-blue { background: #3182ce; color: white; }
        .btn-green { background: #48bb78; color: white; }

        .search-box { width: 100%; max-width: 600px; padding: 15px 25px; border-radius: 50px; border: 2px solid #3182ce; font-size: 16px; margin-bottom: 20px; outline: none; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; text-align: left; }
        .card { background: white; padding: 20px; border-radius: 15px; border: 1px solid #e2e8f0; cursor: pointer; transition: 0.3s; }
        .card.active-card { border-color: #3182ce; background: #ebf8ff; }
        .card:hover { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .cat-tag { font-size: 10px; font-weight: 800; text-transform: uppercase; color: #3182ce; margin-bottom: 5px; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>✈️ MSN Locator & Editor</h1>
        
        <div id="editorPanel" class="editor-panel">
            <strong>🛠 Editor Mode:</strong> Select aircraft, then click image to set coordinates.<br>
            Current: <span id="selName" style="color:#63b3ed">None</span> | X: <span id="coordX">0</span> | Y: <span id="coordY">0</span>
            <div id="logOutput" class="log-area">Ready...</div>
            <button class="btn btn-green" onclick="copyLogs()">Copy Updates for CSV</button>
        </div>

        <button class="btn btn-blue" onclick="toggleEditor()">Toggle Editor Mode</button>

        <div class="visual-guide" id="guideArea" onclick="getCoords(event)">
            <!-- 1. Airliner -->
            <svg id="img-airliner" class="stencil active" viewBox="0 0 512 256">
                <path d="M450,110 C480,115 500,125 500,135 L100,135 C60,135 20,125 20,110 C20,95 60,85 100,85 L420,85 L460,30 L485,30 L465,100 Z"/>
                <path d="M180,135 L340,200 L380,200 L260,135 Z" fill="#a0aec0"/>
                <circle class="marker-point" cx="0" cy="0" r="10" />
            </svg>
            <!-- 2. Fighter -->
            <svg id="img-fighter" class="stencil" viewBox="0 0 512 256">
                <path d="M20,130 L150,110 L260,110 L290,40 L360,40 L330,110 L480,110 L512,50 L512,210 L480,150 L512,210 L480,150 L320,150 L350,210 L280,210 L250,150 L150,150 Z"/>
                <circle class="marker-point" cx="0" cy="0" r="10" />
            </svg>
            <!-- 3. Helicopter -->
            <svg id="img-heli" class="stencil" viewBox="0 0 512 256">
                <path d="M60,170 C60,130 110,90 250,90 L480,90 L505,40 L512,40 L500,100 L480,110 L280,110 C280,160 180,190 60,170 Z"/><path d="M100,30 L400,30 L400,35 L100,35 Z" fill="#4a5568"/>
                <circle class="marker-point" cx="0" cy="0" r="10" />
            </svg>
            <!-- 4. Chinook (Transport Heli) -->
            <svg id="img-chinook" class="stencil" viewBox="0 0 512 256">
                <path d="M50,140 L450,140 L450,90 L400,70 L100,70 L50,90 Z M80,70 L90,30 L130,30 L120,70 Z M380,70 L390,30 L430,30 L420,70 Z"/>
                <circle class="marker-point" cx="0" cy="0" r="10" />
            </svg>
            <!-- 5. Biplane -->
            <svg id="img-biplane" class="stencil" viewBox="0 0 512 256">
                <path d="M40,160 L400,140 L450,60 L480,60 L460,145 L100,170 Z M120,110 L350,110 M120,180 L350,180" stroke="#a0aec0" stroke-width="8"/>
                <circle class="marker-point" cx="0" cy="0" r="10" />
            </svg>
            <!-- 6. Stealth -->
            <svg id="img-stealth" class="stencil" viewBox="0 0 512 256">
                <path d="M256,20 L480,220 L350,220 L256,150 L160,220 L30,220 Z"/>
                <circle class="marker-point" cx="0" cy="0" r="10" />
            </svg>

            <div id="marker" class="marker"></div>
        </div>

        <input type="text" id="searchInput" class="search-box" placeholder="Search aircraft (e.g. F-16, Chinook, An-2)...">
    </header>

    <div id="resultsGrid" class="grid"></div>
</div>

<script>
    let aircraftData = [];
    const csvUrl = 'aircraft_plates_db.csv';
    let editMode = false;
    let activeItem = null;
    let updateLogs = [];

    const catMapping = {
        'fighter': 'fighter', 'gevechtsvliegtuig': 'fighter', 'stealth': 'stealth',
        'helicopter': 'heli', 'chinook': 'chinook', 'transporthelikopter': 'chinook',
        'biplane': 'biplane', 'dubbeldekker': 'biplane', 'airliner': 'airliner'
    };

    function toggleEditor() {
        editMode = !editMode;
        document.getElementById('editorPanel').style.display = editMode ? 'block' : 'none';
    }

    function getCoords(event) {
        if (!editMode || !activeItem) return;
        const rect = document.getElementById('guideArea').getBoundingClientRect();
        const x = Math.round(((event.clientX - rect.left) / rect.width) * 512);
        const y = Math.round(((event.clientY - rect.top) / rect.height) * 256);
        
        document.getElementById('coordX').innerText = x;
        document.getElementById('coordY').innerText = y;

        const logLine = `${activeItem.Manufacturer},${activeItem.Model},"${activeItem.Plate_Location}","${activeItem.Notes}",${activeItem.Category},${x},${y}`;
        updateLogs.push(logLine);
        document.getElementById('logOutput').innerText = updateLogs.join('\n');

        const marker = document.querySelector('svg.active .marker-point');
        marker.setAttribute('cx', x); marker.setAttribute('cy', y);
        marker.classList.add('visible');
    }

    function copyLogs() {
        navigator.clipboard.writeText(document.getElementById('logOutput').innerText);
        alert("Copied! Paste into your CSV.");
    }

    fetch(csvUrl).then(res => res.text()).then(text => {
        const lines = text.split(/\r?\n/);
        const headers = lines[0].split(',');
        aircraftData = lines.slice(1).filter(l => l.trim() !== "").map(line => {
            const values = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
            let obj = {};
            headers.forEach((h, i) => obj[h.trim()] = values[i]?.replace(/^"|"$/g, "").trim());
            return obj;
        });
        displayResults(aircraftData);
    });

    function displayResults(data) {
        const grid = document.getElementById('resultsGrid');
        grid.innerHTML = '';
        data.forEach(item => {
            const card = document.createElement('div');
            card.className = 'card';
            card.onclick = () => {
                activeItem = item;
                document.querySelectorAll('.card').forEach(c => c.classList.remove('active-card'));
                card.classList.add('active-card');
                document.getElementById('selName').innerText = item.Model;
                
                // Switch Silhouette
                const cat = (item.Category || 'airliner').toLowerCase();
                const svgId = 'img-' + (catMapping[cat] || 'airliner');
                document.querySelectorAll('.stencil').forEach(s => s.classList.remove('active'));
                const activeSvg = document.getElementById(svgId) || document.getElementById('img-airliner');
                activeSvg.classList.add('active');
                
                const m = activeSvg.querySelector('.marker-point');
                if (item.X && item.Y) {
                    m.setAttribute('cx', item.X); m.setAttribute('cy', item.Y);
                    m.classList.add('visible');
                } else { m.classList.remove('visible'); }
                window.scrollTo({top: 0, behavior: 'smooth'});
            };
            card.innerHTML = `<div class="cat-tag">${item.Category}</div><strong>${item.Manufacturer}</strong> ${item.Model}<br><small>📍 ${item.Plate_Location}</small>`;
            grid.appendChild(card);
        });
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
        const term = e.target.value.toLowerCase();
        const filtered = aircraftData.filter(item => Object.values(item).join(' ').toLowerCase().includes(term));
        displayResults(filtered);
    });
</script>
</body>
</html>
