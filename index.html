<!-- Voeg dit toe in de <style> sectie -->
<style>
    .log-area { 
        width: 100%; height: 100px; background: #1a202c; color: #48bb78; 
        font-family: monospace; font-size: 11px; padding: 10px; margin-top: 10px;
        border-radius: 5px; border: 1px solid #48bb78; overflow-y: auto;
    }
    .copy-btn { background: #48bb78; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; margin-top: 5px; }
</style>

<!-- Vervang de editor-panel div door deze -->
<div id="editorPanel" class="editor-panel">
    <strong>🛠 Editor Mode:</strong> Select an aircraft below, then click on the image to set coordinates.<br>
    Selected: <span id="selName" style="color:#63b3ed">None</span> | X: <span id="coordX">0</span> | Y: <span id="coordY">0</span>
    <div id="logOutput" class="log-area">Ready to log updates...</div>
    <button class="copy-btn" onclick="copyLogs()">Copy All Updates</button>
</div>

<script>
    let activeItem = null;
    let updateLogs = [];

    // Pas de displayResults functie aan zodat hij het actieve item onthoudt
    function displayResults(data) {
        const grid = document.getElementById('resultsGrid');
        grid.innerHTML = '';
        data.forEach(item => {
            const card = document.createElement('div');
            card.className = 'card';
            card.onclick = () => {
                activeItem = item;
                document.getElementById('selName').innerText = item.Manufacturer + " " + item.Model;
                // ... rest van je bestaande onclick logica ...
            };
            // ... rest van je bestaande card.innerHTML ...
        });
    }

    function getCoords(event) {
        if (!editMode || !activeItem) {
            if(!activeItem) alert("Please select an aircraft from the list first!");
            return;
        }
        const rect = document.getElementById('guideArea').getBoundingClientRect();
        const x = Math.round(((event.clientX - rect.left) / rect.width) * 500);
        const y = Math.round(((event.clientY - rect.top) / rect.height) * 200);
        
        document.getElementById('coordX').innerText = x;
        document.getElementById('coordY').innerText = y;

        // Log de update
        const logLine = `${activeItem.Manufacturer},${activeItem.Model},"${activeItem.Plate_Location}","${activeItem.Notes}",${activeItem.Category},${x},${y}`;
        updateLogs.push(logLine);
        document.getElementById('logOutput').innerText = updateLogs.join('\n');

        // Visualiseer marker
        const activeMarker = document.querySelector('svg.active .marker-point');
        activeMarker.setAttribute('cx', x);
        activeMarker.setAttribute('cy', y);
        activeMarker.classList.add('visible');
    }

    function copyLogs() {
        const text = document.getElementById('logOutput').innerText;
        navigator.clipboard.writeText(text);
        alert("Updates copied to clipboard! You can now paste them into your CSV file.");
    }
</script>
