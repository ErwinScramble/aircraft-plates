<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aircraft MSN Locator - Blueprint Edition</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f0f4f8; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; text-align: center; }
        .visual-guide { 
            background: #ffffff; border-radius: 20px; padding: 30px; margin: 20px auto;
            max-width: 850px; height: 350px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
            position: relative; border: 2px solid #3182ce; display: flex; align-items: center; justify-content: center;
        }
        svg.plane-blueprint { width: 100%; height: 100%; display: none; filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.2)); }
        svg.active { display: block; }
        .marker {
            position: absolute; width: 24px; height: 24px; background: #ff0000;
            border-radius: 50%; border: 3px solid white; display: none;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.8); z-index: 999;
            transform: translate(-50%, -50%); pointer-events: none;
        }
        .marker.active { display: block; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { transform: translate(-50%, -50%) scale(1); } 50% { transform: translate(-50%, -50%) scale(1.3); } 100% { transform: translate(-50%, -50%) scale(1); } }
        .editor-box { background: #2d3748; color: white; padding: 15px; border-radius: 10px; margin-bottom: 20px; text-align: left; display: none; font-size: 13px; }
        .search-box { width: 100%; padding: 15px; border-radius: 30px; border: 2px solid #3182ce; margin-bottom: 20px; font-size: 16px; outline: none; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; text-align: left; }
        .card { background: white; padding: 15px; border-radius: 12px; border: 1px solid #e2e8f0; cursor: pointer; }
        .card.selected { background: #ebf8ff; border-color: #3182ce; }
        .btn { padding: 8px 16px; background: #3182ce; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: 600; }
    </style>
</head>
<body>

<div class="container">
    <h1>✈️ Aircraft MSN Locator</h1>

    <div id="editor" class="editor-box">
        <strong>🛠 Editor Mode Active:</strong> Click on the aircraft to set marker position.<br>
        <code id="output" style="color:#63b3ed">Select an aircraft from the list first...</code>
    </div>

    <button class="btn" onclick="toggleEditor()" style="margin-bottom:15px;">Toggle Editor Mode</button>

    <div class="visual-guide" id="clickArea" onclick="setPoint(event)">
        
        <!-- DETAILED AIRLINER -->
        <svg id="svg-airliner" class="plane-blueprint active" viewBox="0 0 500 200">
            <path d="M50,120 L400,120 C430,120 460,110 470,100 L450,40 L430,40 L445,100 L100,100 C70,100 40,110 40,120 Z" fill="#cbd5e0"/>
            <path d="M120,120 L250,170 L300,170 L200,120 Z" fill="#a0aec0"/> <!-- Wing -->
            <rect x="70" y="105" width="15" height="8" rx="2" fill="#4a5568"/> <!-- Cockpit window -->
        </svg>

        <!-- DETAILED FIGHTER (F-16 Style) -->
        <svg id="svg-fighter" class="plane-blueprint" viewBox="0 0 500 200">
            <path d="M20,110 L120,100 L250,100 L280,40 L340,40 L310,100 L450,100 L470,130 L450,150 L100,150 L20,110 Z" fill="#cbd5e0"/>
            <path d="M100,100 Q150,60 200,100" fill="none" stroke="#4a5568" stroke-width="4"/> <!-- Canopy -->
            <path d="M400,100 L440,30 L470,30 L450,100 Z" fill="#718096"/> <!-- Fin -->
        </svg>

        <!-- DETAILED HELICOPTER -->
        <svg id="svg-heli" class="plane-blueprint" viewBox="0 0 500 200">
            <path d="M60,160 C30,160 30,100 80,80 L250,80 L460,80 L480,40 L495,40 L480,100 L250,100 C250,160 150,180 60,160 Z" fill="#cbd5e0"/>
            <rect x="200" y="20" width="10" height="60" fill="#718096"/> <!-- Rotor mast -->
            <path d="M100,30 L350,30 L350,35 L100,35 Z" fill="#2d3748"/> <!-- Rotors -->
            <rect x="70" y="100" width="30" height="25" rx="5" fill="#ebf8ff" stroke="#4a5568"/> <!-- Window -->
        </svg>

        <!-- DETAILED CESSNA (High Wing) -->
        <svg id="svg-prop" class="plane-blueprint" viewBox="0 0 500 200">
            <path d="M50,130 L100,120 L400,120 L440,50 L470,50 L450,130 L100,150 L50,130 Z" fill="#cbd5e0"/>
            <rect x="120" y="80" width="150" height="10" fill="#a0aec0"/> <!-- High wing -->
            <line x1="45" y1="100" x2="45" y2="160" stroke="#2d3748" stroke-width="3"/> <!-- Propeller -->
            <rect x="80" y="125" width="25" height="15" fill="#4a5568"/> <!-- Window -->
        </svg>

        <div id="marker" class="marker"></div>
    </div>

    <input type="text" id="search" class="search-box" placeholder="Type to search (e.g. F-16, Bell, Boeing)...">
    <div id="results" class="grid"></div>
</div>

<script>
    let aircraftData = [];
    let selectedItem = null;
    let isEdit = false;

    fetch('aircraft_plates_db.csv').then(r => r.text()).then(t => {
        const rows = t.split('\n').slice(1);
        aircraftData = rows.filter(r => r.trim()).map(r => {
            const c = r.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
            return { mfr: c[0], model: c[1], loc: c[2], note: c[3], cat: c[4], x: c[5], y: c[6] };
        });
        render();
    });

    function render(filter = '') {
        const grid = document.getElementById('results');
        grid.innerHTML = '';
        aircraftData.filter(i => (i.mfr+i.model).toLowerCase().includes(filter.toLowerCase())).forEach(item => {
            const div = document.createElement('div');
            div.className = 'card';
            div.innerHTML = `<strong>${item.mfr}</strong><br>${item.model}<br><small>📍 ${item.loc}</small>`;
            div.onclick = () => select(item, div);
            grid.appendChild(div);
        });
    }

    function select(item, el) {
        selectedItem = item;
        document.querySelectorAll('.card').forEach(c => c.classList.remove('selected'));
        el.classList.add('selected');

        // Selecteer juiste silhouet op basis van Category in CSV
        const cat = (item.cat || 'Airliner').toLowerCase();
        document.querySelectorAll('.plane-blueprint').forEach(s => s.classList.remove('active'));
        
        let targetId = 'svg-airliner';
        if(cat.includes('fighter')) targetId = 'svg-fighter';
        if(cat.includes('heli')) targetId = 'svg-heli';
        if(cat.includes('prop') || cat.includes('cessna')) targetId = 'svg-prop';
        
        document.getElementById(targetId).classList.add('active');

        // Toon de stip op de X,Y uit je CSV
        const m = document.getElementById('marker');
        if(item.x && item.y) {
            m.style.left = item.x + '%';
            m.style.top = item.y + '%';
            m.classList.add('active');
        } else {
            m.classList.remove('active');
        }
        window.scrollTo({top: 0, behavior: 'smooth'});
    }

    function setPoint(e) {
        if(!isEdit || !selectedItem) return;
        const rect = document.getElementById('clickArea').getBoundingClientRect();
        const x = Math.round(((e.clientX - rect.left) / rect.width) * 100);
        const y = Math.round(((e.clientY - rect.top) / rect.height) * 100);
        
        document.getElementById('marker').style.left = x + '%';
        document.getElementById('marker').style.top = y + '%';
        document.getElementById('marker').classList.add('active');
        
        const newLine = `${selectedItem.mfr},${selectedItem.model},"${selectedItem.loc}","${selectedItem.note}",${selectedItem.cat},${x},${y}`;
        document.getElementById('output').innerText = "Update your CSV with: " + newLine;
    }

    function toggleEditor() {
        isEdit = !isEdit;
        document.getElementById('editor').style.display = isEdit ? 'block' : 'none';
    }

    document.getElementById('search').oninput = (e) => render(e.target.value);
</script>
</body>
</html>
