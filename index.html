<script>
    // ... (rest van de script sectie tot aan loadAircraft) ...

    function loadAircraft() {
        const mfr = document.getElementById('userMfr').value;
        const model = document.getElementById('userModel').value;
        selected = db.find(i => i.mfr === mfr && i.model === model);
        if(!selected) return;

        const img = document.getElementById('aircraft-img');
        
        // Verberg container even tot de nieuwe afbeelding geladen is
        const container = document.getElementById('markerContainer');
        container.style.opacity = "0";

        img.src = `silhouettes/${selected.cat}.png`;
        img.style.display = 'block';

        if(isEdit) {
            document.getElementById('editCat').value = selected.cat;
            document.getElementById('currentName').innerText = selected.model;
        }

        // CRUCIALE FIX: Wacht tot de afbeelding echt op het scherm staat
        img.onload = () => {
            updateDisplay();
            container.style.opacity = "1";
        };
    }

    function updateDisplay() {
        if(!selected) return;
        const container = document.getElementById('markerContainer');
        const list = document.getElementById('dotList');
        const img = document.getElementById('aircraft-img');

        // Check of de afbeelding breedte heeft (geladen is)
        if (img.clientWidth === 0) return;

        container.innerHTML = ''; 
        list.innerHTML = '';

        selected.dots.forEach((dot, i) => {
            const div = document.createElement('div');
            div.className = 'marker';
            // De stippen worden nu exact op basis van de huidige afbeelding-pixels geplaatst
            div.style.left = dot.x + '%'; 
            div.style.top = dot.y + '%';
            div.style.background = colors[i % colors.length];
            div.innerText = i + 1;
            
            if(isEdit) {
                div.onmousedown = (e) => { e.stopPropagation(); startDrag(e, i); };
            } else {
                div.onclick = (e) => { e.stopPropagation(); showText(i); };
            }
            container.appendChild(div);

            if (isEdit) {
                const item = document.createElement('div');
                item.style.display = 'flex'; item.style.gap = '5px'; item.style.marginBottom = '5px';
                item.innerHTML = `<span style="color:${colors[i%colors.length]}">#${i+1}</span>
                    <input type="text" value="${dot.loc}" oninput="selected.dots[${i}].loc=this.value" style="flex:1">
                    <button onclick="selected.dots.splice(${i},1);updateDisplay()" style="background:#ef4444;color:white;border:none;border-radius:4px;padding:2px 8px;cursor:pointer">✕</button>`;
                list.appendChild(item);
            }
        });
    }

    // Extra check voor als iemand het venster groter/kleiner maakt
    let resizeTimer;
    window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(updateDisplay, 100);
    });
</script>
