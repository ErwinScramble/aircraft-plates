<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aircraft MSN Locator - Master Editor</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root { --blue: #2563eb; --dark: #0f172a; --gray: #f1f5f9; --green: #10b981; }
        body { font-family: 'Inter', sans-serif; background: var(--gray); margin: 0; padding: 20px; color: var(--dark); }
        .container { max-width: 1200px; margin: 0 auto; text-align: center; }
        
        .selection-box { background: white; padding: 20px; border-radius: 15px; display: flex; gap: 15px; justify-content: center; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        select { padding: 12px; border-radius: 8px; border: 1px solid #cbd5e0; font-size: 15px; min-width: 220px; outline: none; background: white; cursor: pointer; }

        .display-box { 
            background: white; border-radius: 24px; padding: 40px; margin: 20px auto;
            height: 480px; box-shadow: 0 15px 40px rgba(0,0,0,0.05); position: relative; border: 1px solid #e2e8f0;
            display: flex; align-items: center; justify-content: center; overflow: hidden;
        }
        #aircraft-img { max-width: 100%; max-height: 100%; object-fit: contain; pointer-events: none; display: none; }
        
        .marker { 
            position: absolute; width: 28px; height: 28px; border-radius: 50%; border: 3px solid white; 
            transform: translate(-50%, -50%); cursor: pointer; z-index: 100; color: white;
            font-size: 12px; font-weight: bold; display: flex; align-items: center; justify-content: center;
        }

        .editor-ui { background: var(--dark); color: white; padding: 25px; border-radius: 20px; margin-bottom: 20px; text-align: left; display: none; }
        .editor-section { border-bottom: 1px solid #334155; padding-bottom: 15px; margin-bottom: 15px; }
        .dot-list { max-height: 150px; overflow-y: auto; margin-top: 10px; }
        .dot-item { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; background: #1e293b; padding: 8px; border-radius: 8px; }
        .dot-item input { flex: 1; background: #0f172a; border: 1px solid #334155; color: white; padding: 5px; border-radius: 4px; }
        
        .new-entry-form { display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 10px; align-items: end; background: #1e293b; padding: 15px; border-radius: 12px; }
        .new-entry-form input { background: #0f172a; border: 1px solid #334155; color: white; padding: 8px; border-radius: 6px; }

        .btn { padding: 10px 20px; border-radius: 10px; border: none; cursor: pointer; font-weight: bold; }
        .btn-toggle { background: white; border: 1px solid #ccc; margin-bottom: 20px; }
        .btn-save { background: var(--green); color: white; width: 100%; }
        .btn-add { background: var(--blue); color: white; }
        .btn-del { background: #ef4444; color: white; padding: 5px 10px; border-radius: 4px; }

        .info-text { margin-top: 15px; padding: 20px; background: var(--dark); color: white; border-radius: 15px; display: none; font-size: 16px; text-align: left; }
    </style>
</head>
<body>

<div class="container">
    <h1>✈️ Aircraft MSN Locator</h1>

    <div class="selection-box">
        <select id="userMfr" onchange="updateModelDropdown()"><option value="">-- 1. Select Manufacturer --</option></select>
        <select id="userModel" onchange="loadAircraft()"><option value="">-- 2. Select Aircraft Model --</option></select>
    </div>

    <div id="editorPanel" class="editor-ui">
        <div class="editor-section">
            <strong>🆕 Add New Aircraft to List</strong>
            <div class="new-entry-form">
                <div><label style="font-size:10px; color:#94a3b8">Manufacturer</label><input type="text" id="newMfr" placeholder="e.g. Boeing"></div>
                <div><label style="font-size:10px; color:#94a3b8">Model</label><input type="text" id="newModel" placeholder="e.g. 737-800"></div>
                <div><label style="font-size:10px; color:#94a3b8">Silhouette PNG</label><input type="text" id="newCat" placeholder="e.g. Airliner"></div>
                <button class="btn btn-add" onclick="addNewAircraft()">Add to List</button>
            </div>
        </div>

        <div class="editor-section" id="editDetails" style="display:none;">
            <strong>🛠 Edit Selected: <span id="currentName" style="color:var(--blue)"></span></strong><br>
            <label>Change Silhouette PNG Name:</label>
            <input type="text" id="editCat" style="width:200px; background:#0f172a; color:white; border:1px solid #334155; padding:5px;" oninput="syncData()">
            
            <div id="dotList" class="dot-list"></div>
            <p style="font-size: 11px; color: #94a3b8; margin-top:10px;">Click on the plane image below to add a new location dot.</p>
        </div>

        <button class="btn btn-save" onclick="downloadCSV()">💾 Save & Download CSV (Final Step)</button>
    </div>

    <button onclick="toggleEditor()" class="btn btn-toggle">⚙️ Toggle Editor Mode</button>

    <div class="display-box" id="map" onclick="handleMapClick(event)">
        <img id="aircraft-img" src="" alt="">
        <div id="markerContainer"></div>
    </div>

    <div id="infoBox" class="info-text"></div>
</div>

<script>
    let db = []; let selected = null; let isEdit = false;
    const colors = ["#ef4444", "#3b82f6", "#10b981", "#f59e0b", "#8b5cf6", "#ec4899"];

    fetch('aircraft_plates_db.csv').then(r => r.text()).then(t => {
        const lines = t.split(/\r?\n/);
        db = lines.slice(1).filter(l => l.trim()).map(line => {
            const p = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(x => x.replace(/"/g, "").trim());
            let dots = [];
            if (p[6]) { 
                const locs = p[2].split('|');
                const xys = p[6].split('|');
                locs.forEach((l, i) => {
                    const coords = (xys[i] || "50,50").split(',');
                    if(l) dots.push({ loc: l, x: coords[0], y: coords[1] });
                });
            }
            return { mfr: p[0], model: p[1], cat: p[5] || "Airliner", note: p[4], dots: dots };
        });
        fillMfrDropdown();
    });

    function fillMfrDropdown() {
        const mfrs = [...new Set(db.map(i => i.mfr))].filter(x => x).sort();
        const sel = document.getElementById('userMfr');
        sel.innerHTML = '<option value="">-- 1. Select Manufacturer --</option>';
        mfrs.forEach(m => sel.add(new Option(m, m)));
    }

    function updateModelDropdown() {
        const mfr = document.getElementById('userMfr').value;
        const sel = document.getElementById('userModel');
        sel.innerHTML = '<option value="">-- 2. Select Aircraft Model --</option>';
        db.filter(i => i.mfr === mfr).forEach(i => sel.add(new Option(i.model, i.model)));
    }

    function addNewAircraft() {
        const mfr = document.getElementById('newMfr').value.trim();
        const model = document.getElementById('newModel').value.trim();
        const cat = document.getElementById('newCat').value.trim() || "Airliner";

        if (!mfr || !model) { alert("Please fill in Manufacturer and Model"); return; }

        const newItem = { mfr: mfr, model: model, cat: cat, note: "", dots: [] };
        db.push(newItem);
        
        fillMfrDropdown();
        document.getElementById('userMfr').value = mfr;
        updateModelDropdown();
        document.getElementById('userModel').value = model;
        loadAircraft();

        document.getElementById('newMfr').value = "";
        document.getElementById('newModel').value = "";
        alert("Added to temporary list. Don't forget to download CSV when done!");
    }

    function loadAircraft() {
        const mfr = document.getElementById('userMfr').value;
        const model = document.getElementById('userModel').value;
        selected = db.find(i => i.mfr === mfr && i.model === model);
        if(!selected) return;

        document.getElementById('aircraft-img').src = `silhouettes/${selected.cat}.png`;
        document.getElementById('aircraft-img').style.display = 'block';
        
        if(isEdit) {
            document.getElementById('editDetails').style.display = 'block';
            document.getElementById('currentName').innerText = `${selected.mfr} ${selected.model}`;
            document.getElementById('editCat').value = selected.cat;
        }
        updateDisplay();
    }

    function updateDisplay() {
        const container = document.getElementById('markerContainer');
        const list = document.getElementById('dotList');
        container.innerHTML = '';
        list.innerHTML = '';

        selected.dots.forEach((dot, i) => {
            const div = document.createElement('div');
            div.className = 'marker';
            div.style.left = dot.x + '%'; div.style.top = dot.y + '%';
            div.style.background = colors[i % colors.length];
            div.innerText = i + 1;
            div.onclick = (e) => { e.stopPropagation(); showText(i); };
            container.appendChild(div);

            if (isEdit) {
                const item = document.createElement('div');
                item.className = 'dot-item';
                item.innerHTML = `
                    <span style="color:${colors[i % colors.length]}">#${i+1}</span>
                    <input type="text" value="${dot.loc}" oninput="updateDotText(${i}, this.value)">
                    <button class="btn-del" onclick="removeDot(${i})">✕</button>
                `;
                list.appendChild(item);
            }
        });
        document.getElementById('infoBox').style.display = 'none';
    }

    function handleMapClick(e) {
        if(!isEdit || !selected) return;
        const rect = document.getElementById('map').getBoundingClientRect();
        const x = Math.round(((e.clientX - rect.left) / rect.width) * 100);
        const y = Math.round(((e.clientY - rect.top) / rect.height) * 100);
        selected.dots.push({ x: x, y: y, loc: "New location description" });
        updateDisplay();
    }

    function showText(i) {
        if(isEdit) return;
        const box = document.getElementById('infoBox');
        box.style.display = 'block';
        box.innerHTML = `<strong>Location #${i+1}:</strong><br>${selected.dots[i].loc}`;
    }

    function updateDotText(i, val) { selected.dots[i].loc = val; }
    function removeDot(i) { selected.dots.splice(i, 1); updateDisplay(); }
    function syncData() { 
        selected.cat = document.getElementById('editCat').value; 
        document.getElementById('aircraft-img').src = `silhouettes/${selected.cat}.png`;
    }
    function toggleEditor() { 
        isEdit = !isEdit; 
        document.getElementById('editorPanel').style.display = isEdit ? 'block' : 'none'; 
        if (selected) loadAircraft();
    }

    function downloadCSV() {
        let csv = "Manufacturer,Model,Plate_Locations,Notes,Internal_Notes,Category,Coordinates\n";
        db.forEach(i => {
            const allLocs = i.dots.map(d => d.loc).join('|');
            const allCoords = i.dots.map(d => `${d.x},${d.y}`).join('|');
            csv += `"${i.mfr}","${i.model}","${allLocs}","","${i.note}","${i.cat}","${allCoords}"\n`;
        });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
        link.download = "aircraft_plates_db.csv"; link.click();
    }
</script>
</body>
</html>
