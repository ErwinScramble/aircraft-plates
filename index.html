<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aircraft Plates Database</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; padding: 20px; background: #f0f2f5; color: #333; margin: 0; }
        .container { max-width: 800px; margin: 20px auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #1a73e8; margin-top: 0; }
        label { font-weight: bold; display: block; margin-top: 15px; }
        select, input, button { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        .image-container { position: relative; width: 100%; margin-top: 20px; display: none; border-radius: 8px; background: #eee; border: 1px solid #ddd; overflow: hidden; }
        #vliegtuig-beeld { width: 100%; height: auto; display: block; cursor: crosshair; }
        .dot { position: absolute; width: 18px; height: 18px; background: red; border: 2px solid white; border-radius: 50%; transform: translate(-50%, -50%); cursor: pointer; z-index: 5; }
        .dot::after { content: attr(data-info); position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.85); color: white; padding: 6px 12px; border-radius: 4px; font-size: 13px; display: none; white-space: nowrap; pointer-events: none; }
        .dot:hover::after { display: block; }
        .admin-panel { margin-top: 40px; padding-top: 20px; border-top: 2px dashed #ccc; }
        .admin-box { background: #f8f9fa; padding: 15px; border-radius: 8px; margin-top: 10px; border: 1px solid #e9ecef; }
        .btn-save { background: #28a745; color: white; border: none; font-weight: bold; cursor: pointer; }
        .btn-export { background: #17a2b8; color: white; border: none; font-weight: bold; margin-top: 10px; cursor: pointer; }
        .hidden { display: none; }
        .dot-item { background: white; margin: 5px 0; padding: 8px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #ddd; border-radius: 4px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Aircraft Plates</h1>
    
    <label>1. Manufacturer:</label>
    <select id="select-fabrikant" onchange="updateTypes()">
        <option value="">-- Select Manufacturer --</option>
    </select>

    <label>2. Aircraft Type:</label>
    <select id="select-type" onchange="showImage()">
        <option value="">-- Select Type --</option>
    </select>

    <div class="image-container" id="wrapper">
        <img id="vliegtuig-beeld" src="" alt="Aircraft Plate" onclick="handleImageClick(event)">
        <div id="dots-layer"></div>
    </div>

    <div class="admin-panel">
        <!-- Knop tekst en functie veranderen dynamisch -->
        <button id="auth-btn" onclick="handleAuthClick()" style="background:#6c757d; color:white; border:none; cursor:pointer;">Editor Login</button>
        
        <div id="admin-controls" class="hidden">
            <div class="admin-box">
                <h3>Editor Menu</h3>
                <input type="text" id="new-fabrikant" placeholder="Manufacturer (e.g. Boeing)">
                <input type="text" id="new-type" placeholder="Type (e.g. 737)">
                <input type="text" id="new-image" placeholder="Image Filename (e.g. b737.jpg)">
                
                <button class="btn-save" onclick="addEntry()">Save to local list</button>
                
                <div id="dot-editor" class="hidden">
                    <hr>
                    <h4>Manage Dots for selected type</h4>
                    <p><small>Click on the image above to add a dot.</small></p>
                    <ul id="current-dots" style="list-style:none; padding:0;"></ul>
                </div>
                <hr>
                <h4>Publish to GitHub</h4>
                <button class="btn-export" onclick="exportData()">Generate Full Backup Code</button>
                <textarea id="export-area" style="width:100%; height:120px; margin-top:10px; font-size:10px; font-family:monospace;" readonly></textarea>
            </div>
        </div>
    </div>
</div>

<script src="data.js"></script>

<script>
    let githubData = (typeof permanentData !== 'undefined') ? permanentData : {};
    let localData = JSON.parse(localStorage.getItem('aircraftDB')) || {};
    let aircraftData = JSON.parse(JSON.stringify(githubData));
    for (let f in localData) {
        if (!aircraftData[f]) aircraftData[f] = {};
        for (let t in localData[f]) { aircraftData[f][t] = localData[f][t]; }
    }

    let isEditor = sessionStorage.getItem('isLoggedIn') === 'true';

    // Gecombineerde functie voor Login en Logout
    function handleAuthClick() {
        if (isEditor) {
            // Loguit actie
            if(confirm("Are you sure you want to log out of Editor Mode?")) {
                isEditor = false;
                sessionStorage.removeItem('isLoggedIn');
                location.reload(); // Herlaad om alles netjes te verbergen
            }
        } else {
            // Login actie
            if(prompt("Enter Access Key:") === "Scr@mble-Pl@tes") {
                isEditor = true;
                sessionStorage.setItem('isLoggedIn', 'true');
                checkAuthUI();
            } else { alert("Wrong key!"); }
        }
    }

    function checkAuthUI() {
        if (isEditor) {
            document.getElementById('admin-controls').classList.remove('hidden');
            const btn = document.getElementById('auth-btn');
            btn.innerText = "Log Out (Editor Mode Active)";
            btn.style.background = "#dc3545"; // Maak de knop rood voor uitloggen
            checkDotEditor();
        }
    }

    function addEntry() {
        const fab = document.getElementById('new-fabrikant').value.trim();
        const type = document.getElementById('new-type').value.trim();
        const img = document.getElementById('new-image').value.trim();
        if(!fab || !type || !img) return alert("Fill all fields");
        if(!aircraftData[fab]) aircraftData[fab] = {};
        const dots = aircraftData[fab][type] ? aircraftData[fab][type].dots : [];
        aircraftData[fab][type] = { img: img, dots: dots };
        localStorage.setItem('aircraftDB', JSON.stringify(aircraftData));
        alert("Saved locally!");
        location.reload();
    }

    function exportData() {
        const finalCode = "const permanentData = " + JSON.stringify(aircraftData, null, 2) + ";";
        document.getElementById('export-area').value = finalCode;
        document.getElementById('export-area').select();
    }

    function loadManufacturers() {
        const sel = document.getElementById('select-fabrikant');
        sel.innerHTML = '<option value="">-- Select Manufacturer --</option>';
        Object.keys(aircraftData).sort().forEach(f => {
            let opt = document.createElement('option');
            opt.value = f; opt.text = f; sel.add(opt);
        });
    }

    function updateTypes() {
        const fab = document.getElementById('select-fabrikant').value;
        const sel = document.getElementById('select-type');
        sel.innerHTML = '<option value="">-- Select Type --</option>';
        if(aircraftData[fab]) {
            Object.keys(aircraftData[fab]).sort().forEach(t => {
                let opt = document.createElement('option');
                opt.value = t; opt.text = t; sel.add(opt);
            });
        }
        showImage();
    }

    function showImage() {
        const f = document.getElementById('select-fabrikant').value;
        const t = document.getElementById('select-type').value;
        const wrap = document.getElementById('wrapper');
        const img = document.getElementById('vliegtuig-beeld');
        if(f && t && aircraftData[f][t]) {
            img.src = "Images/" + aircraftData[f][t].img;
            img.onload = () => { wrap.style.display = "block"; renderDots(); };
            img.onerror = () => { wrap.style.display = "none"; };
        } else { wrap.style.display = "none"; }
        if(isEditor) checkDotEditor();
    }

    function handleImageClick(e) {
        if(!isEditor) return;
        const f = document.getElementById('select-fabrikant').value;
        const t = document.getElementById('select-type').value;
        if(!f || !t) return;
        const rect = e.target.getBoundingClientRect();
        const x = ((e.clientX - rect.left) / rect.width) * 100;
        const y = ((e.clientY - rect.top) / rect.height) * 100;
        const info = prompt("Description:");
        if(info) {
            aircraftData[f][t].dots.push({x, y, info});
            localStorage.setItem('aircraftDB', JSON.stringify(aircraftData));
            renderDots(); renderDotList();
        }
    }

    function renderDots() {
        const f = document.getElementById('select-fabrikant').value;
        const t = document.getElementById('select-type').value;
        const layer = document.getElementById('dots-layer');
        layer.innerHTML = "";
        if(aircraftData[f] && aircraftData[f][t]) {
            aircraftData[f][t].dots.forEach(d => {
                const dot = document.createElement('div');
                dot.className = 'dot'; dot.style.left = d.x + "%"; dot.style.top = d.y + "%";
                dot.setAttribute('data-info', d.info); layer.appendChild(dot);
            });
        }
    }

    function renderDotList() {
        const f = document.getElementById('select-fabrikant').value;
        const t = document.getElementById('select-type').value;
        const list = document.getElementById('current-dots');
        list.innerHTML = "";
        if(aircraftData[f] && aircraftData[f][t]) {
            aircraftData[f][t].dots.forEach((d, i) => {
                const li = document.createElement('li');
                li.className = 'dot-item';
                li.innerHTML = `<span>${d.info}</span> <button onclick="delDot(${i})" style="width:auto; background:red; color:white; border:none; padding:4px 8px; border-radius:4px; cursor:pointer;">Delete</button>`;
                list.appendChild(li);
            });
        }
    }

    function delDot(i) {
        const f = document.getElementById('select-fabrikant').value;
        const t = document.getElementById('select-type').value;
        aircraftData[f][t].dots.splice(i, 1);
        localStorage.setItem('aircraftDB', JSON.stringify(aircraftData));
        renderDots(); renderDotList();
    }

    function checkDotEditor() {
        const hasType = !!document.getElementById('select-type').value;
        document.getElementById('dot-editor').classList.toggle('hidden', !hasType || !isEditor);
        if(hasType && isEditor) renderDotList();
    }

    loadManufacturers();
    checkAuthUI();
</script>
</body>
</html>
