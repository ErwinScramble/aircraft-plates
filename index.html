<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aircraft MSN Locator</title>
    <script src="https://cloudflare.com"></script>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f0f4f8; margin: 0; padding: 20px; color: #1a202c; }
        .container { max-width: 1100px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 40px; padding-top: 20px; }
        h1 { font-size: 2.5rem; margin-bottom: 10px; color: #2d3748; }
        .subtitle { color: #4a5568; margin-bottom: 30px; }
        .search-box { width: 100%; max-width: 600px; padding: 18px 25px; border-radius: 50px; border: 2px solid #cbd5e0; font-size: 18px; outline: none; transition: all 0.3s; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .search-box:focus { border-color: #3182ce; box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.5); }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 25px; }
        .card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); display: flex; flex-direction: column; border: 1px solid #e2e8f0; transition: transform 0.2s; }
        .card:hover { transform: translateY(-5px); }
        .manufacturer { color: #3182ce; font-size: 13px; text-transform: uppercase; font-weight: 700; letter-spacing: 1.5px; margin-bottom: 8px; }
        .model { font-size: 22px; font-weight: 700; margin-bottom: 15px; color: #1a202c; }
        .location-bubble { background: #edf2f7; color: #2d3748; padding: 15px; border-radius: 12px; font-size: 15px; position: relative; border-left: 5px solid #3182ce; line-height: 1.5; }
        .notes { font-size: 13px; color: #718096; margin-top: 15px; padding-top: 15px; border-top: 1px dashed #e2e8f0; }
        .no-results { text-align: center; font-size: 1.2rem; color: #a0aec0; margin-top: 100px; }
        .loading { text-align: center; margin-top: 50px; font-weight: bold; color: #3182ce; }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1>✈️ Aircraft MSN Locator</h1>
        <p class="subtitle">Global spotting guide for Construction Number plates</p>
        <input type="text" id="searchInput" class="search-box" placeholder="Start typing a model (e.g. F-16, Boeing, Mi-8)...">
    </header>
    <div id="loading" class="loading">Loading aircraft database...</div>
    <div id="resultsGrid" class="grid"></div>
    <div id="noResults" class="no-results" style="display:none;">No matches found. Try another aircraft.</div>
</div>

<script>
    let aircraftData = [];
    // VERVANG DIT DOOR DE EXACTE NAAM OP GITHUB
    const csvUrl = 'aircraft_plates_db.csv'; 

    Papa.parse(csvUrl, {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
            document.getElementById('loading').style.display = 'none';
            aircraftData = results.data.filter(row => Object.values(row).some(v => v && v.trim() !== ""));
            displayResults(aircraftData);
        },
        error: function(err) {
            document.getElementById('loading').innerText = "Error: Could not load '" + csvUrl + "'. Check if the file exists on GitHub.";
            console.error(err);
        }
    });

    document.getElementById('searchInput').addEventListener('input', (e) => {
        const searchTerm = e.target.value.toLowerCase();
        const filtered = aircraftData.filter(item => {
            return Object.values(item).join(' ').toLowerCase().includes(searchTerm);
        });
        displayResults(filtered);
    });

    function displayResults(data) {
        const grid = document.getElementById('resultsGrid');
        const noResults = document.getElementById('noResults');
        grid.innerHTML = '';
        if (data.length === 0) { noResults.style.display = 'block'; return; }
        noResults.style.display = 'none';
        data.forEach(item => {
            const cols = Object.values(item);
            if (cols.length < 2) return;
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="manufacturer">${cols[0] || 'Unknown'}</div>
                <div class="model">${cols[1] || 'Unknown Type'}</div>
                <div class="location-bubble"><strong>📍 Plate Location:</strong><br>${cols[2] || 'Not specified'}</div>
                ${cols[3] ? '<div class="notes"><strong>Pro Tip:</strong> ' + cols[3] + '</div>' : ''}
            `;
            grid.appendChild(card);
        });
    }
</script>
</body>
</html>
