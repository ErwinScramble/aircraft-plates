<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aircraft Plate Locator</title>
    <style>
        /* Basisstijl voor mobiel en desktop */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; background: #eef2f3; color: #333; }
        h1 { text-align: center; color: #2c3e50; font-size: 1.5rem; }
        
        .controls { 
            display: flex; gap: 10px; margin-bottom: 20px; justify-content: center; flex-wrap: wrap; 
            background: white; padding: 15px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        select { padding: 10px; border-radius: 5px; border: 1px solid #ccc; min-width: 150px; font-size: 16px; }

        /* De afbeelding en stippen */
        .image-outer-container { text-align: center; }
        .image-container { 
            position: relative; display: inline-block; max-width: 100%; 
            background: #ddd; border-radius: 8px; overflow: hidden;
        }
        #aircraft-img { max-width: 100%; height: auto; display: block; }

        .dot {
            position: absolute; width: 24px; height: 24px; background: #ff3e3e;
            border-radius: 50%; transform: translate(-50%, -50%); cursor: pointer;
            border: 3px solid white; box-shadow: 0 0 10px rgba(0,0,0,0.5);
            display: flex; align-items: center; justify-content: center;
        }

        /* Tooltip (tekst bij de stip) */
        .dot::after {
            content: attr(data-info); position: absolute; bottom: 30px; left: 50%;
            transform: translateX(-50%); background: rgba(0,0,0,0.8); color: white;
            padding: 6px 10px; border-radius: 4px; font-size: 12px;
            white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity 0.2s;
        }
        .dot:hover::after { opacity: 1; }

        /* Editor paneel */
        .editor-panel { 
            margin-top: 20px; padding: 20px; background: #fff3cd; border: 1px solid #ffeeba; 
            border-radius: 10px; display: none; text-align: center;
        }
        .btn { 
            background: #2c3e50; color: white; border: none; padding: 10px 20px; 
            border-radius: 5px; cursor: pointer; font-size: 14px; margin: 5px;
        }
        .btn-editor { background: #6c757d; }
        .btn-save { background: #28a745; }
    </style>
</head>
<body>

    <h1>Aircraft Plate Locator</h1>

    <div class="controls">
        <select id="manufacturerSelect"><option value="">Manufacturer...</option></select>
        <select id="typeSelect"><option value="">Type...</option></select>
        <button id="toggleEditor" class="btn btn-editor">Editor Mode</button>
    </div>

    <div class="image-outer-container">
        <div class="image-container" id="container">
            <img id="aircraft-img" src="" alt="Select an aircraft to view the locations">
        </div>
    </div>

    <div id="editorPanel" class="editor-panel">
        <h3>🛠 Editor Mode Active</h3>
        <p>1. Click on the image to add a dot.<br>2. To move a dot: Click it to delete and place a new one.</p>
        <button onclick="saveChanges()" class="btn btn-save">Step 2: Download Updated JSON</button>
        <p><small>After downloading, upload 'aircraft_data.json' to GitHub to save it permanently.</small></p>
    </div>

    <script>
        let aircraftData = {};
        const mSelect = document.getElementById('manufacturerSelect');
        const tSelect = document.getElementById('typeSelect');
        const img = document.getElementById('aircraft-img');
        const container = document.getElementById('container');
        const editorPanel = document.getElementById('editorPanel');
        let isEditor = false;

        // LAAD DE DATA
        fetch('aircraft_data.json')
            .then(res => res.json())
            .then(data => {
                aircraftData = data;
                populateManufacturers();
            })
            .catch(err => {
                console.error("Could not load aircraft_data.json. Make sure it exists!");
            });

        function populateManufacturers() {
            mSelect.innerHTML = '<option value="">Select Manufacturer</option>';
            Object.keys(aircraftData).sort().forEach(m => {
                const opt = document.createElement('option');
                opt.value = m; opt.textContent = m;
                mSelect.appendChild(opt);
            });
        }

        mSelect.onchange = () => {
            tSelect.innerHTML = '<option value="">Select Type</option>';
            const m = mSelect.value;
            if(m && aircraftData[m]) {
                Object.keys(aircraftData[m]).sort().forEach(t => {
                    const opt = document.createElement('option');
                    opt.value = t; opt.textContent = t;
                    tSelect.appendChild(opt);
                });
            }
        };

        tSelect.onchange = loadAircraft;

        function loadAircraft() {
            const m = mSelect.value;
            const t = tSelect.value;
            if(!m || !t) return;

            const data = aircraftData[m][t];
            img.src = data.img;
            
            // Verwijder oude stippen
            document.querySelectorAll('.dot').forEach(d => d.remove());

            // Plaats opgeslagen stippen
            if(data.dots) {
                data.dots.forEach((dot, index) => {
                    createDot(dot.x, dot.y, dot.info, index);
                });
            }
        }

        function createDot(x, y, info, index) {
            const dot = document.createElement('div');
            dot.className = 'dot';
            dot.style.left = x + "%";
            dot.style.top = y + "%";
            dot.setAttribute('data-info', info);
            
            // Als editor op stip klikt -> verwijderen
            dot.onclick = (e) => {
                if(isEditor) {
                    e.stopPropagation();
                    if(confirm("Delete this dot?")) {
                        aircraftData[mSelect.value][tSelect.value].dots.splice(index, 1);
                        loadAircraft();
                    }
                }
            };
            
            container.appendChild(dot);
        }

        // EDITOR LOGICA
        document.getElementById('toggleEditor').onclick = () => {
            const pw = isEditor ? "" : prompt("Enter Editor Password:");
            if(!isEditor && pw !== "admin123") return; // Simpel wachtwoord

            isEditor = !isEditor;
            editorPanel.style.display = isEditor ? 'block' : 'none';
        };

        img.onclick = (e) => {
            if(!isEditor || !tSelect.value) return;
            
            const rect = img.getBoundingClientRect();
            const x = ((e.clientX - rect.left) / rect.width) * 100;
            const y = ((e.clientY - rect.top) / rect.height) * 100;
            const info = prompt("Location description (e.g. 'Inside nose wheel door'):");
            
            if(info) {
                if(!aircraftData[mSelect.value][tSelect.value].dots) {
                    aircraftData[mSelect.value][tSelect.value].dots = [];
                }
                aircraftData[mSelect.value][tSelect.value].dots.push({x, y, info});
                loadAircraft();
            }
        };

        function saveChanges() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(aircraftData, null, 4));
            const dlAnchor = document.createElement('a');
            dlAnchor.setAttribute("href", dataStr);
            dlAnchor.setAttribute("download", "aircraft_data.json");
            dlAnchor.click();
        }
    </script>
</body>
</html>
