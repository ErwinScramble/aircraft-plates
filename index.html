<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aircraft MSN Locator - Professional Dashboard</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root { --blue: #2563eb; --dark: #0f172a; --gray: #f1f5f9; --green: #10b981; --red: #ef4444; }
        body { font-family: 'Inter', sans-serif; background: var(--gray); margin: 0; padding: 20px; color: var(--dark); }
        .container { max-width: 1000px; margin: 0 auto; text-align: center; }
        
        .selection-area { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; background: white; padding: 20px; border-radius: 15px; text-align: left; border: 1px solid #e2e8f0; }
        select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #cbd5e0; font-size: 16px; background: white; outline: none; }
        
        .display-box { background: white; border-radius: 24px; padding: 40px; margin: 20px auto; height: 400px; position: relative; border: 1px solid #e2e8f0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        #aircraft-img { max-width: 100%; max-height: 100%; object-fit: contain; pointer-events: none; user-select: none; }
        
        .marker-dot { position: absolute; width: 24px; height: 24px; background: var(--red); border-radius: 50%; border: 3px solid white; box-shadow: 0 0 15px rgba(239, 68, 68, 0.6); z-index: 100; transform: translate(-50%, -50%); cursor: grab; }
        .marker-dot:hover::after { content: attr(data-label); position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); background: black; color: white; padding: 5px 12px; border-radius: 6px; font-size: 12px; white-space: nowrap; }

        .editor-ui { background: var(--dark); color: white; padding: 25px; border-radius: 20px; margin-bottom: 20px; display: none; text-align: left; }
        .marker-item { display: flex; gap: 10px; margin-bottom: 8px; align-items: center; background: #334155; padding: 8px; border-radius: 6px; }
        input { padding: 8px; border-radius: 6px; border: 1px solid #334155; background: #1e293b; color: white; font-size: 14px; }
        .btn { padding: 10px 20px; border-radius: 10px; border: none; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-blue { background: var(--blue); color: white; }
        .btn-toggle { background: white; border: 1px solid #ccc; margin-bottom: 20px; }
        .csv-output { background: #000; color: #10b981; padding: 15px; border-radius: 10px; font-family: monospace; font-size: 12px; margin-top: 20px; white-space: pre-wrap; overflow-x: auto; max-height: 200px; border: 1px solid #334155; }
        .label-small { font-size: 11px; color: #94a3b8; text-transform: uppercase; font-weight: bold; display: block; margin-bottom: 4px; }
    </style>
</head>
<body>

<div class="container">
    <h1>✈️ Aircraft MSN Locator</h1>

    <!-- EDITOR PANEL -->
    <div id="editorPanel" class="editor-ui">
        <div id="editFields" style="display:none; border-bottom: 1px solid #444; padding-bottom: 20px; margin-bottom: 20px;">
            <strong>Edit Selected Aircraft:</strong>
            <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top:10px;">
                <div><span class="label-small">Manufacturer</span><input type="text" id="editMfr" oninput="applyChanges()" style="width:90%"></div>
                <div><span class="label-small">Model Name</span><input type="text" id="editModel" oninput="applyChanges()" style="width:90%"></div>
                <div><span class="label-small">PNG Category</span><input type="text" id="editCat" oninput="applyChanges()" style="width:90%"></div>
            </div>
            <div id="markerControls" style="margin-top: 15px;"></div>
            <button class="btn btn-blue" onclick="addNewPoint()">+ Add Point</button>
            <button class="btn" style="background:var(--red); color:white; float:right;" onclick="deleteAircraft()">Delete Aircraft</button>
        </div>

        <div>
            <strong>Add New Aircraft:</strong><br>
            <input type="text" id="newMfr" placeholder="Manufacturer">
            <input type="text" id="newModel" placeholder="Model">
            <input type="text" id="newCat" placeholder="PNG Name (e.g. Cessna)">
            <button class="btn btn-blue" onclick="addNewAircraft()">+ Add to List</button>
        </div>

        <div style="margin-top:20px;">
            <strong>CSV Result (Copy this to GitHub):</strong>
            <div id="csvResult" class="csv-output">Result will appear here...</div>
            <button class="btn" style="background:var(--green); color:white; width:100%; margin-top:10px;" onclick="copyCSV()">📋 Copy CSV Text</button>
        </div>
    </div>

    <button onclick="toggleEditor()" id="editBtn" class="btn btn-toggle">⚙️ Toggle Editor Mode</button>

    <div class="selection-area">
        <div><label class="label-small">1. Manufacturer</label><select id="mfrSelect" onchange="updateModelList()"><option value="">Loading...</option></select></div>
        <div><label class="label-small">2. Model</label><select id="modelSelect" onchange="loadAircraft()" disabled><option value="">-- Choose Manufacturer --</option></select></div>
    </div>

    <div class="display-box" id="map" onmousemove="onMouseMove(event)" onmouseup="onMouseUp(event)">
        <img id="aircraft-img" src="" alt="" style="display:none;">
        <div id="markerContainer"></div>
    </div>
</div>

<script>
    let db = []; let selected = null; let isEdit = false; let draggingIdx = -1;

    fetch('aircraft_plates_db.csv?v=' + Date.now()).then(r => r.text()).then(t => {
        const rows = t.split(/\r?\n/);
        db = rows.slice(1).filter(r => r.trim()).map(r => {
            const c = r.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
            return { mfr: (c[0]||"").trim(), model: (c[1]||"").trim(), notes: (c[3]||"").replace(/"/g,""), cat: (c[4]||"airliner").trim(), points: (c[5]||"").replace(/"/g,"") };
        });
        refreshMfrDropdown();
    });

    function refreshMfrDropdown() {
        const select = document.getElementById('mfrSelect');
        const prev = select.value;
        select.innerHTML = '<option value="">-- Select Manufacturer --</option>';
        [...new Set(db.map(i => i.mfr))].sort().forEach(m => {
            const opt = document.createElement('option'); opt.value = opt.innerText = m; select.appendChild(opt);
        });
        if (prev) select.value = prev;
        generateCSV();
    }

    function updateModelList() {
        const mfr = document.getElementById('mfrSelect').value;
        const select = document.getElementById('modelSelect');
        select.innerHTML = '<option value="">-- Choose Model --</option>';
        select.disabled = !mfr;
        if (mfr) {
            db.filter(i => i.mfr === mfr).forEach(item => {
                const opt = document.createElement('option'); opt.value = item.model; opt.innerText = item.model; select.appendChild(opt);
            });
        }
    }

    function loadAircraft() {
        const mfr = document.getElementById('mfrSelect').value;
        const model = document.getElementById('modelSelect').value;
        selected = db.find(i => i.mfr === mfr && i.model === model);
        if(!selected) return;
        document.getElementById('aircraft-img').src = 'silhouettes/' + selected.cat + '.png';
        document.getElementById('aircraft-img').style.display = 'block';
        if(isEdit) {
            document.getElementById('editFields').style.display = 'block';
            document.getElementById('editMfr').value = selected.mfr;
            document.getElementById('editModel').value = selected.model;
            document.getElementById('editCat').value = selected.cat;
        }
        drawMarkers();
    }

    function drawMarkers() {
        const container = document.getElementById('markerContainer');
        const controls = document.getElementById('markerControls');
        container.innerHTML = ''; controls.innerHTML = '';
        if(!selected || !selected.points) return;
        selected.points.split(';').forEach((p, idx) => {
            if(!p || !p.includes('|')) return;
            const pts = p.split('|');
            const dot = document.createElement('div');
            dot.className = 'marker-dot'; dot.style.left = pts[0] + '%'; dot.style.top = pts[1] + '%';
            dot.setAttribute('data-label', pts[2] || 'Plate');
            dot.onmousedown = (e) => { if(isEdit) { e.stopPropagation(); draggingIdx = idx; } };
            container.appendChild(dot);
            if(isEdit) {
                const item = document.createElement('div');
                item.className = 'marker-item';
                item.innerHTML = `<input type="text" value="${pts[2] || ''}" oninput="updateLabel(${idx}, this.value)" style="flex:1"><button onclick="removeMarker(${idx})" style="color:var(--red); border:none; background:none;">DEL</button>`;
                controls.appendChild(item);
            }
        });
    }

    function onMouseMove(e) {
        if (draggingIdx === -1) return;
        const rect = document.getElementById('map').getBoundingClientRect();
        const x = Math.max(0, Math.min(100, Math.round(((e.clientX - rect.left) / rect.width) * 100)));
        const y = Math.max(0, Math.min(100, Math.round(((e.clientY - rect.top) / rect.height) * 100)));
        let ptsArr = selected.points.split(';');
        let pParts = ptsArr[draggingIdx].split('|');
        ptsArr[draggingIdx] = x + '|' + y + '|' + (pParts[2] || "Point");
        selected.points = ptsArr.join(';');
        drawMarkers(); generateCSV();
    }

    function onMouseUp() { draggingIdx = -1; }
    function applyChanges() { if(!selected) return; selected.mfr = document.getElementById('editMfr').value; selected.model = document.getElementById('editModel').value; selected.cat = document.getElementById('editCat').value; refreshMfrDropdown(); updateModelList(); }
    function deleteAircraft() { if(!selected || !confirm("Delete?")) return; db = db.filter(i => i !== selected); selected = null; refreshMfrDropdown(); updateModelList(); loadAircraft(); }
    function addNewAircraft() { const m = document.getElementById('newMfr').value; const mod = document.getElementById('newModel').value; db.push({ mfr: m, model: mod, cat: document.getElementById('newCat').value, points: "50|50|Main Plate", notes: "" }); refreshMfrDropdown(); }
    function addNewPoint() { if(!selected) return; selected.points = selected.points ? selected.points + ';50|50|New Point' : '50|50|Main Plate'; drawMarkers(); generateCSV(); }
    function removeMarker(idx) { let pts = selected.points.split(';'); pts.splice(idx, 1); selected.points = pts.join(';'); drawMarkers(); generateCSV(); }
    function updateLabel(idx, val) { let pts = selected.points.split(';'); let p = pts[idx].split('|'); pts[idx] = p[0] + '|' + p[1] + '|' + val; selected.points = pts.join(';'); generateCSV(); }
    function toggleEditor() { isEdit = !isEdit; document.getElementById('editorPanel').style.display = isEdit ? 'block' : 'none'; if(selected) loadAircraft(); }

    function generateCSV() {
        let csv = "Manufacturer,Model,Plate_Location,Notes,Category,Points\n";
        db.forEach(i => { csv += `${i.mfr},${i.model},"", "${i.notes}",${i.cat},"${i.points}"\n`; });
        document.getElementById('csvResult').innerText = csv;
    }

    function copyCSV() {
        const text = document.getElementById('csvResult').innerText;
        navigator.clipboard.writeText(text);
        alert("CSV text copied to clipboard! Paste it into your file on GitHub.");
    }
</script>
</body>
</html>
