<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aircraft Construction Plates</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; max-width: 900px; margin: auto; padding: 20px; background-color: #f4f7f6; }
        h1 { color: #2c3e50; text-align: center; }
        #search { width: 100%; padding: 12px; margin-bottom: 30px; border: 1px solid #ccc; border-radius: 25px; font-size: 16px; box-sizing: border-box; }
        .aircraft-card { background: white; border-radius: 10px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .aircraft-card h3 { margin-top: 0; color: #2980b9; }
        .location-box { background: #eef2f3; padding: 10px; border-left: 5px solid #2980b9; margin: 10px 0; }
        .img-container { text-align: center; margin-top: 15px; }
        img { max-width: 100%; height: auto; border-radius: 5px; border: 1px solid #ddd; }
        .no-image { font-style: italic; color: #999; }
    </style>
</head>
<body>

    <h1>Vliegtuig Plaatjes Locaties</h1>
    <input type="text" id="search" placeholder="Zoek op merk of type (bijv. Cessna)...">
    
    <div id="list">
        <!-- Hier komen de vliegtuigen te staan -->
    </div>

    <script>
        // We halen de data op uit je aircrafts.json
        fetch('aircrafts.json')
            .then(response => response.json())
            .then(data => {
                const listDiv = document.getElementById('list');
                const searchInput = document.getElementById('search');

                function display(filter = "") {
                    listDiv.innerHTML = "";
                    const filteredData = data.filter(a => 
                        a.type.toLowerCase().includes(filter.toLowerCase()) || 
                        a.brand.toLowerCase().includes(filter.toLowerCase())
                    );

                    filteredData.forEach(a => {
                        listDiv.innerHTML += `
                            <div class="aircraft-card">
                                <h3>${a.brand} ${a.type}</h3>
                                <div class="location-box">
                                    <strong>Locatie constructienummer:</strong><br>
                                    ${a.location}
                                </div>
                                <div class="img-container">
                                    <!-- Let op de hoofdletter I in de mapnaam Images -->
                                    <img src="Images/${a.image}" alt="Plaatje van ${a.type}" 
                                         onerror="this.parentElement.innerHTML='<span class=\"no-image\">Geen afbeelding beschikbaar</span>'">
                                </div>
                            </div>
                        `;
                    });

                    if(filteredData.length === 0) {
                        listDiv.innerHTML = "<p style='text-align:center;'>Geen vliegtuigen gevonden.</p>";
                    }
                }

                searchInput.addEventListener('input', (e) => display(e.target.value));
                display(); // Toon alles bij het laden
            })
            .catch(err => {
                console.error("Fout bij laden data:", err);
                document.getElementById('list').innerHTML = "De lijst kon niet worden geladen. Controleer of aircrafts.json bestaat.";
            });
    </script>

</body>
</html>
