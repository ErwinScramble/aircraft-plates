<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aircraft MSN Locator - Real Silhouette Edition</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root { --blue: #2563eb; --dark: #0f172a; --gray: #f1f5f9; }
        body { font-family: 'Inter', sans-serif; background: var(--gray); margin: 0; padding: 20px; color: var(--dark); }
        .container { max-width: 1200px; margin: 0 auto; text-align: center; }
        .display-box { 
            background: white; border-radius: 24px; padding: 40px; margin: 20px auto;
            max-width: 900px; height: 350px; box-shadow: 0 15px 40px rgba(0,0,0,0.05);
            position: relative; border: 1px solid #e2e8f0;
            display: flex; align-items: center; justify-content: center;
        }
        svg.unit { width: 90%; height: 90%; display: none; fill: #475569; }
        svg.active { display: block; }
        .marker-dot { fill: #ef4444; stroke: white; stroke-width: 5; display: none; pointer-events: none; }
        .marker-dot.active { display: block; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { r: 10; opacity: 1; } 50% { r: 16; opacity: 0.6; } 100% { r: 10; opacity: 1; } }
        .editor-ui { background: var(--dark); color: white; padding: 20px; border-radius: 15px; margin-bottom: 20px; text-align: left; display: none; }
        .code-output { background: #000; padding: 12px; color: #10b981; font-family: monospace; font-size: 12px; border-radius: 5px; margin-top: 10px; }
        .card { background: white; padding: 15px; border-radius: 15px; border: 1px solid #e2e8f0; cursor: pointer; transition: 0.2s; text-align: left; }
        .card.selected { border: 2px solid var(--blue); background: #eff6ff; }
        .search-box { width: 100%; max-width: 600px; padding: 18px 25px; border-radius: 50px; border: 2px solid #e2e8f0; font-size: 18px; outline: none; margin-bottom: 30px; }
        .bubble { background: var(--dark); color: white; padding: 10px 20px; border-radius: 50px; font-size: 14px; margin-top: 15px; display: none; font-weight: 600; }
    </style>
</head>
<body>

<div class="container">
    <h1>✈️ Aircraft MSN Locator</h1>

    <div id="editorPanel" class="editor-ui">
        <strong>🛠 Editor Mode:</strong> Click on the real silhouette to get coordinates.<br>
        <div id="log" class="code-output">Select aircraft first...</div>
    </div>
    <button onclick="toggleEditor()" style="margin-bottom: 20px; cursor:pointer; padding: 10px 20px;">Toggle Editor Mode</button>

    <div class="display-box" id="map" onclick="getClickCoords(event)">
        
        <!-- C-130 HERCULES -->
        <svg id="view-hercules" class="unit" viewBox="0 0 500 200">
            <path d="M25,140 L45,120 L80,115 L150,115 L250,115 L350,115 L420,115 L445,40 L480,40 L460,115 L475,130 L475,155 L420,165 L100,165 L45,155 Z"/>
            <circle class="marker-dot" cx="0" cy="0" r="12" />
        </svg>

        <!-- AN-2 BIPLANE -->
        <svg id="view-biplane" class="unit" viewBox="0 0 500 200">
            <path d="M40,150 Q40,100 120,100 L400,120 L450,40 L480,40 L460,130 L400,160 L120,175 Q40,175 40,150 Z M100,80 L350,80 L350,90 L100,90 Z M120,165 L320,165 L320,175 L120,175 Z"/>
            <circle class="marker-dot" cx="0" cy="0" r="12" />
        </svg>

        <!-- CESSNA (High Wing) -->
        <svg id="view-prophigh" class="unit" viewBox="0 0 500 200">
            <path d="M40,140 L100,130 L400,130 L440,50 L470,50 L455,130 L100,155 L40,145 Z M100,90 L300,90 L300,100 L100,100 Z"/>
            <circle class="marker-dot" cx="0" cy="0" r="12" />
        </svg>

        <!-- PIPER (Low Wing) -->
        <svg id="view-proplow" class="unit" viewBox="0 0 500 200">
            <path d="M40,140 L120,130 L400,130 L440,60 L470,60 L455,135 L120,155 L40,150 Z M130,135 L330,135 L330,145 L130,145 Z"/>
            <circle class="marker-dot" cx="0" cy="0" r="12" />
        </svg>

        <!-- AIRLINER -->
        <svg id="view-airliner" class="unit active" viewBox="0 0 500 200">
            <path d="M40,120 Q40,100 150,100 L410,100 Q490,100 490,120 Q490,140 410,140 L100,140 Q40,140 40,120 Z M380,100 L460,30 L490,30 L460,100 Z M180,140 L350,190 L400,190 L250,140 Z"/>
            <circle class="marker-dot" cx="0" cy="0" r="12" />
        </svg>

        <!-- FIGHTER -->
        <svg id="view-fighter" class="unit" viewBox="0 0 500 200">
            <path d="M20,120 L150,105 L350,105 L450,30 L480,30 L460,105 L495,120 L460,135 L150,135 Z"/>
            <circle class="marker-dot" cx="0" cy="0" r="12" />
        </svg>

        <!-- HELICOPTER -->
        <svg id="view-heli" class="unit" viewBox="0 0 500 200">
            <path d="M50,160 Q20,160 20,110 L100,60 L420,60 L450,20 L480,20 L460,80 L420,80 Q420,160 50,160 Z"/>
            <circle class="marker-dot" cx="0" cy="0" r="12" />
        </svg>

    </div>

    <div id="infoBubble" class="bubble"></div>
    <input type="text" id="search" class="search-box" placeholder="Search (e.g. An-2, Hercules, Cessna)...">
    <div id="results" style="display:grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap:15px; text-align:left;"></div>
</div>

<script>
    let db = []; let selected = null; let isEdit = false;

    fetch('aircraft_plates_db.csv').then(r => r.text()).then(t => {
        const rows = t.split(/\r?\n/).slice(1);
        db = rows.filter(r => r.trim()).map(r => {
            const c = r.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
            return { mfr: c[0], model: c[1], loc: (c[2]||"").replace(/"/g,""), cat: (c[4]||"Airliner").trim(), x: c[5], y: c[6] };
        });
        render();
    });

    function render(f = '') {
        const g = document.getElementById('results'); g.innerHTML = '';
        db.filter(i => (i.mfr+i.model).toLowerCase().includes(f.toLowerCase())).forEach(item => {
            const d = document.createElement('div'); d.className = `card ${selected === item ? 'selected' : ''}`;
            d.innerHTML = `<strong>${item.mfr}</strong><br>${item.model}`;
            d.onclick = () => select(item); g.appendChild(d);
        });
    }

    function select(item) {
        selected = item; render(document.getElementById('search').value);
        const catMap = { 'Airliner':'view-airliner', 'Fighter':'view-fighter', 'Heli':'view-heli', 'PropHigh':'view-prophigh', 'PropLow':'view-proplow', 'Biplane':'view-biplane', 'Hercules':'view-hercules' };
        document.querySelectorAll('.unit').forEach(u => u.classList.remove('active'));
        const activeSvg = document.getElementById(catMap[item.cat] || 'view-airliner');
        activeSvg.classList.add('active');
        const dot = activeSvg.querySelector('.marker-dot');
        if(item.x && item.y) {
            dot.setAttribute('cx', item.x); dot.setAttribute('cy', item.y); dot.classList.add('active');
            document.getElementById('infoBubble').style.display = 'inline-block';
            document.getElementById('infoBubble').innerText = "Plate: " + item.loc;
        } else { dot.classList.remove('active'); document.getElementById('infoBubble').style.display='none'; }
    }

    function getClickCoords(e) {
        if(!isEdit || !selected) return;
        const rect = document.getElementById('map').getBoundingClientRect();
        const x = Math.round(((e.clientX - rect.left) / rect.width) * 500);
        const y = Math.round(((e.clientY - rect.top) / rect.height) * 200);
        const dot = document.querySelector('svg.active .marker-dot');
        dot.setAttribute('cx', x); dot.setAttribute('cy', y); dot.classList.add('active');
        document.getElementById('log').innerText = `${selected.mfr},${selected.model},"${selected.loc}","",${selected.cat},${x},${y}`;
    }

    function toggleEditor() { isEdit = !isEdit; document.getElementById('editorPanel').style.display = isEdit ? 'block' : 'none'; }
    document.getElementById('search').oninput = (e) => render(e.target.value);
</script>
</body>
</html>
