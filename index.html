<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aircraft MSN Locator</title>
    <script src="https://cloudflare.com"></script>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f0f4f8; margin: 0; padding: 20px; color: #1a202c; }
        .container { max-width: 1100px; margin: 0 auto; text-align: center; }
        .search-box { width: 100%; max-width: 600px; padding: 18px 25px; border-radius: 50px; border: 2px solid #cbd5e0; font-size: 18px; outline: none; margin-bottom: 30px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 25px; text-align: left; }
        .card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border: 1px solid #e2e8f0; }
        .manufacturer { color: #3182ce; font-size: 12px; text-transform: uppercase; font-weight: 700; }
        .model { font-size: 20px; font-weight: 700; margin: 10px 0; }
        .location-bubble { background: #edf2f7; padding: 15px; border-radius: 10px; border-left: 5px solid #3182ce; font-size: 14px; line-height: 1.5; }
        .error-msg { background: #fff5f5; color: #c53030; padding: 20px; border-radius: 10px; border: 1px solid #feb2b2; margin-top: 20px; display: none; }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1>✈️ Aircraft MSN Locator</h1>
        <input type="text" id="searchInput" class="search-box" placeholder="Search (e.g. F-16, Boeing)...">
    </header>
    <div id="status" style="margin: 20px 0; font-weight: bold; color: #3182ce;">Connecting to database...</div>
    <div id="errorBox" class="error-msg"></div>
    <div id="resultsGrid" class="grid"></div>
</div>

<script>
    let aircraftData = [];
    const filename = 'aircraft_plates_db.csv'; 

    function loadData(url) {
        Papa.parse(url, {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
                if (results.data.length > 0) {
                    aircraftData = results.data.filter(row => Object.values(row).join('').trim() !== "");
                    document.getElementById('status').style.display = 'none';
                    document.getElementById('errorBox').style.display = 'none';
                    displayResults(aircraftData);
                }
            },
            error: function(err) {
                console.error("Failed to load:", url);
                document.getElementById('status').style.display = 'none';
                document.getElementById('errorBox').style.display = 'block';
                document.getElementById('errorBox').innerHTML = `<strong>Error!</strong> Could not find <code>${filename}</code>.<br>Check if the filename is exactly correct on GitHub.`;
            }
        });
    }

    // Probeer het bestand te laden
    loadData(filename);

    document.getElementById('searchInput').addEventListener('input', (e) => {
        const term = e.target.value.toLowerCase();
        const filtered = aircraftData.filter(item => Object.values(item).join(' ').toLowerCase().includes(term));
        displayResults(filtered);
    });

    function displayResults(data) {
        const grid = document.getElementById('resultsGrid');
        grid.innerHTML = '';
        data.forEach(item => {
            const val = Object.values(item);
            if (val.length < 2) return;
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="manufacturer">${val[0] || 'Unknown'}</div>
                <div class="model">${val[1] || 'Unknown Type'}</div>
                <div class="location-bubble"><strong>📍 Location:</strong><br>${val[2] || 'No location info'}</div>
                ${val[3] ? `<div style="font-size:12px; color:#718096; margin-top:10px;">${val[3]}</div>` : ''}
            `;
            grid.appendChild(card);
        });
    }
</script>
</body>
</html>
