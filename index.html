<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aircraft Plates Database</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; padding: 20px; background: #f0f2f5; color: #333; margin: 0; }
        .container { max-width: 800px; margin: 20px auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #1a73e8; }
        label { font-weight: bold; display: block; margin-top: 15px; }
        select, input, button { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        
        .image-container { position: relative; width: 100%; margin-top: 20px; display: none; border-radius: 8px; background: #eee; border: 1px solid #ddd; overflow: hidden; }
        #vliegtuig-beeld { width: 100%; height: auto; display: block; cursor: crosshair; }
        
        .dot { position: absolute; width: 22px; height: 22px; background: red; border: 3px solid white; border-radius: 50%; transform: translate(-50%, -50%); cursor: pointer; z-index: 5; transition: 0.2s; }
        .dot:hover { transform: translate(-50%, -50%) scale(1.2); background: orange; }
        
        #detail-view { display: none; margin-top: 20px; padding: 15px; border: 2px solid #1a73e8; border-radius: 8px; background: #fff; }
        #detail-img { width: 100%; border-radius: 6px; margin-top: 10px; border: 1px solid #ddd; }
        .close-btn { background: #6c757d; color: white; margin-top: 15px; border: none; cursor: pointer; }

        .admin-panel { margin-top: 40px; padding-top: 20px; border-top: 2px dashed #ccc; }
        .admin-box { background: #f8f9fa; padding: 15px; border-radius: 8px; margin-top: 10px; }
        .btn-save { background: #28a745; color: white; border: none; font-weight: bold; cursor: pointer; }
        .btn-export { background: #17a2b8; color: white; border: none; font-weight: bold; margin-top: 10px; cursor: pointer; }
        .hidden { display: none; }
        .dot-item { background: white; margin-bottom: 5px; padding: 10px; border: 1px solid #ddd; border-radius: 5px; display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>

<div class="container">
    <h1>Aircraft Plates</h1>
    
    <label>1. Manufacturer:</label>
    <select id="select-fabrikant" onchange="updateTypes()">
        <option value="">-- Select Manufacturer --</option>
    </select>

    <label>2. Aircraft Type:</label>
    <select id="select-type" onchange="showImage()">
        <option value="">-- Select Type --</option>
    </select>

    <div class="image-container" id="wrapper">
        <img id="vliegtuig-beeld" src="" alt="Main Plate Location" onclick="handleImageClick(event)">
        <div id="dots-layer"></div>
    </div>

    <!-- Detail View Sectie -->
    <div id="detail-view">
        <h3 id="detail-title">Plate Location Details</h3>
        <p id="detail-info" style="font-size: 1.1em; font-weight: bold;"></p>
        <img id="detail-img" src="" alt="Plate Detail Photo" class="hidden">
        <button class="close-btn" onclick="closeDetail()">Close Detail View</button>
    </div>

    <div class="admin-panel">
        <button id="auth-btn" onclick="authenticateEditor()" style="background:#6c757d; color:white; border:none; cursor:pointer;">Editor Login</button>
        
        <div id="admin-controls" class="hidden">
            <div class="admin-box">
                <h3>Editor Menu</h3>
                <input type="text" id="new-fabrikant" placeholder="Manufacturer (e.g. Boeing)">
                <input type="text" id="new-type" placeholder="Type (e.g. 737)">
                <input type="text" id="new-image-manual" placeholder="Main silhouette image filename (e.g. b737.jpg)">
                <button class="btn-save" onclick="addEntry()">Save / Update Aircraft</button>
                
                <div id="dot-editor" class="hidden">
                    <hr>
                    <h4>Manage Dots (Click on main image above to add)</h4>
                    <ul id="current-dots" style="list-style:none; padding:0;"></ul>
                </div>
                <hr>
                <h4>Backup & Publish</h4>
                <button class="btn-export" onclick="exportData()">Generate Full Backup Code</button>
                <textarea id="export-area" style="width:100%; height:100px; margin-top:10px; font-size:10px; font-family:monospace;"></textarea>
            </div>
        </div>
    </div>
</div>

<script src="data.js"></script>

<script>
    let githubData = (typeof permanentData !== 'undefined') ? permanentData : {};
    let localData = JSON.parse(localStorage.getItem('aircraftDB')) || {};
    let aircraftData = JSON.parse(JSON.stringify(githubData));
    for (let f in localData) {
        if (!aircraftData[f]) aircraftData[f] = {};
        for (let t in localData[f]) { aircraftData[f][t] = localData[f][t]; }
    }

    let isEditor = false;

    function authenticateEditor() {
        if(prompt("Enter Access Key:") === "Scr@mble-Pl@tes") {
            isEditor = true;
            document.getElementById('admin-controls').classList.remove('hidden');
            document.getElementById('auth-btn').innerText = "Editor Mode: ACTIVE";
            document.getElementById('auth-btn').style.background = "#28a745";
            checkDotEditor();
        } else { alert("Wrong key!"); }
    }

    function addEntry() {
        const fab = document.getElementById('new-fabrikant').value.trim();
        const type = document.getElementById('new-type').value.trim();
        const img = document.getElementById('new-image-manual').value.trim();
        if(!fab || !type || !img) return alert("Fill all fields");
        if(!aircraftData[fab]) aircraftData[fab] = {};
        if(!aircraftData[fab][type]) aircraftData[fab][type] = { img: img, dots: [] };
        else aircraftData[fab][type].img = img;
        saveData();
        location.reload();
    }

    function handleImageClick(e) {
        if(!isEditor) return;
        const f = document.getElementById('select-fabrikant').value;
        const t = document.getElementById('select-type').value;
        if(!f || !t) return;
        const rect = e.target.getBoundingClientRect();
        const x = ((e.clientX - rect.left) / rect.width) * 100;
        const y = ((e.clientY - rect.top) / rect.height) * 100;

        const info = prompt("Description (e.g. On the nose gear):");
        const cnImg = prompt("Filename of plate photo in 'cnlocimages' (optional):");

        if(info) {
            aircraftData[f][t].dots.push({x, y, info, cnImg});
            saveData();
            renderDots(); renderDotList();
        }
    }

    function showDetail(dot) {
        document.getElementById('detail-view').style.display = "block";
        document.getElementById('detail-info').innerText = dot.info;
        
        const detailImg = document.getElementById('detail-img');
        if(dot.cnImg) {
            detailImg.src = "cnlocimages/" + dot.cnImg;
            detailImg.classList.remove('hidden');
        } else { detailImg.classList.add('hidden'); }

        document.getElementById('detail-view').scrollIntoView({ behavior: 'smooth' });
    }

    function closeDetail() { document.getElementById('detail-view').style.display = "none"; }

    function renderDots() {
        const f = document.getElementById('select-fabrikant').value;
        const t = document.getElementById('select-type').value;
        const layer = document.getElementById('dots-layer');
        layer.innerHTML = "";
        if(aircraftData[f] && aircraftData[f][t]) {
            aircraftData[f][t].dots.forEach(d => {
                const dot = document.createElement('div');
                dot.className = 'dot'; dot.style.left = d.x + "%"; dot.style.top = d.y + "%";
                dot.onclick = (e) => { e.stopPropagation(); showDetail(d); };
                layer.appendChild(dot);
            });
        }
    }

    function saveData() { localStorage.setItem('aircraftDB', JSON.stringify(aircraftData)); }

    function exportData() {
        const finalCode = "const permanentData = " + JSON.stringify(aircraftData, null, 2) + ";";
        document.getElementById('export-area').value = finalCode;
        document.getElementById('export-area').select();
        alert("Backup code generated! Copy and paste into data.js.");
    }

    function loadManufacturers() {
        const sel = document.getElementById('select-fabrikant');
        Object.keys(aircraftData).sort().forEach(f => {
            let opt = document.createElement('option');
            opt.value = f; opt.text = f; sel.add(opt);
        });
    }

    function updateTypes() {
        const fab = document.getElementById('select-fabrikant').value;
        const sel = document.getElementById('select-type');
        sel.innerHTML = '<option value="">-- Select Type --</option>';
        if(aircraftData[fab]) {
            Object.keys(aircraftData[fab]).sort().forEach(t => {
                let opt = document.createElement('option');
                opt.value = t; opt.text = t; sel.add(opt);
            });
        }
        showImage();
        closeDetail();
    }

    function showImage() {
        const f = document.getElementById('select-fabrikant').value;
        const t = document.getElementById('select-type').value;
        const wrap = document.getElementById('wrapper');
        const img = document.getElementById('vliegtuig-beeld');
        if(f && t && aircraftData[f][t]) {
            img.src = "Images/" + aircraftData[f][t].img;
            img.onload = () => { wrap.style.display = "block"; renderDots(); };
            img.onerror = () => { alert("Silhouette image not found in Images folder."); wrap.style.display = "none"; };
        } else { wrap.style.display = "none"; }
        if(isEditor) checkDotEditor();
    }

    function renderDotList() {
        const f = document.getElementById('select-fabrikant').value;
        const t = document.getElementById('select-type').value;
        const list = document.getElementById('current-dots');
        list.innerHTML = "";
        if(aircraftData[f] && aircraftData[f][t]) {
            aircraftData[f][t].dots.forEach((d, i) => {
                const li = document.createElement('li');
                li.className = "dot-item";
                li.innerHTML = `<span><b>${d.info}</b> ${d.cnImg ? '<small>(with detail photo)</small>' : ''}</span> 
                                <button onclick="delDot(${i})" style="width:auto; background:#dc3545; color:white; padding:5px; border-radius:4px; border:none; cursor:pointer;">Delete</button>`;
                list.appendChild(li);
            });
        }
    }

    function delDot(i) {
        if(!confirm("Delete this dot?")) return;
        const f = document.getElementById('select-fabrikant').value;
        const t = document.getElementById('select-type').value;
        aircraftData[f][t].dots.splice(i, 1);
        saveData(); renderDots(); renderDotList();
    }

    function checkDotEditor() {
        const hasType = !!document.getElementById('select-type').value;
        document.getElementById('dot-editor').classList.toggle('hidden', !hasType);
        if(hasType) renderDotList();
    }

    loadManufacturers();
</script>
</body>
</html>
