<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin - Aircraft Data Generator</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; line-height: 1.6; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; }
        input, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background: #28a745; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; }
        #output-container { margin-top: 30px; display: none; }
        pre { background: #f4f4f4; padding: 15px; border: 1px solid #ddd; overflow-x: auto; white-space: pre-wrap; }
        .copy-hint { color: #666; font-size: 0.9em; }
    </style>
</head>
<body>
    <h1>Add New Aircraft</h1>
    <p>Fill in the details below to generate the JSON code for your database.</p>

    <div class="form-group">
        <label>Manufacturer (Brand):</label>
        <input type="text" id="brand" placeholder="e.g. Cessna">
    </div>
    <div class="form-group">
        <label>Model (Type):</label>
        <input type="text" id="type" placeholder="e.g. 172 Skyhawk">
    </div>
    <div class="form-group">
        <label>Plate Location Description (English):</label>
        <textarea id="location" rows="3" placeholder="Describe where to find the plate..."></textarea>
    </div>
    <div class="form-group">
        <label>Image Filename:</label>
        <input type="text" id="image" placeholder="e.g. cessna172.jpg (must match file in Images folder)">
    </div>

    <button onclick="generateJSON()">Generate Code</button>

    <div id="output-container">
        <h3>Copy this code:</h3>
        <p class="copy-hint">Copy the block below and paste it into your <strong>aircrafts.json</strong> file on GitHub.</p>
        <pre id="json-output"></pre>
    </div>

    <script>
        function generateJSON() {
            const brand = document.getElementById('brand').value;
            const type = document.getElementById('type').value;
            const location = document.getElementById('location').value;
            const image = document.getElementById('image').value;
            const id = Date.now(); // Generates a unique ID based on time

            const entry = {
                id: id,
                brand: brand,
                type: type,
                location: location,
                image: image
            };

            // Format as a single JSON object
            const jsonString = JSON.stringify(entry, null, 2);
            
            document.getElementById('json-output').textContent = ",\n" + jsonString;
            document.getElementById('output-container').style.display = 'block';
        }
    </script>
</body>
</html>
